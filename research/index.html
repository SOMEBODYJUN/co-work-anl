* { box-sizing:border-box }
body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--paper); color:var(--ink) }
header { padding:26px max(20px,calc((100vw - 1480px)/2)); background:#143b41; color:#f2f8f6 }

header p { max-width:900px; margin:9px 0 0; color:#d5e4e2 }
header a { color:#d0e8eb }
.shell { max-width:1480px; margin:auto; padding:20px; display:grid; grid-template-columns:minmax(0,1fr) minmax(270px,340px); gap:18px; align-items:start }
.tools { grid-column:1/-1; display:flex; gap:10px; flex-wrap:wrap; align-items:center }
input,select { border:1px solid #a9bcbf; border-radius:7px; padding:10px 12px; font:inherit; background:white; color:var(--ink) }
button.clear { border:1px solid #a9bcbf; border-radius:7px; padding:10px 12px; font:inherit; background:white; color:var(--ink); cursor:pointer }
input { flex:1 1 250px }
.count { color:var(--muted); margin-left:auto }
.routes { min-width:0; display:grid; gap:11px }
.route { background:var(--card); border:1px solid var(--line); border-left:5px solid var(--teal); padding:14px 16px; border-radius:9px; box-shadow:0 1px 3px #18394210 }
.route[data-kind=attacks] { border-left-color:var(--red) }
.route[data-kind=checks],.route[data-kind=limits] { border-left-color:var(--ochre) }
.route[data-kind=implements] { border-left-color:#556cac }
.meta { display:flex; gap:9px; align-items:center; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700 }
.relation { display:grid; grid-template-columns:minmax(0,1fr) 34px minmax(150px,32%); align-items:center; gap:8px; margin:13px 0 }
.premises { display:flex; flex-wrap:wrap; gap:5px; padding:8px; border:1px solid var(--line); border-radius:7px; background:#f8faf8; min-height:45px }
.junction { text-align:center; font-size:20px; color:var(--teal); font-weight:700 }
.node { border:1px solid #a6c9c4; color:#124d52; background:#e8f4f1; border-radius:5px; padding:5px 8px; font:inherit; font-size:13px; text-align:left; cursor:pointer }
.node:hover,.node:focus-visible { outline:2px solid var(--teal) }
.node small { display:block; font-size:11px; opacity:.78 }
.target { width:100%; background:#e5f0f3; border-color:#7da6af }
.route[data-kind=attacks] .target { background:#faeae7; border-color:#d1a29d; color:#7c3430 }
.route p { margin:6px 0; }
.refs { font-size:12px; color:var(--muted); overflow-wrap:anywhere }
a { color:#145c76 }
aside { position:sticky; top:16px; background:#fff; border:1px solid var(--line); border-radius:9px; padding:18px; max-height:calc(100vh - 32px); overflow:auto }
aside h2 { margin:0 0 10px; font-size:19px }
aside p { margin:9px 0 }
aside ul { padding-left:20px }
.badge { display:inline-block; padding:2px 7px; border-radius:4px; background:#e9efee; font-size:12px }
.empty { padding:24px; border:1px dashed var(--line); border-radius:9px }
@media(max-width:850px) { .shell { display:block } .tools { margin-bottom:12px } aside { position:static; max-height:none; margin-top:16px } }
@media(max-width:570px) { .relation { grid-template-columns:1fr; gap:3px } .junction { transform:rotate(90deg) } }

,"kind":"lemma","track":"extensions","title":"在途精确均衡与消失源客户的转移预算","detail":"Every global lexmax site-uniform feasible profile is an exact client NE; every deviator has positive on-path load when maximum reach is positive, with all four transfer inequalities including singleton-source clients.","refs":["research/current/multi_facility/uniform_two.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"MF-PACK-2","kind":"lemma","track":"extensions","title":"有界箱数装箱或单独安置重原子的二分引理","detail":"For all a>0 and h>=1, weights totaling <=(h+1)a fit h bins of load <=2a except isolated singleton weights >2a, by pair merging.","refs":["research/current/multi_facility/uniform_two.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"MF-PURE-CAP","kind":"lemma","track":"extensions","title":"完整客户博弈的纯均衡修复保留负载上界","detail":"At any fixed layout, isolated atoms heavier than B and ordinary loads <=B form a strict-improvement invariant; a pure exact NE exists in that invariant, for every B>0.","refs":["research/current/multi_facility/uniform_two.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"MF-CONT-COMPLETE","kind":"lemma","track":"extensions","title":"带标签布局的兼容完整续局组装","detail":"Exact on-path NE plus one exact NE at each actual deviation extend to a single complete rule; distinct coordinate deviations are distinct labeled layouts and all default subgames have pure NE.","refs":["research/current/multi_facility/uniform_two.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"SC-K-SYMMETRIC-MENU-OBSTRUCTION","kind":"claim","track":"extensions","title":"原模型有精确 SPE 但对称菜单威胁可无界","detail":"For each q>=3, the three-site weights q^2,1,q-1/4 yield a lexmax on-path witness with symmetric-menu ratio q^2/(q-1/4)>q after B->T, but alpha*=1 in the full model.","refs":["research/current/multi_facility/symmetric_menu_obstruction.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"SC-K-LEXMAX-BARRIER","kind":"claim","track":"extensions","title":"选定字典序极大占位的最优倍率可趋近二","detail":"For every k>=2,h>=2, the explicit k-site family has unique lexmax occupancy up to labels with optimal factor 2h/(h+1) under all on/off-path NE choices, but full-instance alpha*=1 at another layout.","refs":["research/current/multi_facility/lexmax_boundary.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"MF-MODEL","kind":"definition","track":"model","title":"任意数量带标签设施的共同目录模型","detail":"Positive atomic weights, common finite catalog, independent mixed exact client NE and a complete continuation at all labeled layouts.","refs":["research/current/multi_facility/model.md"],"status":"specified"},{"id":"MF-LEXMAX","kind":"construction","track":"extensions","title":"有限站点内均匀混合的字典序极大族","detail":"Optimize sorted facility loads over all layouts and feasible pure-to-site client assignments, then mix independently uniformly within the chosen site.","refs":["research/current/multi_facility/uniform_two.md"],"status":"finite exact construction; not polynomial time"},{"id":"MF-SYMMETRIC-FAMILY","kind":"construction","track":"extensions","title":"对称菜单障碍的三个原子重数参数族","detail":"k=q+1; weights q^2,1,q-1/4; covers {A,T},{A},{B}; on-path A^q B.","refs":["research/current/multi_facility/symmetric_menu_obstruction.md"],"status":"explicit family"},{"id":"MF-LEXMAX-FAMILY","kind":"construction","track":"extensions","title":"固定字典序占位障碍的 k 原子 h 参数族","detail":"Sites A,T and k-2 private anchors; weights h,1,3(h+1)/4 at each anchor; bad occupancy A,A,anchors and good occupancy T,A,anchors.","refs":["research/current/multi_facility/lexmax_boundary.md"],"status":"explicit family"},{"id":"MF-EXACT-CODE","kind":"artifact","track":"computation","title":"任意设施数精确构造器与完整续局评估器","detail":"Separate sibling package; exhaustive lexmax, cap-preserving pure equilibrium selection, deterministic defaults, rational certificate output.","refs":["research/current/multi_facility/uniform_two.md","multi_facility_spe/two_exists.py","multi_facility_spe/__main__.py"],"status":"implemented; exponential worst case"},{"id":"MF-EXACT-AUDIT","kind":"evidence","track":"evidence","title":"多设施定义级核验、逆向重构与障碍审计","detail":"Two main exact batches plus an explicit-family barrier audit; tests do not establish universal mathematical truth.","refs":["research/current/multi_facility/reverse_review.md","tests/multi_facility/definition_check.py","tests/multi_facility/run_exact_audit.py","tests/multi_facility/run_reverse_audit.py","tests/multi_facility/run_lexmax_barrier_audit.py","evidence/runs/kfac_two_exact.json","evidence/runs/kfac_two_reverse.json","evidence/runs/kfac_lexmax_barrier.json","tests/audits/kfac_independent.py","evidence/runs/kfac_independent.json"],"status":"finite exact evidence"},{"id":"GLMM04","kind":"source","track":"computation","title":"文献中的受限相同链多项式纯均衡修复","detail":"Published STOC 2004 theorem: from any feasible integer-weight assignment on identical restricted links, compute a pure Nash equilibrium with nonincreased makespan in time polynomial in job count, links, edges and log total weight.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"published fact"},{"id":"MF-PURE-CAP-POLY","kind":"lemma","track":"computation","title":"保持指定上界的完整客户均衡多项式修复","detail":"Given a rational pure assignment with isolated clients heavier than B and all ordinary loads at most B, deleting isolated resources, applying restricted-link Nashification, and reinserting them produces a full pure NE with ordinary loads at most B in input-bit-polynomial time.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal deduction from published theorem; unrefereed"},{"id":"SC-K-LEXMAX-STRONG-HARD","kind":"claim","track":"computation","title":"精确全局字典序极大选择的强 NP 完全性","detail":"On explicit positive-integer common-catalog inputs with k=site count and equal reaches, deciding whether the best site-uniform sorted load vector has minimum at least a threshold is strongly NP-complete by 3-PARTITION. The reduction family nevertheless has an easy exact SPE.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-LOCAL-PLS","kind":"lemma","track":"computation","title":"多项式字典序邻域的局部极大足以保证因子二","detail":"A locally maximal site-uniform state for all one-customer site transfers and canonical one-facility site transfers satisfies the exact customer NE and four budget inequalities. A polynomial-bit radix potential places this sufficient-state search in PLS, not necessarily P.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-GREEDY-BUDGET","kind":"lemma","track":"computation","title":"全部设施转移预算的多项式贪心构造","detail":"For any positive-reach rational common-catalog instance, repeated maximum of occupied-site W/(q+1) and unoccupied-site new-coverage weight produces positive facility loads and all four orphan-aware transfer budgets in polynomial time; it can fail on-path client NE.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof and independent attack; unrefereed"},{"id":"SC-K-GREEDY-UNOPENED-2","kind":"claim","track":"computation","title":"贪心未开目标保留因子二初始偏离上界","detail":"After any strict site-level customer improvement from the greedy assignment, all facility loads exceed the last insertion score gamma and unopened new reach is at most gamma; an abandoned singleton source contributes at most its own current load.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-EQUAL-MULT-GREEDY-2","kind":"claim","track":"computation","title":"贪心占位重数相等时的多项式因子二构造","detail":"If all greedily occupied sites have the same multiplicity q>=2, range-preserving restricted identical-link Nashification makes the on-path mixed customer NE and restores (5)-(6), then capped polynomial deviation repair yields a full factor-two continuation.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-DISTINCT-GREEDY-3","kind":"claim","track":"computation","title":"贪心全异址时的多项式因子三构造","detail":"If greedy occupies k distinct sites, range-preserving pure Nashification and makespan-preserving off-path completion give a bit-polynomial full factor-three continuation.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-COMPONENT-MULT-GREEDY-2","kind":"claim","track":"computation","title":"各交叠分量重数恒定时的多项式因子二构造","detail":"Customer-overlap components have constant q, with q=1 components singleton; range-preserving site Nashification separately by component preserves all original transfer budgets and produces a complete bit-polynomial factor-two continuation.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-GREEDY-STATIC-PACK-NO","kind":"claim","track":"computation","title":"贪心修复后冻结客户站点的上界装箱失败","detail":"Five sites, eight facilities and nine integer clients: a reachable exact site-uniform NE has B-load 41/2 and E two clients totaling 44, exceeding cap 41 after B facility moves; the source B survives, but E cannot be capped if its clients remain there.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete exact construction; internally checked; unrefereed"},{"id":"SC-K-GREEDY-CAP-INFEASIBLE","kind":"claim","track":"computation","title":"贪心修复后全局统一上界的离轨分配不可行","detail":"Six sites, eight facilities and ten integer customers; at one B-to-G deviation the on-path load is 41/2, while forced private 20 at B/E/G and shared 24 make every pure assignment exceed ordinary cap 41 without a >41 macro. An exact NE gives the deviator only 20.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete exact construction; internally checked; unrefereed"},{"id":"SC-K-GREEDY-MAX-MULT","kind":"lemma","track":"computation","title":"贪心原客户位于其可选的最大最终重数站点","detail":"If a client first assigned at site s can also use later opened t, then opening weights obey W_s^0>W_t^0; q_t>q_s contradicts greedy at the last insertion to t. Not asserted after client repair.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-DISTINCT-GREEDY-2","kind":"claim","track":"computation","title":"贪心全异址时的多项式因子二构造","detail":"The first maximum-reach site offers persistent insertion score R/2; range-preserving fixed-layout Nashification guarantees on-path load >=R/2 and every off-path payoff is <=R.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-RANGE-GREEDY-2","kind":"claim","track":"computation","title":"重数类别负载范围证书下的多项式因子二","detail":"Groupwise Nashification keeps initial per-facility load extrema and same-q client NE; each cross-q client passes a range inequality, while a pooled q=1 source inequality and a 2a initial deviator cap handle departures.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-LIGHT-COMPONENT-GREEDY-2","kind":"claim","track":"computation","title":"轻客户交叠保重数时的多项式因子二","detail":"Clients lighter than final greedy score have only same-q occupied alternatives; range certification follows for cross-q heavy clients and constructs exact factor two.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-GREEDY-HEAVY-OVERLAP-2","kind":"claim","track":"computation","title":"仅重客户交叠时的多项式因子二构造","detail":"If all clients spanning occupied sites weigh at least final greedy score, the unmodified greedy assignment is a customer NE and its transfer budgets yield exact factor two.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-GREEDY-REPAIR-ORDER-NO","kind":"claim","track":"computation","title":"任意严格贪心客户修复可丢失因子二","detail":"A six-site eight-facility integer instance has a reachable exact on-path NE whose B-to-G deviation is forced to ratio 32/15 in all mixed off-path NE; another reachable NE at the same layout retains budgets.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-GREEDY-HEAVIEST-NO","kind":"claim","track":"computation","title":"最重改善客户优先修复可丢失因子二","detail":"A related integer instance forces uniquely greatest-weight improving moves to an exact on-path NE with mixed-off-path deviation ratio 88/43; a different one-step NE retains budgets.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-TWO-SITE-COMPONENT-GREEDY-2","kind":"claim","track":"computation","title":"两站混合重数分量的多项式因子二构造","detail":"Greedy occupied-site overlap components of constant q or at most two sites admit a bit-polynomial full exact factor-two construction via descending-weight high-to-low client transfers, load box, and orphan-aware completion.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-GREEDY-FIXED-LEXMAX-NO","kind":"claim","track":"computation","title":"固定贪心占位的客户字典序极大可唯一选中坏均衡","detail":"In the six-site 32/15 integer instance, the unique fixed-layout site-pure/uniform customer lexmax is the bad exact NE, while another NE at that occupancy preserves factor two.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-GREEDY-FIXED-POTENTIAL-NO","kind":"claim","track":"computation","title":"固定贪心占位的客户势全局极小可唯一选中坏均衡","detail":"A second six-site integer instance has exactly two site-pure/uniform client NEs; exact potential values 86200 and 86264 make the unique global minimum the bad state with forced mixed-off-path ratio 215/107, while the other NE preserves budgets.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-ALL-OR-ONE-COMPONENT-GREEDY-2","kind":"claim","track":"computation","title":"单选或全分量选项的混合重数多项式因子二","detail":"Each mixed-q occupied component whose customers have one occupied option or all its sites admits descending-weight minimum-normalized-load assignment, exact on-path NE, greedy box and private-reserve singleton budgets; a full exact factor-two continuation is bit-polynomial.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-DESCENT-ONLY-TRAP-NO","kind":"claim","track":"computation","title":"唯一向低重数修复路径仍需向上返回","detail":"A strict-greedy three-site six-client integer chain has a unique maximal sequence of nonincreasing-q strict moves ending at a non-NE state; a weight-2 customer must return upward, though a true NE exists.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-NESTED-ANCHOR-GREEDY-2","kind":"claim","track":"computation","title":"按权值排序的嵌套锚定部分交叠多项式因子二","detail":"In each mixed-q greedy overlap component, the first-opened site covers all multi-option customers and their eligible occupied sets expand in nonincreasing weight order; restricted list assignment yields exact NE, the greedy load box and singleton private reserves give all deviations.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"E-K-NESTED-ANCHOR-AUDIT","kind":"evidence","track":"evidence","title":"嵌套锚与逆序选项的有限精确审计","detail":"Fraction calculations reproduce strict greedy sequence, on-path NE, range failure, and the failure of the unrestricted reversed-option list rule; finite check does not prove universal bound.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_nested_anchor.py","examples/multi_facili uler.","refs":["research/current/multi_facility/greedy_box_global_progress.md","research/current/multi_facility/polytime_frontier.md"],"status":"complete current proof, independently internally reviewed; unrefereed"},{"id":"SC-K-BOX-STRUCTURED-POLY-2","kind":"claim","track":"computation","title":"两类结构化盒动态规划的多项式因子二","detail":"Universal frozen-heavy greedy box feasibility makes either existing bounded individual-incidence width/degree DP or bounded site-primal width/local-weight-diversity DP a total bit-polynomial selector; BOX-TO-2 completes the rule. No two-option/depth-two condition is needed. Old claim scopes are retained; DP and imported scheduler lack canonical implementations.","refs":["research/current/multi_facility/greedy_box_global_progress.md","research/current/multi_facility/bounded_incidence_box.md","research/current/multi_facility/local_weight_box_dp.md"],"status":"complete current proof, independently internally reviewed; unrefereed"},{"id":"MF-GREEDY-BOX-CODE","kind":"artifact","track":"computation","title":"精确贪心盒构造与有限完整续局实现","detail":"Fraction implementation of deterministic H-guarded improvement plus return repair with exact final checks, connected to finite off-path/default pure best responses. No general polynomial runtime guarantee.","refs":["research/current/multi_facility/greedy_box_global_progress.md","multi_facility_spe/greedy_box.py","multi_facility_spe/__main__.py","multi_facility_spe/two_exists.py"],"status":"implemented; finite exact construction, no general polynomial time bound"},{"id":"E-K-GREEDY-BOX-GLOBAL-AUDIT","kind":"evidence","track":"evidence","title":"截断势与贪心盒构造的有限精确核验","detail":"Independent Fraction transitions, boundary cases, finite constructor and certificate checks; the frozen run is finite implementation evidence and does not prove universal existence, termination or polynomial complexity.","refs":["research/current/multi_facility/greedy_box_global_progress.md","tests/test_greedy_box_global.py","tests/audits/kfac_greedy_bo ry multiplicity expansion, and explicit rejection of unequal movable weights; connected finite complete continuation.","refs":["research/current/multi_facility/equal_light_flow.md","multi_facility_spe/equal_light_flow.py","multi_facility_spe/greedy_box.py","multi_facility_spe/__main__.py"],"status":"polynomial on-path implementation; finite off-path completion"},{"id":"E-K-EQUAL-LIGHT-FLOW-AUDIT","kind":"evidence","track":"evidence","title":"全部全局势极小与残量边界的独立核验","detail":"Two separate exact enumeration oracles check canonical global optimizers. The second audit separately instruments SHA-256-locked attached source residuals, not canonical internals. Finite checks do not prove the theorem.","refs":["research/current/multi_facility/equal_light_flow.md","tests/audits/kfac_equal_light_flow.py","tests/audits/kfac_equal_light_flow_adversary.py","evidence/runs/2026-10-07/equal_light_flow.json","evidence/runs/2026-10-07/equal_light_flow_adversary.json"],"status":"finite independent exact checks"},{"id":"E-K-EQUAL-LIGHT-CONTINUATION-AUDIT","kind":"evidence","track":"evidence","title":"原模型等轻权流完整续局的精确核验","detail":"Independent conditional-cost oracle validates 301 certificates, 1338 actual labeled deviations and 5613 complete-rule layout evaluations, including 4302 defaults. CLI refuses overwrite and unequal movable weights.","refs":["research/current/multi_facility/equal_light_flow.md","tests/audits/kfac_equal_light_flow_continuation.py","evidence/runs/2026-10-07/equal_light_flow_continuation.json","evidence/certificates/multi_facility/equal_light_flow_complete.json"],"status":"finite original-definition exact checks"},{"id":"MF-EQUAL-LIGHT-LOCAL-NE-OUTSIDE-BOX","kind":"counterexample","track":"computation","title":"等轻权精确客户均衡仍可违反下盒","detail":"Strict greedy real input gives q=(3,2,1,1), c=(1/10,1/10,1/25,0), delta=1/2 and menus HM,ML. Away assignment is exact NE plus H with X_H=-2/5, but is not the global optimizer.","refs":["research/current/multi_facility/equal_light_flow.md","examples/multi_facility/equal_light_flow_local_ne.json","tests/audits/kfac_equal_light_flow_adversary.py"],"status":"strict greedy exact selector boundary"},{"id":"MF-COMPLEMENT-DATA","kind":"definition","track":"computation","title":"共单例仿射博弈与有序有界导入域","detail":"Source chooses an excluded resource in A and uses the remaining resources, with positive individual weights, integer speeds and nonnegative backgrounds. Ordered abstract box data have c in [0,1], w in (0,1), home=min A; inverse imports additionally require initial load bands.","refs":["research/current/multi_facility/complement_search_reduction.md"],"status":"exact input definition"},{"id":"SC-K-COMPLEMENT-GREEDY-REDUCTION","kind":"claim","track":"computation","title":"共单例搜索向真实贪心盒的保真嵌入","detail":"Positive private clients realize original multiplicities without amplification, gamma=1, all-state full boxes and strict H. Costs, NE, weighted potentials and specified rule correspond from actual greedy homes. Compilation is polynomial in explicit k; two speeds 1,2 make a usual source-bit search reduction. No solver or hardness.","refs":["research/current/multi_facility/complement_search_reduction.md","history/source/notes/multi_facility/complement_reduction_pro_report_2026-10-08.md"],"status":"complete current proof, internally reconstructed and exactly audited; unrefereed"},{"id":"SC-K-BOX-BOUNDED-COMPLEMENT","kind":"claim","track":"computation","title":"一般盒内选择的有界共单例均衡表述","detail":"Y_t=q_t M-X_t preserves all deviations and turns full boxes into q_t M-1<=Y_t<=q_t M. Computation does not expand binary q. Reverse mapping requires the exact compatible home, weight and initial-band contract; arbitrary unbounded NE is insufficient.","refs":["research/current/multi_facility/complement_search_reduction.md","history/source/notes/multi_facility/complement_reduction_pro_report_2026-10-08.md"],"status":"complete current proof, internally reconstructed and exactly audited; unrefereed"},{"id":"MF-COMPLEMENT-CODE","kind":"artifact","track":"computation","title":"共单例搜索编译、有界导入与均衡解码程序","detail":"Exact numeric I/O and literal canonical greedy; actual Instance interface and supplied-NE verification. Reuses only numeric I/O from equal-light module, never its solver. CLI preserves existing files.","refs":["research/current/multi_facility/complement_search_reduction.md","multi_facility_spe/complement_reduction.py"],"status":"implemented interfaces only; no equilibrium solver"},{"id":"E-K-COMPLEMENT-AUDIT","kind":"evidence","track":"evidence","title":"源博弈与带标签设施模型的定义级精确审计","detail":"448 paired-tie compilations, 5718 states, 45372 cross-site deviations, 179338 physical conditional costs, 224 canonical trajectory checks, and 700 bounded imports with 9930 states; repeated runs not aggregated. Large numeric I/O and strict unbounded-NE boundary have separate regressions.","refs":["research/current/multi_facility/complement_search_reduction.md","tests/audits/kfac_complement_reduction.py","tests/test_complement_reduction.py","evidence/runs/2026-10-08/complement_reduction_final.json"],"status":"finite internal definition-level checks"},{"id":"FOUR-PARTITION-SOURCE","kind":"source","track":"computation","title":"二进制 PARTITION 的 NP 完全性文献基线","detail":"Nonempty positive binary integer PARTITION is NP-complete; the only imported complexity fact.","refs":["research/current/shared/four_site_no_fptas.md"],"status":"standard literature fact"},{"id":"FOUR-BALANCE-ENC","kind":"lemma","track":"computation","title":"近平衡单位值的精确划分编码","detail":"n=2max(t,2), positive variable weights sum to n with total perturbation at most 1/(8n); signed balance iff source PARTITION YES.","refs":["research/current/shared/four_site_no_fptas.md"],"status":"independently internally audited; unrefereed"},{"id":"FOUR-GLOBAL-GAP","kind":"lemma","track":"computation","title":"四地点完整续局的全局严格间隙","detail":"YES alpha*=13/10; NO all sixteen labeled on-path layouts and all real-probability exact independent-mixed NE continuations require >=13/10+1/(100n^2). Positive integer polynomial-size realization.","refs":["research/current/shared/four_site_no_fptas.md"],"status":"independently internally audited; unrefereed"},{"id":"SC-FOUR-NO-FPTAS","kind":"claim","track":"computation","title":"四共同地点实例最优倍率不存在 FPTAS","detail":"Two labeled facilities, exactly four common sites, positive binary integer atomic weights, exact independent-mixed full continuation. Under P!=NP no additive or multiplicative FPTAS with explicit rational output. Does not exclude PTAS or arbitrary boxed NE search.","refs":["research/current/shared/four_site_no_fptas.md"],"status":"complete current proof with independent internal audits; unrefereed"},{"id":"FOUR-FPTAS-BUILDER","kind":"artifact","track":"computation","title":"四地点正整数间隙实例构造器","detail":"Constructs the explicit positive integer instance in source-bit-polynomial time, without any partition or NE oracle.","refs":["research/current/shared/four_site_no_fptas.md","facility_spe/shared/four_site_fptas_hardness.py"],"status":"canonical constructor, not an equilibrium solver"},{"id":"E-FOUR-FPTAS-AUDIT","kind":"evidence","track":"computation","title":"四地点间隙的两套独立精确审计","detail":"32-source full-layout support audit and independent 19-source core/unique-layout audit plus analytic diagonal guards. Overlapping samples and repeated closed supports are not aggregated; no original archive obtained.","refs":["research/current/shared/four_site_no_fptas.md","research/reviews/facility/four_site_no_fptas.md","tests/audits/four_site_fptas.py","tests/audits/four_site_fptas_independent.py","evidence/runs/2026-10-09/four_site_fptas.json","evidence/runs/2026-10-09/four_site_fptas_independent.json"],"status":"finite internal definition-level checks"},{"id":"SC-TWO-NEAR-BAND-REP","kind":"claim","track":"computation","title":"固定重客户支持的中心带精确均衡补全","detail":"Positive rational two-facility local game; light w<=H, heavy w>H with fixed pure/mixed supports. Deterministic bit-polynomial existence test and exact rational NE representative in abs(Delta)<=H. No prescribed-Delta optimization or general k claim.","refs":["research/current/shared/near_band_completion.md"],"status":"complete local proof with independent internal audits; global EPTAS candidate not registered"},{"id":"Q-SC-ALPHA-EPTAS","kind":"obligation","track":"computation","title":"待解：一般共同目录实例最优 EPTAS 候选","detail":"Concrete heavy-support spectra and central exact representative yield a C^2 candidate error argument. Formal general algorithm, bit complexity, canonical implementation and full-output audit remain to deliver; no EPTAS theorem registered.","refs":["research/current/shared/near_band_completion.md","research/questions/shared_alpha_eptas.md","history/source/notes/publication/facility_eptas_direction_debate_2026-10-09.md"],"status":"concrete candidate; formal algorithm theorem not registered"},{"id":"E-NEAR-BAND-AUDITS","kind":"evidence","track":"evidence","title":"中心带与初步全局构造的独立精确审计","detail":"1322 fixed-support inputs; independent 2004 local inputs and 8000 heavy supports; global prototype 186 inputs and 2976 labeled layouts. Overlapping samples not aggregated. Finite checks do not prove the EPTAS.","refs":["research/current/shared/near_band_completion.md","tests/audits/near_band_completion.py","tests/audits/near_band_completion_independent.py","tests/audits/shared_eptas_candidate.py","evidence/runs/2026-10-09/near_band_completion.json","evidence/runs/2026-10-09/near_band_completion_independent.json","evidence/runs/2026-10-09/shared_eptas_candidate.json"],"status":"finite internal exact attacks; no universal EPTAS certificate"},{"id":"CAG-PAPER","kind":"source","track":"extensions","title":"Deng 等人顺序客户吸引半覆盖猜想的文献来源","detail":"Paper §2 and Definition 4 specify equal-sharing customer attraction; §5 proves the two-player bound and gives a shared-catalog lower family. §6 proposes the general upper bound. Exact catalog scope is fixed independently for this branch.","refs":["research/current/customer_attraction/model.md","research/current/customer_attraction/literature.md"],"status":"primary-source facts checked; no general upper theorem imported"},{"id":"CAG-MODEL","kind":"definition","track":"extensions","title":"共同主题顺序选择与单位客户固定均分模型","detail":"Finite common labeled catalog, unit providers moving once in order, unit customers sharing among all coverers; pure SPE requires every ordered history, including arbitrary ties.","refs":["research/current/customer_attraction/model.md"],"status":"specified"},{"id":"Q-CAG-HALF","kind":"obligation","track":"extensions","title":"待解：共同目录全部纯 SPE 的半最优覆盖","detail":"For every finite CAG-MODEL instance, every m>=1 and every full history-dependent pure SPE, OPT_m<=2W. Still unresolved; no target counterexample is certified. At most six distinct maximal coverages are proved for every m; the remaining scope requires m>=5 and at least seven maxima. Actual root total tax is now refuted by a61-unit full SPE, and all-p compensated budgets by the existing36-unit full SPE; individual unrestricted security is false by a34-unit n3 SPE; aggregate unrestricted security remains open. A separate audited source checkpoint covers exactly seven maxima for n>=7; its n5/n6 orbit list is incomplete. See the explicit two-task general handoff. A new exact safety-chain identity leaves the weaker bridge W>=(n-1/2)v_n open; genuine local failures rule out stepwise nonnegative induction, while terminal dual transport isolates the unpaid all-history transfer tensor.","refs":["research/current/customer_attraction/README.md","research/questions/customer_attraction_half_coverage.md","research/questions/customer_attraction_general_handoff.md"],"status":"open"},{"id":"CA-EXACT-PURE-SPE-ALL","kind":"claim","track":"extensions","title":"全部纯 SPE 终局的精确集合值枚举","detail":"At each prefix count k, retain child terminals with own payoff at least max_b min_child_b payoff_b. Necessary and sufficient for all ordered-history pure SPE terminal counts; reconstruct a full strategy for every retained terminal. Finite, not bit-polynomial.","refs":["research/current/customer_attraction/exact_solver.md"],"status":"complete finite recursion proof and independent exact oracle; unrefereed"},{"id":"CA-CONTINUATION-WITNESSES","kind":"construction","track":"extensions","title":"击败三条辅助桥的完整有限策略见证","detail":"Explicit common-catalog unit-customer strategies: two-player SPE not PNE, same-count ordered histories with different replies and nonmonotone payoffs, and a five-theme residual-floor counterexample.","refs":["research/current/customer_attraction/literature.md","research/current/customer_attraction/continuation_lemmas.md"],"status":"specified and independently exactly checked"},{"id":"CA-SPE-NON-PNE","kind":"claim","track":"extensions","title":"共同目录 SPE 终局未必是静态纯纳什均衡","detail":"There exists a two-player four-unit-customer common catalog and complete pure SPE whose terminal admits a profitable static action deviation; a separate three-player three-customer witness is included.","refs":["research/current/customer_attraction/literature.md","research/current/customer_attraction/continuation_lemmas.md"],"status":"complete direct reconstruction and independent exact certificates; unrefereed"},{"id":"CA-HISTORY-TIES","kind":"claim","track":"extensions","title":"任意历史依赖平局击败状态与收益简化","detail":"There exists a three-player two-singleton common-catalog full pure SPE with different replies at equal-count histories AB and BA and payoffs (1/2,1,1/2). Neither direction of chronological payoff monotonicity is universal.","refs":["research/current/customer_attraction/continuation_lemmas.md"],"status":"complete direct reconstruction and independent exact certificates; unrefereed"},{"id":"CA-RESIDUAL-NO","kind":"claim","track":"extensions","title":"逐人及平均遗漏覆盖收益保底均为假","detail":"Two players, five shared themes and 14 unit customers admit a complete pure SPE with u=(4,5), W=9, OPT=10 and maximum untouched theme size 5. Thus both u_i>=max untouched and W>=m max untouched are false; half coverage is not refuted.","refs":["research/current/customer_attraction/continuation_lemmas.md"],"status":"complete direct reconstruction and independent exact certificates; unrefereed"},{"id":"CA-STATIC-BRIDGE","kind":"rejected","track":"extensions","title":"已否定：把 SPE 等同静态 PNE 以导入平滑性","detail":"A sequential deviation can change follower choices, so full SPE does not provide fixed-other-action Nash inequalities.","refs":["research/current/customer_attraction/literature.md"],"status":"refuted bridge"},{"id":"CA-STATE-BRIDGE","kind":"rejected","track":"extensions","title":"已否定：强加匿名平局或玩家收益单调性","detail":"Count-set memoization does not constrain a full strategy to be Markov. Both chronological monotonicities are false.","refs":["research/current/customer_attraction/continuation_lemmas.md"],"status":"refuted bridge"},{"id":"CA-RESIDUAL-BRIDGE","kind":"rejected","track":"extensions","title":"已否定：按每人未触及质量支付最优主题","detail":"Per-agent and aggregate maximum-residual bounds fail through overlapping follower response cycles. Optimal portfolio coverage must be retained in a new proof.","refs":["research/current/customer_attraction/continuation_lemmas.md"],"status":"refuted bridge"},{"id":"CA-EXACT-CODE","kind":"construction","track":"extensions","title":"顺序客户吸引的规范有限求解器与核验器","detail":"Separate customer_attraction package with rational shares, set-valued recursion, full ordered-history strategies, independent definition-level verifier and exclusive-output CLI.","refs":["research/current/customer_attraction/exact_solver.md"],"status":"implemented finite exact contract"},{"id":"CA-EXACT-CHECKS","kind":"evidence","track":"extensions","title":"完整有序策略的独立微型枚举核验","detail":"Direct enumeration of complete strategy maps and individual-customer payoffs checks all attainable counts and paths for bounded inputs; boundary, CLI and witness regressions are additional finite checks.","refs":["research/current/customer_attraction/exact_solver.md"],"status":"finite exact checks only"},{"id":"CA-ATTACK-CHECKS","kind":"evidence","track":"extensions","title":"冻结有限搜索与完整策略反例的审计","detail":"Integer-scaled outcome search and independent unit-customer audits have frozen parameters and results. Earlier zero residual counterexamples do not survive the later five-theme exact witness.","refs":["research/current/customer_attraction/continuation_lemmas.md","research/current/customer_attraction/README.md"],"status":"finite exact checks only"},{"id":"CA-TWO-REMAINING-TAX","kind":"claim","track":"extensions","title":"固定前缀下恰两剩余玩家的税界","detail":"For every fixed legal incumbent prefix and arbitrary pure SPE of exactly two remaining unit providers, every comparison pair has remaining profit at most actual remaining profit plus sum_A 1/((b+1)(b+2)). Zero background reconstructs 3/2; general-m not asserted.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"complete algebraic proof and independent exact identity audit; unrefereed"},{"id":"CA-TAX-FRAME","kind":"definition","track":"extensions","title":"剩余利润目标与望远镜税表示","detail":"F_k(b) maximizes remaining-provider total profit, with pointwise c/(b+c), over k shared themes. The tax sums 1/(b+1)-1/(b+c+1). Nonzero background remaining profit is not total covered welfare.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"specified"},{"id":"CA-TAX-OPPORTUNITY-GAP","kind":"rejected","track":"extensions","title":"已否定：一般首步税机会成本桥","detail":"Empty-background three-player full SPE BBB has F3=15>u_first+tax(B)+F2(B)=29/2. Root total tax remains equality in this witness.","refs":["research/current/customer_attraction/tax_bridge_counterexample.md","research/current/customer_attraction/two_remaining_tax.md"],"status":"refuted by exact complete-history counterexample"},{"id":"CA-PORTFOLIO-WITNESS","kind":"construction","track":"extensions","title":"唯一最优组合与偏离匹配不足的完整见证","detail":"Two-player five-theme complete strategy with 86 unit clones: W=44, unique optimal support B,D has OPT=45, uncovered mass 42 and deviation matrix [[19,19],[22,22]].","refs":["research/current/customer_attraction/portfolio_matching_counterexample.md"],"status":"specified and independently exactly checked"},{"id":"CA-PORTFOLIO-MATCHING-NO","kind":"claim","track":"extensions","title":"即使可选择最优组合也未必存在足额偏离匹配","detail":"The displayed full SPE has a unique optimal theme support but every assignment of its themes to the two actual move positions yields deviation utility 41<42 omitted customers. This refutes the existential-optimum bridge, not half coverage.","refs":["research/current/customer_attraction/portfolio_matching_counterexample.md"],"status":"complete direct reconstruction and independent exact certificates; unrefereed"},{"id":"CA-PORTFOLIO-BRIDGE","kind":"rejected","track":"extensions","title":"已否定：用真实单方偏离收益匹配支付最优组合","detail":"The proposed existence of an optimal portfolio and permutation charging all omitted customers using real one-step deviation payoffs fails under history-dependent responses.","refs":["research/current/customer_attraction/portfolio_matching_counterexample.md"],"status":"refuted bridge"},{"id":"CA-TAX-IDENTITY-CHECKS","kind":"evidence","track":"extensions","title":"逐客户税恒等式的独立精确审计","detail":"All five binary membership indicators are enumerated for specified zero, positive and huge background loads. This checks formulas and remainder signs; universal proof is algebraic, not these runs.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"finite exact checks only"},{"id":"CA-PORTFOLIO-CHECKS","kind":"evidence","track":"extensions","title":"完整策略与唯一最优覆盖的独立审计","detail":"Direct unit-customer arithmetic verifies each full strategy branch, every two-theme optimum, unique optimal support and both deviation assignments; canonical verifier corroborates.","refs":["research/current/customer_attraction/portfolio_matching_counterexample.md"],"status":"finite exact checks only"},{"id":"CA-THREE-UPPER-142-81","kind":"claim","track":"extensions","title":"三玩家普遍覆盖福利上界 142/81","detail":"Every three-player full history-dependent pure SPE on any finite common catalog satisfies OPT3<=142W/81. Non-sharpness and general-m remain unresolved.","refs":["research/current/customer_attraction/three_player_bound.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-TAX-BRIDGE-NO","kind":"claim","track":"extensions","title":"空背景根节点的首步税桥反例","detail":"Four themes and 15 unit clients, complete always-B pure SPE: F3=15, actual W=9, first-step RHS=29/2; total root tax is equality, not refuted.","refs":["research/current/customer_attraction/tax_bridge_counterexample.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-GENERAL-TAX-NO","kind":"claim","track":"extensions","title":"一般既有背景下总税界的反例","detail":"Disjoint A7/B1/C1, seven-player full always-A SPE, reached prefix AAA with four remaining: F4=24/5>4+3/4; infinite exact family. Root coverage and zero-background total tax unaffected.","refs":["research/current/customer_attraction/general_tax_counterexample.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-STRATEGY-CONE","kind":"claim","track":"extensions","title":"每个完整有序策略的精确有理客户重数锥","detail":"For fixed m,p labeled common themes with possible duplicate coverage, full strategies define rational SPE multiplicity cones; normalized sections compact, worst ratio attained by integer clones, exact Farkas witnesses certify each cone.","refs":["research/current/customer_attraction/strategy_cone.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-COVERAGE-OPPORTUNITY-NO","kind":"claim","track":"extensions","title":"最优覆盖机会损失不能按期由当期收益支付","detail":"Full three-player SPE AAB with eleven unit clients: at the reached second node delta=F2(A)-F1(A)=3>u2=5/2. Global telescoping loss identity holds; total balance and half coverage remain unresolved.","refs":["research/current/customer_attraction/coverage_opportunity_counterexample.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-COVERAGE-BALANCE-GAP","kind":"obligation","track":"extensions","title":"待解：允许跨期转移的全局覆盖机会余额","detail":"Delta_i are nonnegative and telescope to OPT-W. The unresolved target is only the final sum_i(u_i-delta_i)>=0, equivalent to half coverage. Requiring every prefix balance nonnegative is false for every n>=4, and every fixed first-payoff multiplier alpha<2 also fails in some member of an analytic complete-SPE family. These failures preserve positive final half-coverage and root-tax margins.","refs":["research/current/customer_attraction/coverage_opportunity_counterexample.md","research/current/customer_attraction/prefix_balance_family.md","research/current/customer_attraction/prefix_balance_counterexample.md"],"status":"open global balance; not established by local comparisons"},{"id":"CA-FOUR-UPPER-1499-750","kind":"claim","track":"extensions","title":"四玩家低于二的普遍覆盖福利上界","detail":"Every four-player full history-dependent pure SPE on every finite common unit-sharing catalog satisfies OPT4<=1499W/750; all ties, repeated and empty themes included. Sharpness and general m>=5 unresolved.","refs":["research/current/customer_attraction/four_player_bound.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-LAST-NODE-OPT-TAX","kind":"claim","track":"extensions","title":"末位最优比较与根前缀税的关系","detail":"Every m-player path with a true last-node best response satisfies OPT_m<=m*u_m+tau_0(c_<m). Root-tax failures require u_m>W/m; this does not prove general root tax or half coverage.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-THREE-SHARP-5-3","kind":"claim","track":"extensions","title":"三玩家全部纯 SPE 的尖锐 5/3 福利比","detail":"Any finite common catalog, exactly three unit providers and every full ordered-history pure SPE satisfy OPT3<=5W/3. Eight genuine incentive slack types and an atomwise nonnegative identity prove the upper bound; full always-big SPE attains 5/3. No general-m or novelty claim.","refs":["research/current/customer_attraction/three_player_sharp.md"],"status":"complete sharp three-player proof with independent internal reviews and exact audit; unrefereed"},{"id":"CA-DISJOINT-MAXIMA-2M1","kind":"claim","track":"extensions","title":"互不相交极大花瓣目录的任意人数尖锐界","detail":"After removing the common customer core, distinct inclusion-maximal topic petals are pairwise disjoint. Every full-history pure SPE chooses maximal petals at every history and satisfies OPT_m<=C+(2-1/m)(W-C); sharp. Internal subsets may overlap; general maximal overlap excluded.","refs":["research/current/customer_attraction/disjoint_maxima_bound.md"],"status":"complete structural-class proof with independent internal review and exact audit; unrefereed"},{"id":"CA-UNIFORM-PORTFOLIO-TWO","kind":"claim","track":"extensions","title":"两剩余玩家的合法平均真实偏离接口","detail":"Every legal fixed background with exactly two remaining players satisfies 2R_d(T,S)<=R_d(A,B)+V1T+V1S+V2T+V2S. Four genuine last-node comparisons and a symbolic nonnegative identity cover all history-dependent ties. The arbitrary-player averaged interface remains unproved.","refs":["research/current/customer_attraction/global_new_uniform_portfolio_two.md"],"status":"complete two-remaining-player identity with independent internal review and exact audit; unrefereed"},{"id":"CA-FIVE-LIFT-ROWS-NO","kind":"claim","track":"extensions","title":"指定五玩家双根线性松弛无法证明半覆盖","detail":"A rational 23-mask point satisfies all 460 specified necessary rows with W=1 and auxiliary O>2. It has no complete strategy or actual optimum interpretation; this refutes only this linear proof template, not a CAG/SPE conjecture.","refs":["research/current/customer_attraction/five_player_lift_obstruction.md"],"status":"complete relaxation obstruction with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-CREDIBLE-CONTINUATIONS","kind":"claim","track":"extensions","title":"全部可信完整续局与精确联合候选接口","detail":"Recursive credible child menus realize every full-history pure SPE for a fixed instance and target terminal, with finite full support in uniform mode. A fixed-path joint MILP has rigorous M=m bounds; candidates require exact certificate verification. Two selected five-player cones have exact ratios 8/5 and 7/5, with no universal inference.","refs":["research/current/customer_attraction/credible_continuations.md"],"status":"complete finite-interface proof and exact selected-certificate audits; unrefereed"},{"id":"CA-UNIFORM-ROOT-GAP","kind":"obligation","track":"extensions","title":"待解：任意人数根节点的真实前缀平均偏离","detail":"Unproved stronger interface m|union T_j|<=(m-1)W+sum_ij V_ij for m>=3; all V use the original ordered prefix and the specified full strategy. If valid, it gives sharp 2-1/m. Changing follower choices changes later replies; frozen portfolios are not legal comparisons.","refs":["research/current/customer_attraction/global_new_uniform_portfolio_two.md"],"status":"open"},{"id":"CA-LAST-TWO-FLOOR","kind":"claim","track":"extensions","title":"末两名玩家分别达到局部最坏末回复保底","detail":"At every fixed ordered history with exactly two remaining unit providers, each actual SPE payoff is at least theta(P)=min_A max_B U_p(B,A). Any maximizer of f_p(A) guarantees this against every true last-player best response. Includes ties, repeats and arbitrary incumbent backgrounds.","refs":["research/current/customer_attraction/last_two_floor.md"],"status":"complete current proof with independent exact audit; unrefereed"},{"id":"CA-ALL-N-WELFARE-4N","kind":"claim","track":"extensions","title":"无结构任意人数的较弱通用福利保证","detail":"For all n>=2 and all complete-history pure SPE in CAG-MODEL, W>=4(n-1)OPT_n/[n(2n-1)]. It follows from the two last-player floors and K/n for others. Weaker than the current three- and four-player theorems; does not prove general half coverage.","refs":["research/current/customer_attraction/last_two_floor.md"],"status":"complete current proof with independent exact audit; unrefereed"},{"id":"CA-LAST-FLOOR-ALL-PLAYERS-NO","kind":"claim","track":"extensions","title":"四玩家完整 SPE 否定所有人的 θ 收益保底","detail":"One valid four-player, twelve-topic unit-customer game has global theta=6135346 and first-player payoff 6135345 in a saved complete SPE. All 1885 ordered decision histories are independently replayed. W=24541476, OPT4=24541532, so the half-coverage conjecture is not refuted.","refs":["research/current/customer_attraction/uploaded_tool_audit.md"],"status":"complete current proof with independent exact audit; unrefereed"},{"id":"CA-MOBIUS-BOOLEAN","kind":"claim","track":"extensions","title":"任意布尔子集势的唯一有符号单位客户表示","detail":"For p>=1 and rational F:2^[p]->Q with F(empty)=0, the two Mobius inversions uniquely determine signed customer-type coefficients whose harmonic potential equals F on all square-free profiles. This determines its repeated-count extension; nonnegative inverse is necessary and sufficient after positive denominator scaling.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-MOBIUS-FULL-HISTORY-EMBED","kind":"claim","track":"extensions","title":"禁止重复的边际收益博弈之完整历史嵌入","detail":"For p>=n>=1, integer signed coefficients x and K=4sum|x_B|+1 give strictly positive integer unit-customer types x_B+K. Every complete CAG SPE chooses unused labels at every history, including repeated off-path histories. Restrictions to no-repeat histories are exactly all SPEs of the marginal-payoff subset-potential game. Roots, ordered root paths and fresh ties correspond; not arbitrary payoff tables.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-MOBIUS-BIAS-BARRIER","kind":"claim","track":"extensions","title":"安全正化编译的福利偏置阻止半覆盖反例","detail":"Under the full-history compiler conditions, root SPE and OPT both use n distinct labels, with common coverage bias K(2^p-2^(p-n)). Hence 2W-OPT >= K(2^p-2^(p-n))-3sum|x_B|>0. Welfare ratios are not preserved. For n>=5, OPT/W<125/123.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-THREE-REMAINING-PROFIT-5-3","kind":"claim","track":"extensions","title":"任意固定背景下三剩余玩家的尖锐利润界","detail":"At any fixed legal ordered prefix with exactly three remaining unit providers, every complete-history pure SPE satisfies max_{T1,T2,T3} R_b(T1,T2,T3) <=(5/3)R_b(actual). R_b sums the three remaining profits, not total coverage; every history tie and repeated/empty theme is allowed. A nonnegative coefficient identity covers all backgrounds, and zero background attains the uniform factor.","refs":["research/current/customer_attraction/three_remaining_profit_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-FOUR-REMAINING-PROFIT-1499-750","kind":"claim","track":"extensions","title":"任意背景四剩余玩家的 1499/750 利润界","detail":"At any fixed legal ordered prefix with exactly four remaining unit providers, every complete-history pure SPE satisfies max_{T1,T2,T3,T4} R_b(T1,T2,T3,T4) <=(1499/750)R_b(actual). R_b is remaining total profit, not global coverage. Corrected background pair/last aggregation, actual D/Q/R/S deviation nodes and all nonnegative cubic customer coefficients cover every background, tie, repeated or empty theme. Sharpness is not claimed.","refs":["research/current/customer_attraction/four_remaining_profit_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-SUNFLOWER-MAXIMA-2M1","kind":"claim","track":"extensions","title":"向日葵极大主题目录的任意人数尖锐覆盖界","detail":"Every finite common catalog whose distinct inclusion-maximal themes are C disjoint-union P_j with pairwise disjoint private petals, arbitrary internal subthemes, every n>=1 and every complete-history pure SPE: OPT_n<=|C|+(2-1/n)(W-|C|). In particular any catalog with at most two distinct maximal coverage sets. Does not require all actions maximal or the terminal to be PNE.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-MAXIMA-SUPERSET-SEATS","kind":"claim","track":"extensions","title":"任意共同目录的超集席位收益保证","detail":"Assign every catalog theme to an inclusion-maximal superset B_j. With w_j globally private clients and v_j remaining clients, f_j(k)=w_j/k+v_j/n, the n-th largest seat nu guarantees every player of every full-history pure SPE u_i>=nu and W>=n nu. At any prefix R(p,L)>=remaining players guarantees each remaining payoff>=L. Shared-client union budget is unresolved.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-SUNFLOWER-PRIVATE-GAP","kind":"claim","track":"extensions","title":"私有花瓣间隙恢复全极大行动与单例稳定","detail":"In the sunflower class, if every nonmaximal theme misses a private client in at least one containing maximal theme, every complete-history pure SPE selects maximal themes at every history, and root petal counts are singleton PNE. Unique-maximal catalogs need no gap condition. Sunflower welfare requires no such extra condition.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-LAMINAR-INCIDENCE-THETA","kind":"claim","track":"extensions","title":"极大关联层级目录的全历史逐人 θ 保底","detail":"Every legal ordered prefix of a finite common unit catalog with laminar customer incidences among distinct maximal coverage sets: every remaining player in every complete-history pure SPE receives at least global theta_n. Arbitrary internal subsets, omitted cores, repeated actions and ties are retained.","refs":["research/current/customer_attraction/laminar_incidence_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-LAMINAR-INCIDENCE-MAXIMA-2M1","kind":"claim","track":"extensions","title":"极大关联层级目录的任意人数尖锐覆盖界","detail":"For every n>=1 in the preceding structural class, OPT_n<=c+(2-1/n)(W-c), c the common maximal core. The factor is sharp, strictly extends sunflower maximal themes, and is not an unrestricted catalog theorem.","refs":["research/current/customer_attraction/laminar_incidence_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-AGGREGATE-LAST-FLOOR-NO","kind":"claim","track":"extensions","title":"所有至少三人数下聚合末位 θ 保底均可失败","detail":"For every n>=3 a legal common unit catalog has a complete pure SPE with W=n theta_n-1. A compact n=3, six-topic, 36-unit-customer witness has payoffs (10,12,12), W=34, theta=12 and OPT=36. Refutes W>=n theta, not half coverage.","refs":["research/current/customer_attraction/aggregate_theta_counterexample.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-OBLIVIOUS-MIXED-SECURITY-2N1","kind":"claim","track":"extensions","title":"任意目录的不可适应混合安全值尖锐下界","detail":"For every finite common unit catalog and n>=1, max_p min_{fixed n-1 competing themes} E_p u >= OPT_n/(2n-1), sharp for every n. Opponents do not observe the random realization. Individual SPE security is false; the aggregate and weaker sufficient SPE bridges remain open.","refs":["research/current/customer_attraction/oblivious_security.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-ROOT-TAX-ORDER-COUNTS-NO","kind":"claim","track":"extensions","title":"终局计数不能决定根税界是否成立","detail":"For every n>=4 there is a static PNE count vector realizable by a full pure SPE whose credible ordered path has W+tax-OPT=1, while an alternative non-SPE order of exactly the same vector has OPT-W-tax=(n-1)(n-3)/n>0. Does not refute root tax for actual SPE paths.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-THREE-MAXIMA-HALF","kind":"claim","track":"extensions","title":"至多三个极大覆盖目录的任意人数半覆盖","detail":"For every finite common unit catalog with at most three distinct inclusion-maximal coverage sets, arbitrary internal subthemes and every complete ordered-history pure SPE: n>=2 gives OPT_n<=U<=c+2(W-c), where U is the maximal union and c its common core. n=1 and unique maxima are optimal. Crossed incidences are allowed; this class and unrestricted-size laminar incidence are incomparable. A sharper scalar certificate S=max(sum(a),n+max(a),3n/2) is proved; no welfare sharpness claim.","refs":["research/current/customer_attraction/three_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-FIVE-UPPER-221-100","kind":"claim","track":"extensions","title":"五单位玩家的普遍 221/100 覆盖上界","detail":"Exactly five unit providers, arbitrary finite common unit catalog and every complete ordered-history pure SPE at zero root background: OPT_5<=beta W<=221W/100, beta=24236714656727/10967499015623>2. Two true middle-player deviations and arbitrary-prefix two-player tax supply 21 legal nonnegative slacks; all 1024 customer types have exact nonnegative residuals. Empty and repeated topics included. Does not prove half coverage, sharpness, a background five-player bound, or n>=6.","refs":["research/current/customer_attraction/five_player_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-DYNAMIC-MAXIMA-FLOOR","kind":"claim","track":"extensions","title":"每个历史的动态极大覆盖路由收益保底","detail":"Any finite common unit catalog, n>=1 providers, s>=2 distinct inclusion-maximal coverages, arbitrary internal subthemes and every complete ordered-history pure SPE. U is the maximal union, c its maximal common core. At every legal prefix length t, the current payoff is at least c/n+(U-c)/D_t, D_t=max(t+s(n-t)/2,n+s-1); root W>=c+Gamma_(n,s)(U-c), Gamma=sum_t 1/D_t. The full-union bound depends on s and does not solve unrestricted half coverage.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-DYNAMIC-MAXIMA-MIXED","kind":"claim","track":"extensions","title":"私有与共享客户分离的单调收益预算","detail":"Same all-history unit CAG domain with s>=2. P is total globally private mass and V=U-c-P. For t<n-1 let Z_t=t+s(n-t)/2, A_t=(n+t)/(2(t+1)Z_t), B_t=1/Z_t; at t=n-1 set A=1/(n+s-1), B=(n+1)/(n(n+s-1)). Their suffix minima give every current payoff at least c/n+P*underline(A)_t+V*underline(B)_t and W>=c+P*sum underline(A)+V*sum underline(B). A coefficient certificate, with no unrestricted half-coverage or optimality claim.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-FIVE-MAXIMA-HALF","kind":"claim","track":"extensions","title":"至多五个极大覆盖目录的任意人数半覆盖","detail":"Any finite common unit catalog with at most five distinct inclusion-maximal coverages, arbitrary internal subthemes, any n>=1 and every complete ordered-history pure SPE: OPT_n<=2W. For n>=5 also OPT_n=U<=2W-c. For n=5 and s>=2, W>=c+(5/9)P+(67027/125400)V. Cases n<=4 use existing unconditional bounds; n>=6 follows dynamic floors and Gamma>=4n^2/(7n^2+3n+14)>1/2. No general-six-or-more-maxima or sharpness claim.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-FIVE-REPLY-UPPER","kind":"claim","track":"extensions","title":"三个真实回复菜单改善五玩家普遍覆盖上界","detail":"Exactly five unit providers, arbitrary finite common catalog and every complete ordered-history pure SPE at zero root background: OPT_5<=beta W, beta=493266145873827/234749688354196 approximately 2.10124302755>2. Three true optimal-theme reply menus and 24 nonnegative slacks give an exact identity checked on all 49152 affine corners; empty and repeated topics included. No half-coverage, sharpness, arbitrary-background or n>=6 claim.","refs":["research/current/customer_attraction/five_player_reply_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-ONE-FOLLOWER-DECORRELATION","kind":"claim","track":"extensions","title":"任意背景单个可信后继的精确去相关恒等式","detail":"At any legal ordered history with exactly two providers remaining, every full pure SPE and every distribution p on the common finite catalog satisfy E_A U_d(A,B(A))-E_(A,Aprime iid p) U_d(A,B(Aprime))=E_(A,Aprime) [U_d(B(A),A)-U_d(B(Aprime),A)]>=0. The dual value restricted to actual competitor tuples is at most the current payoff. Empty/repeated topics and all history-dependent ties included; no extension to multiple followers.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-ADAPTIVE-DECORRELATION-NO","kind":"claim","track":"extensions","title":"多后继可信回复未必有利去相关","detail":"A saved four-provider, twelve-theme complete unit CAG SPE has true root replies c(4)=(2,3,11), c(9)=(6,7,3). Uniformly mixing queries 4 and 9 gives adaptive payoff minus independent reply payoff -11/4. All 1885 ordered nodes and 22620 action comparisons are replayed exactly. Refutes universal decorrelation, not u_i>=v_n, W>=n v_n or half coverage.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-ACTUAL-ROOT-TAIL-MENU-NO","kind":"claim","track":"extensions","title":"真实根续局菜单的对偶值可超过根 SPE 收益","detail":"A complete three-provider, six-theme, 36-unit-customer SPE has root payoff10, unrestricted oblivious security v_3=10, and restricted actual-root continuation-menu minimax value z_1=11. The two unused query rows sum to22 for every mixture; equal mixture attains11. All43 ordered nodes and258 comparisons pass. A stationary reply-kernel choice also gives cap11. Not a half-coverage or unrestricted security-bridge counterexample.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-CREDIBLE-MENU-SECURITY-NO-ALL-N","kind":"claim","track":"extensions","title":"所有至少三人数下真实根菜单安全值桥均可失败","detail":"For every n>=3, a legal finite common catalog with positive integer unit-customer multiplicities and a complete ordered-history pure SPE has restricted actual-root menu value z_1=u_1+1/2. A two-group Boolean-potential marginal game is positively compiled with K=4sum|x|+1; its two omitted query labels prove the menu lower bound and equal mixture proves equality. Expanding to all2n pure-group tail columns gives an explicit unrestricted dual cap<=u_1. Full-history existence uses M2; finite n=3..6 regressions do not replace the universal proof.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-SIX-MAXIMA-NO-PRIVATE-HALF","kind":"claim","track":"extensions","title":"无全局私有剩余客户的六极大目录半覆盖","detail":"CAG-MODEL, at most six distinct inclusion-maximal coverages, no customer outside their common core belonging to exactly one maximum, arbitrary internal subthemes and every complete ordered-history pure SPE: OPT_n<=2W for all n>=1; for n>=5 also OPT_n=U<=2W-c. Shared-only dynamic floors F(p,r) are nondecreasing along all routed successors. The n=5,6 branches have 67 explicit integer/12 path coefficient certificates covering all 3752 residual-incidence inequalities; n>=7 has an analytic reciprocal-sum bound, n<=4 uses existing universal bounds. This shared-only proof retains its own scope; the separate CA-SIX-MAXIMA-HALF joint budget proves unrestricted half coverage.","refs":["research/current/customer_attraction/six_maxima_no_private.md","evidence/runs/2026-10-10/customer_attraction_six_maxima_no_private_review.json"],"status":"complete current proof with independent internal reconstruction and exact rational audits; unrefereed"},{"id":"CA-SIX-MAXIMA-NINE-PLUS-HALF","kind":"claim","track":"extensions","title":"至少九玩家的一般六极大目录半覆盖","detail":"CAG-MODEL, at most six distinct inclusion-maximal coverages, arbitrary private and shared incidence, arbitrary internal subthemes, n>=9 and every complete ordered-history pure SPE: OPT_n=U<=2W-c. Fixed six-maxima mixed private coefficients each exceed or equal1/(2n), so their monotone envelope sums to at least1/2. Shared sum B_n=H_n−2(n−1)/[n(n+2)(n+5)] exceeds665881/1330560>1/2 for all n>=9 by an exact logarithm-series/trapezoid lower bound and decreasing correction. The separate CA-SIX-MAXIMA-HALF joint-budget theorem now covers n=5..8 and completes the unrestricted class.","refs":["research/current/customer_attraction/six_maxima_no_private.md","evidence/runs/2026-10-10/customer_attraction_six_maxima_nine_plus_review.json"],"status":"complete current proof with independent internal reconstruction and exact rational audits; unrefereed"},{"id":"CA-MOBIUS-SECURITY-BIAS-BARRIER","kind":"claim","track":"extensions","title":"标准正偏置编译不能反驳真正混合安全值保证","detail":"For p>=n>=2, arbitrary signed x and legal integer r_B=x_B+K, every n-distinct profile satisfies u_i-v_n>=K c-M, c=2^(p-n)(2^n-n-1)/(np)>=1/4 and M=sum|x_B|. A static dual uniform over all(n-1)-distinct-topic backgrounds gives this without SPE incentives. K=4M+1 and M2 imply individual margin>=1/4 and aggregate margin>=n/4 for every full-history root SPE. Smaller/nonuniform compensation remains open.","refs":["research/current/customer_attraction/compiler_security_barrier.md"],"status":"complete current proof with independent internal review and exact audits; unrefereed"},{"id":"CA-OPTIMAL-LAST-QUERY-SUM-NO","kind":"claim","track":"extensions","title":"最优比较主题的末节点查询总额可超过根 SPE 福利","detail":"A legal four-provider, seven-theme,1651-unit-customer complete pure SPE has path(E,G,A,C), payoffs(390,389,390,390), W1559, unique optimal support{B,C,D,F}, OPT1562. Against actual last-prefix(E,G,A), all four optimal query values equal390, giving1560>W; no alternate optimum repairs the bridge. All400 ordered nodes,2800 comparisons and210 terminal multisets pass two independent Fraction checks. A static dual cap4889/14<389 confirms that this instance satisfies the genuine mixed-security bridges.","refs":["research/current/customer_attraction/optimal_last_query_counterexample.md"],"status":"complete current proof with independent internal review and exact audits; unrefereed"},{"id":"CA-PREFIX-BALANCE-NO","kind":"claim","track":"extensions","title":"全部前缀非负及固定亚二首步收益乘子均失败","detail":"For every integer n>=4 a common n+2-theme catalog with 2n^2-2n-2 distinct unit customers has a complete ordered-history pure SPE with actual path A,B^(n-1), u1=n-1/n, W=n^2-2, unique optimal support all n leaves, OPT=2n^2-2n-2 and F_(n-1)(A)=OPT-2(n-2). Hence B1=4-n-1/n<0. For every fixed real alpha<2, some n in this same family violates alpha*u1+F_(n-1)(A)>=OPT. All-history Jensen and true-continuation cases prove the universal result; independent finite n4..8 audits are supplementary. Half gap 2(n-1) and root-tax gap (n-3)/2+1/(n-1)+1/n are positive.","refs":["research/current/customer_attraction/prefix_balance_family.md","research/current/customer_attraction/prefix_balance_counterexample.md"],"status":"complete current proof with two independent internal algebra reviews and exact audits; unrefereed"},{"id":"CA-FIVE-INDEXED-UPPER","kind":"claim","track":"extensions","title":"真实索引续局将五玩家普遍上界降至 2.061695","detail":"Exactly five unit providers, finite common catalog, zero root background and every complete ordered-history pure SPE: OPT_5<=beta W with beta=145473820534756099649387160645076613709/70560308704423797361284609157664425493 approximately2.06169478572>2. Indexed original-strategy second/third deviations yield437 necessary rows;57 nonnegative rational multipliers and complete6144 conditioned histogram residual ranges prove the exact identity. Arbitrary ties, empty/repeated themes and comparison indices retained. No n>=6, background or half-coverage claim.","refs":["research/current/customer_attraction/five_player_indexed_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-FIVE-INDEXED-ROWS-NO","kind":"claim","track":"extensions","title":"五玩家指定 437 行模板的精确最优值大于二","detail":"The precisely specified437-row indexed true-continuation necessary-condition relaxation with nonnegative type masses and W=1 has a64-atom exact rational feasible point O=beta>2. The matching universal dual makes beta its exact optimum. O is only the comparison-union variable; no complete SPE realization, genuine catalog OPT, original-game sharpness or conjecture counterexample is asserted.","refs":["research/current/customer_attraction/five_player_indexed_obstruction.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-SIX-MAXIMA-HALF","kind":"claim","track":"extensions","title":"至多六个极大覆盖任意关联目录的任意人数半覆盖","detail":"CAG-MODEL, at most six distinct inclusion-maximal coverages, arbitrary private/shared incidence, arbitrary internal subthemes and every complete ordered-history pure SPE: OPT_n<=2W for every n>=1; U<=2W for n>=5. Last actions must have maximal coverage. The five-player branch uses52 complete restricted-growth routing strings and32 valid slack rows per path; explicit nonnegative integer/10000 duals cover20080 exact customer/action membership columns. Six/seven/eight-player cases use the same path-free multipliers35/48,1/8,5/48,1/96 on a larger true-membership domain, verified on14112 columns and396 compressed cases. Earlier containers are never counted as true coverage. The old universal n<=4 bounds and analytic six-maxima n>=9 corollary complete all n. No universal core-strengthened U<=2W-c or seven-maxima claim.","refs":["research/current/customer_attraction/six_maxima_joint_bound.md","evidence/certificates/customer_attraction/six_maxima_joint_bound.json"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-ROOT-TAX-NO","kind":"claim","track":"extensions","title":"真实零背景完整 SPE 的根总税界失败","detail":"A four-provider six-theme61-unit-customer complete ordered-history pure SPE has actual pathAAAF, payoffs(9,9,9,11), W38, OPT61 and pre-last root tax45/2. The actual zero-background root total-tax gap is OPT-W-tax=1/2>0. This refutes root total tax, rather than a non-SPE reordering or nonzero-background version. Static safety v4=9 has matching certificates; individual and aggregate safety and half coverage hold in this instance.","refs":["research/current/customer_attraction/root_tax_counterexample.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-AGGREGATE-DECORRELATION-NO","kind":"claim","track":"extensions","title":"各后继差为零时聚合去相关仍可为负","detail":"A complete four-provider six-theme89-unit-customer SPE has W85, OPT89 and p on labels1,2 each half with aggregate decorrelation-1/48 and all later-player decorrelations zero. Incentive slack43/12 leaves compensated budget57/16>0. Matched unrestricted safety v4=508643/26546 gives W-4v4=110919/13273>0. The older36-unit certificate already also refutes aggregate decorrelation; the special zero-follower-decorrelation feature is preserved.","refs":["research/current/customer_attraction/global_security_budget_boundaries.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-ONPATH-DECOUPLED-BUDGET-NO","kind":"claim","track":"extensions","title":"全部查询分布补偿的在轨去相关预算失败","detail":"The existing36-unit three-provider six-theme complete SPE, with p on unusedX2,Y2 each half, has D=(10,12,12), C=(11,23/2,12), kappa=(-1,1/2,0) and every actual incentive slack zero. Thus W-sum C=-1/2 refutes the all-p compensated budgetGB. This p has static guarantee25/3 below optimalv3=10; BR and the restriction to safety-optimalp are not refuted.","refs":["research/current/customer_attraction/global_security_budget_boundaries.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-SECURITY-CONE-DUAL","kind":"claim","track":"extensions","title":"完整树 SPE 锥与无约束静态安全值对偶的精确等价","detail":"For a fixed complete ordered policy and rationalp, the entire rational SPE customer cone satisfies W>=n min_B beta_B(p).w iff one unrestricted static competitor distributionQ and nonnegative full-tree incentive multipliers lambda give c-n sumQ beta=Gamma^T lambda+r with r>=0. Finite minimax and Farkas prove equivalence; fixed-p universal certificate existence remains unresolved. Different-coverage catalogs require an existing legal realization of the policy for the perturbation argument. Standard extension of the existing strategy cone, not a new equilibrium mechanism or a universalBR proof.","refs":["research/current/customer_attraction/security_cone_duality.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-ROOT-TOTAL-TAX-GAP","kind":"rejected","track":"extensions","title":"已否定：真实 SPE 根总税的充分桥","detail":"The candidate OPT_n<=W+sum_x b_x/(b_x+1), with b only the actual firstn-1 choices, is false already at four providers; the61-unit complete certificate supplies a strict1/2 deficit.","refs":["research/current/customer_attraction/root_tax_counterexample.md"],"status":"refuted by exact complete-history counterexample"},{"id":"CA-ALL-P-COMPENSATED-BUDGET-GAP","kind":"rejected","track":"extensions","title":"已否定：全部查询分布的补偿预算","detail":"The condition W>=sum_i C_i(p) for everyp is false at a36-unit complete SPE. This does not disprove existence of a suitable safety-optimalp or arbitrary static safety dual.","refs":["research/current/customer_attraction/global_security_budget_boundaries.md"],"status":"refuted by exact complete-history counterexample"},{"id":"CA-ROOT-SECURITY-UPLOAD-CHECKS","kind":"evidence","track":"extensions","title":"完整历史与静态安全值证书的独立重放","detail":"Two independent exact implementations each check the61 and89 unit inputs on every259 ordered node, and36 unit input on all43 nodes; every claimed static safety value has matching rational primal/dual certificates. Separate independent mathematical review reconstructs the minimax/Farkas equivalence. Frozen reports distinguish finite counterexamples from universal certificate existence.","refs":["research/current/customer_attraction/global_security_budget_boundaries.md","evidence/runs/2026-10-10/customer_attraction_root_security_uploads.json","evidence/runs/2026-10-10/customer_attraction_security_cone_review.md"],"status":"exact finite replay plus independent mathematical review"},{"id":"CA-INDIVIDUAL-SECURITY-NO","kind":"claim","track":"extensions","title":"三玩家已可否定逐人无约束混合安全值保底","detail":"A full43-history pure SPE w
