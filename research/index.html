<style>
:root { color-scheme: light; --ink:#17252d; --muted:#52636b; --line:#ccd9dc; --paper:#f5f7f5; --card:#fff; --teal:#146b69; --ochre:#a36c18; --red:#aa4a45; }
* { box-sizing:border-box }
body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--paper); color:var(--ink) }
header { padding:26px max(20px,calc((100vw - 1480px)/2)); background:#143b41; color:#f2f8f6 }
h1 { margin:0; font-size:clamp(1.5rem,3vw,2.3rem); letter-spacing:-.025em }
header p { max-width:900px; margin:9px 0 0; color:#d5e4e2 }
header a { color:#d0e8eb }
.shell { max-width:1480px; margin:auto; padding:20px; display:grid; grid-template-columns:minmax(0,1fr) minmax(270px,340px); gap:18px; align-items:start }
.tools { grid-column:1/-1; display:flex; gap:10px; flex-wrap:wrap; align-items:center }
input,select { border:1px solid #a9bcbf; border-radius:7px; padding:10px 12px; font:inherit; background:white; color:var(--ink) }
button.clear { border:1px solid #a9bcbf; border-radius:7px; padding:10px 12px; font:inherit; background:white; color:var(--ink); cursor:pointer }
input { flex:1 1 250px }
.count { color:var(--muted); margin-left:auto }
.routes { min-width:0; display:grid; gap:11px }
.route { background:var(--card); border:1px solid var(--line); border-left:5px solid var(--teal); padding:14px 16px; border-radius:9px; box-shadow:0 1px 3px #18394210 }
.route[data-kind=attacks] { border-left-color:var(--red) }
.route[data-kind=checks],.route[data-kind=limits] { border-left-color:var(--ochre) }
.route[data-kind=implements] { border-left-color:#556cac }
.meta { display:flex; gap:9px; align-items:center; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700 }
.relation { display:grid; grid-template-columns:minmax(0,1fr) 34px minmax(150px,32%); align-items:center; gap:8px; margin:13px 0 }
.premises { display:flex; flex-wrap:wrap; gap:5px; padding:8px; border:1px solid var(--line); border-radius:7px; background:#f8faf8; min-height:45px }
.junction { text-align:center; font-size:20px; color:var(--teal); font-weight:700 }
.node { border:1px solid #a6c9c4; color:#124d52; background:#e8f4f1; border-radius:5px; padding:5px 8px; font:inherit; font-size:13px; text-align:left; cursor:pointer }
.node:hover,.node:focus-visible { outline:2px solid var(--teal) }
.node small { display:block; font-size:11px; opacity:.78 }
.target { width:100%; background:#e5f0f3; border-color:#7da6af }
.route[data-kind=attacks] .target { background:#faeae7; border-color:#d1a29d; color:#7c3430 }
.route p { margin:6px 0; }
.refs { font-size:12px; color:var(--muted); overflow-wrap:anywhere }
a { color:#145c76 }
aside { position:sticky; top:16px; background:#fff; border:1px solid var(--line); border-radius:9px; padding:18px; max-height:calc(100vh - 32px); overflow:auto }
aside h2 { margin:0 0 10px; font-size:19px }
aside p { margin:9px 0 }
aside ul { padding-left:20px }
.badge { display:inline-block; padding:2px 7px; border-radius:4px; background:#e9efee; font-size:12px }
.empty { padding:24px; border:1px dashed var(--line); border-radius:9px }
@media(max-width:850px) { .shell { display:block } .tools { margin-bottom:12px } aside { position:static; max-height:none; margin-top:16px } }
@media(max-width:570px) { .relation { grid-template-columns:1fr; gap:3px } .junction { transform:rotate(90deg) } }
</style>

<p><a href="../README.md">研究总览</a> · <a href="current/claims.md">现行命题</a> · <a href="graph.json">结构化数据</a></p>

e on-path load when maximum reach is positive, with all four transfer inequalities including singleton-source clients.","refs":["research/current/multi_facility/uniform_two.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"MF-PACK-2","kind":"lemma","track":"extensions","title":"Bounded bins or singleton heavy atoms","detail":"For all a>0 and h>=1, weights totaling <=(h+1)a fit h bins of load <=2a except isolated singleton weights >2a, by pair merging.","refs":["research/current/multi_facility/uniform_two.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"MF-PURE-CAP","kind":"lemma","track":"extensions","title":"Full-game pure equilibration preserves a load cap","detail":"At any fixed layout, isolated atoms heavier than B and ordinary loads <=B form a strict-improvement invariant; a pure exact NE exists in that invariant, for every B>0.","refs":["research/current/multi_facility/uniform_two.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"MF-CONT-COMPLETE","kind":"lemma","track":"extensions","title":"Compatible complete continuation for labeled layouts","detail":"Exact on-path NE plus one exact NE at each actual deviation extend to a single complete rule; distinct coordinate deviations are distinct labeled layouts and all default subgames have pure NE.","refs":["research/current/multi_facility/uniform_two.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"SC-K-SYMMETRIC-MENU-OBSTRUCTION","kind":"claim","track":"extensions","title":"Unbounded symmetric-menu threat with a full exact SPE","detail":"For each q>=3, the three-site weights q^2,1,q-1/4 yield a lexmax on-path witness with symmetric-menu ratio q^2/(q-1/4)>q after B->T, but alpha*=1 in the full model.","refs":["research/current/multi_facility/symmetric_menu_obstruction.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"SC-K-LEXMAX-BARRIER","kind":"claim","track":"extensions","title":"Selected lexmax layouts can optimally require almost two","detail":"For every k>=2,h>=2, the explicit k-site family has unique lexmax occupancy up to labels with optimal factor 2h/(h+1) under all on/off-path NE choices, but full-instance alpha*=1 at another layout.","refs":["research/current/multi_facility/lexmax_boundary.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"MF-MODEL","kind":"definition","track":"model","title":"Common catalog, arbitrary labeled k","detail":"Positive atomic weights, common finite catalog, independent mixed exact client NE and a complete continuation at all labeled layouts.","refs":["research/current/multi_facility/model.md"],"status":"specified"},{"id":"MF-LEXMAX","kind":"construction","track":"extensions","title":"Finite site-uniform lexmax family","detail":"Optimize sorted facility loads over all layouts and feasible pure-to-site client assignments, then mix independently uniformly within the chosen site.","refs":["research/current/multi_facility/uniform_two.md"],"status":"finite exact construction; not polynomial time"},{"id":"MF-SYMMETRIC-FAMILY","kind":"construction","track":"extensions","title":"Explicit three-atom q-family","detail":"k=q+1; weights q^2,1,q-1/4; covers {A,T},{A},{B}; on-path A^q B.","refs":["research/current/multi_facility/symmetric_menu_obstruction.md"],"status":"explicit family"},{"id":"MF-LEXMAX-FAMILY","kind":"construction","track":"extensions","title":"Explicit k-atom h-family","detail":"Sites A,T and k-2 private anchors; weights h,1,3(h+1)/4 at each anchor; bad occupancy A,A,anchors and good occupancy T,A,anchors.","refs":["research/current/multi_facility/lexmax_boundary.md"],"status":"explicit family"},{"id":"MF-EXACT-CODE","kind":"artifact","track":"computation","title":"Arbitrary-k exact constructor and full-rule evaluator","detail":"Separate sibling package; exhaustive lexmax, cap-preserving pure equilibrium selection, deterministic defaults, rational certificate output.","refs":["research/current/multi_facility/uniform_two.md","multi_facility_spe/two_exists.py","multi_facility_spe/__main__.py"],"status":"implemented; exponential worst case"},{"id":"MF-EXACT-AUDIT","kind":"evidence","track":"evidence","title":"Definition-level, reverse, and barrier audits","detail":"Two main exact batches plus an explicit-family barrier audit; tests do not establish universal mathematical truth.","refs":["research/current/multi_facility/reverse_review.md","tests/multi_facility/definition_check.py","tests/multi_facility/run_exact_audit.py","tests/multi_facility/run_reverse_audit.py","tests/multi_facility/run_lexmax_barrier_audit.py","evidence/runs/kfac_two_exact.json","evidence/runs/kfac_two_reverse.json","evidence/runs/kfac_lexmax_barrier.json","tests/audits/kfac_independent.py","evidence/runs/kfac_independent.json"],"status":"finite exact evidence"},{"id":"GLMM04","kind":"source","track":"computation","title":"Polynomial restricted-link Nashification","detail":"Published STOC 2004 theorem: from any feasible integer-weight assignment on identical restricted links, compute a pure Nash equilibrium with nonincreased makespan in time polynomial in job count, links, edges and log total weight.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"published fact"},{"id":"MF-PURE-CAP-POLY","kind":"lemma","track":"computation","title":"Polynomial capped full-game equilibration","detail":"Given a rational pure assignment with isolated clients heavier than B and all ordinary loads at most B, deleting isolated resources, applying restricted-link Nashification, and reinserting them produces a full pure NE with ordinary loads at most B in input-bit-polynomial time.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal deduction from published theorem; unrefereed"},{"id":"SC-K-LEXMAX-STRONG-HARD","kind":"claim","track":"computation","title":"Exact global lexmax selection is strongly NP-complete","detail":"On explicit positive-integer common-catalog inputs with k=site count and equal reaches, deciding whether the best site-uniform sorted load vector has minimum at least a threshold is strongly NP-complete by 3-PARTITION. The reduction family nevertheless has an easy exact SPE.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-LOCAL-PLS","kind":"lemma","track":"computation","title":"Polynomial lex-neighborhood suffices for factor two","detail":"A locally maximal site-uniform state for all one-customer site transfers and canonical one-facility site transfers satisfies the exact customer NE and four budget inequalities. A polynomial-bit radix potential places this sufficient-state search in PLS, not necessarily P.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-GREEDY-BUDGET","kind":"lemma","track":"computation","title":"Polynomial greedy construction of all transfer budgets","detail":"For any positive-reach rational common-catalog instance, repeated maximum of occupied-site W/(q+1) and unoccupied-site new-coverage weight produces positive facility loads and all four orphan-aware transfer budgets in polynomial time; it can fail on-path client NE.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof and independent attack; unrefereed"},{"id":"SC-K-GREEDY-UNOPENED-2","kind":"claim","track":"computation","title":"Greedy unopened target retains factor-two initial cap","detail":"After any strict site-level customer improvement from the greedy assignment, all facility loads exceed the last insertion score gamma and unopened new reach is at most gamma; an abandoned singleton source contributes at most its own current load.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-EQUAL-MULT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for equal greedy multiplicities","detail":"If all greedily occupied sites have the same multiplicity q>=2, range-preserving restricted identical-link Nashification makes the on-path mixed customer NE and restores (5)-(6), then capped polynomial deviation repair yields a full factor-two continuation.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-DISTINCT-GREEDY-3","kind":"claim","track":"computation","title":"Polynomial factor three for distinct greedy sites","detail":"If greedy occupies k distinct sites, range-preserving pure Nashification and makespan-preserving off-path completion give a bit-polynomial full factor-three continuation.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-COMPONENT-MULT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for componentwise constant greedy multiplicities","detail":"Customer-overlap components have constant q, with q=1 components singleton; range-preserving site Nashification separately by component preserves all original transfer budgets and produces a complete bit-polynomial factor-two continuation.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-GREEDY-STATIC-PACK-NO","kind":"claim","track":"computation","title":"Frozen-site cap packing fails after greedy customer repair","detail":"Five sites, eight facilities and nine integer clients: a reachable exact site-uniform NE has B-load 41/2 and E two clients totaling 44, exceeding cap 41 after B facility moves; the source B survives, but E cannot be capped if its clients remain there.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete exact construction; internally checked; unrefereed"},{"id":"SC-K-GREEDY-CAP-INFEASIBLE","kind":"claim","track":"computation","title":"Global capped off-path assignment infeasible after greedy repair","detail":"Six sites, eight facilities and ten integer customers; at one B-to-G deviation the on-path load is 41/2, while forced private 20 at B/E/G and shared 24 make every pure assignment exceed ordinary cap 41 without a >41 macro. An exact NE gives the deviator only 20.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete exact construction; internally checked; unrefereed"},{"id":"SC-K-GREEDY-MAX-MULT","kind":"lemma","track":"computation","title":"Initial greedy customers occupy maximal-final-multiplicity sites","detail":"If a client first assigned at site s can also use later opened t, then opening weights obey W_s^0>W_t^0; q_t>q_s contradicts greedy at the last insertion to t. Not asserted after client repair.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-DISTINCT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for all-distinct greedy layouts","detail":"The first maximum-reach site offers persistent insertion score R/2; range-preserving fixed-layout Nashification guarantees on-path load >=R/2 and every off-path payoff is <=R.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-RANGE-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two under multiplicity-class range certificate","detail":"Groupwise Nashification keeps initial per-facility load extrema and same-q client NE; each cross-q client passes a range inequality, while a pooled q=1 source inequality and a 2a initial deviator cap handle departures.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-LIGHT-COMPONENT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two when light overlaps preserve multiplicity","detail":"Clients lighter than final greedy score have only same-q occupied alternatives; range certification follows for cross-q heavy clients and constructs exact factor two.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-GREEDY-HEAVY-OVERLAP-2","kind":"claim","track":"computation","title":"Polynomial factor two with heavy overlapping clients","detail":"If all clients spanning occupied sites weigh at least final greedy score, the unmodified greedy assignment is a customer NE and its transfer budgets yield exact factor two.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-GREEDY-REPAIR-ORDER-NO","kind":"claim","track":"computation","title":"Arbitrary strict greedy customer repair can lose factor two","detail":"A six-site eight-facility integer instance has a reachable exact on-path NE whose B-to-G deviation is forced to ratio 32/15 in all mixed off-path NE; another reachable NE at the same layout retains budgets.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-GREEDY-HEAVIEST-NO","kind":"claim","track":"computation","title":"Heaviest-first greedy customer repair can lose factor two","detail":"A related integer instance forces uniquely greatest-weight improving moves to an exact on-path NE with mixed-off-path deviation ratio 88/43; a different one-step NE retains budgets.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-TWO-SITE-COMPONENT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for two-site mixed-multiplicity components","detail":"Greedy occupied-site overlap components of constant q or at most two sites admit a bit-polynomial full exact factor-two construction via descending-weight high-to-low client transfers, load box, and orphan-aware completion.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-GREEDY-FIXED-LEXMAX-NO","kind":"claim","track":"computation","title":"Fixed greedy-layout customer lexmax can uniquely select bad NE","detail":"In the six-site 32/15 integer instance, the unique fixed-layout site-pure/uniform customer lexmax is the bad exact NE, while another NE at that occupancy preserves factor two.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-GREEDY-FIXED-POTENTIAL-NO","kind":"claim","track":"computation","title":"Fixed greedy-layout global customer-potential minimum can uniquely select bad NE","detail":"A second six-site integer instance has exactly two site-pure/uniform client NEs; exact potential values 86200 and 86264 make the unique global minimum the bad state with forced mixed-off-path ratio 215/107, while the other NE preserves budgets.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-ALL-OR-ONE-COMPONENT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for arbitrary-size all-or-one mixed-q components","detail":"Each mixed-q occupied component whose customers have one occupied option or all its sites admits descending-weight minimum-normalized-load assignment, exact on-path NE, greedy box and private-reserve singleton budgets; a full exact factor-two continuation is bit-polynomial.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-DESCENT-ONLY-TRAP-NO","kind":"claim","track":"computation","title":"Unique downward-only path can require an upward return","detail":"A strict-greedy three-site six-client integer chain has a unique maximal sequence of nonincreasing-q strict moves ending at a non-NE state; a weight-2 customer must return upward, though a true NE exists.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-NESTED-ANCHOR-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for weight-ordered nested anchored partial overlaps","detail":"In each mixed-q greedy overlap component, the first-opened site covers all multi-option customers and their eligible occupied sets expand in nonincreasing weight order; restricted list assignment yields exact NE, the greedy load box and singleton private reserves give all deviations.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"E-K-NESTED-ANCHOR-AUDIT","kind":"evidence","track":"evidence","title":"Exact nested-anchor and reversed-options finite audit","detail":"Fraction calculations reproduce strict greedy sequence, on-path NE, range failure, and the failure of the unrestricted reversed-option list rule; finite check does not prove universal bound.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_nested_anchor.py","examples/multi_facility/greedy_nested_anchor.json"],"status":"finite arithmetic check"},{"id":"SC-K-GREEDY-SINGLETON-RESET","kind":"claim","track":"computation","title":"Singleton deviations reset to greedy assignment","detail":"For any original q=1 source with on-path payoff at least gamma, original singleton pools and high-q greedy weights give a pure off-path NE with deviator at most 2 gamma, independent of the selected on-path customers.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-GREEDY-BOX-TO-2","kind":"claim","track":"computation","title":"A box-constrained greedy NE completes factor two","detail":"Any supplied site-uniform exact on-path NE with all weights in the greedy site box has bit-polynomial full factor-two continuation; singleton reset removes orphan reservations.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-UNIFORM-LIGHT-FLOW-2","kind":"claim","track":"computation","title":"Uniform light multi-option weights give polynomial factor two","detail":"With a common weight delta for all multi-option clients lighter than gamma, lower-bounded integral convex-cost flow yields exact NE; reverse equal-unit transport path proves the upper box for arbitrary partial overlaps.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"E-K-UNIFORM-LIGHT-AUDIT","kind":"evidence","track":"evidence","title":"Three-site uniform-light exact audit","detail":"Strict greedy trace and four-assignment Fraction enumeration confirm the fixed chain instance, range separation and exact box NE; no universal proof follows.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_uniform_light_flow.py","examples/multi_facility/greedy_uniform_light_flow.json"],"status":"finite arithmetic check"},{"id":"SC-K-TWO-LIGHT-LOWER-POTENTIAL-NO","kind":"claim","track":"computation","title":"Two unequal light clients defeat lower-box potential selection","detail":"A strict greedy seven-facility integer family has a box NE, but its lower-constrained weighted-potential minimum uniquely overflows an upper box by one; this isolates an algorithmic selection failure.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact parametric obstruction; internally audited"},{"id":"E-K-TWO-LIGHT-POTENTIAL-AUDIT","kind":"evidence","track":"evidence","title":"Four-state unequal-light exact audit","detail":"Fraction check of strict greedy scores, all four lower-feasible allocations, potential order and two exact NEs for selected integer family members.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_two_light_potential.py","examples/multi_facility/greedy_two_light_potential.json"],"status":"finite arithmetic check"},{"id":"SC-K-STAR-LIGHT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for anchored light-star components","detail":"Descending-weight queues on each leaf and smallest-load eligible-leaf choice produce exact client NE inside the greedy box for arbitrary unequal light weights; heavy cross-component customers freeze.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"E-K-STAR-LIGHT-AUDIT","kind":"evidence","track":"evidence","title":"Strict anchored-star unequal-light example","detail":"Fraction audit of six greedy insertions, one customer move, box, exact NE and failure of four previous sufficient conditions.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_star_edges.py","examples/multi_facility/greedy_star_edges.json"],"status":"finite arithmetic check"},{"id":"SC-K-RESET-PACK-INTERFACE","kind":"claim","track":"computation","title":"Greedy-pool deletion packing completes arbitrary high-minimum on-path NE","detail":"Greedy-pool deletion packing completes arbitrary high-minimum on-path NE. Exact hypotheses, polynomial-bit proof, limits and review status in current branch.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-DOUBLE-LPT-GREEDY-2","kind":"claim","track":"computation","title":"Double LPT certification of complete factor two beyond the site box","detail":"Double LPT certification of complete factor two beyond the site box. Exact hypotheses, polynomial-bit proof, limits and review status in current branch.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-PATH-EDGE-LIGHT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two on directed light-overlap paths","detail":"Polynomial factor two on directed light-overlap paths. Exact hypotheses, polynomial-bit proof, limits and review status in current branch.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-BOX-NE-FPT-TYPES","kind":"claim","track":"computation","title":"Fixed-parameter exact boxed site-uniform NE decision by type ILP","detail":"Fixed-parameter exact boxed site-uniform NE decision by type ILP. Exact hypotheses, polynomial-bit proof, limits and review status in current branch.","refs":["research/current/multi_facility/type_compression.md","research/current/multi_facility/claims.md"],"status":"parameterized conditional algorithm; internally reviewed"},{"id":"SC-K-FROZEN-LIGHT-FPT","kind":"claim","track":"computation","title":"Fixed-parameter frozen-heavy light-component box construction","detail":"Fixed-parameter frozen-heavy light-component box construction. Exact hypotheses, polynomial-bit proof, limits and review status in current branch.","refs":["research/current/multi_facility/type_compression.md","research/current/multi_facility/claims.md"],"status":"parameterized conditional algorithm; internally reviewed"},{"id":"SC-K-CATALOG-WEIGHT-XP-2","kind":"claim","track":"computation","title":"Unconditional factor two for fixed catalog size and weight diversity","detail":"Unconditional factor two for fixed catalog size and weight diversity. Exact hypotheses, polynomial-bit proof, limits and review status in current branch.","refs":["research/current/multi_facility/type_compression.md","research/current/multi_facility/claims sparse_bad_long_cycles.md"],"status":"new all-subrho proof internally audited"},{"id":"e-sc-diag-normal","kind":"derives","track":"shared","premises":["M1","M2","M3"],"conclusion":"SC-DIAG-NORMAL","statement":"Exact shared-catalog optimum and a complete attaining rule can use balanced customer equilibria on every colocated layout.","refs":["research/current/shared/instance_complexity_barriers.md"],"status":"new complete current proof, independently internally audited; unrefereed"},{"id":"e-sc-offdiag-fpt","kind":"derives","track":"computation","premises":["SC-DIAG-NORMAL","EXACT-KAPPA"],"conclusion":"SC-OFFDIAG-FPT","statement":"For positive rational shared catalogs, exact alpha and a complete rule in O(N^2[n+kappa_off 3^kappa_off]) rational operations with polynomial bit length.","refs":["research/current/shared/instance_complexity_barriers.md"],"status":"new complete current proof, independently internally audited; unrefereed"},{"id":"e-sc-two-site-exact","kind":"derives","track":"shared","premises":["M1","M2","M3"],"conclusion":"SC-TWO-SITE-EXACT","statement":"Every shared catalog of at most two sites admits an exact pure-location SPE for arbitrary overlap.","refs":["research/current/shared/instance_complexity_barriers.md"],"status":"new complete current proof, independently internally audited; unrefereed"},{"id":"e-sc-equal-reach-exact","kind":"derives","track":"shared","premises":["M1","M2","M3"],"conclusion":"SC-EQUAL-REACH-EXACT","statement":"Every shared catalog with all site reaches equal has an exact SPE under balanced offdiagonal customer continuation.","refs":["research/current/shared/instance_complexity_barriers.md"],"status":"new complete current proof, independently internally audited; unrefereed"},{"id":"e-sc-two-reach-sparse","kind":"derives","track":"shared","premises":["SC-DIAG-NORMAL","M1","M2"],"conclusion":"SC-TWO-REACH-SPARSE","statement":"At most two reach values plus at most one shared client per distinct site pair guarantee exact SPE.","ref s hold.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-static-pack-no","kind":"attacks","track":"computation","premises":["SC-K-GREEDY-STATIC-PACK-NO","SC-K-GREEDY-UNOPENED-2"],"conclusion":"SC-K-LOCAL-PLS","statement":"An exact reachable greedy-layout NE may have a surviving stationary site that cannot meet the original per-site cap with frozen customer sites; the local sufficient-state search is not obtained by this frozen repair.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"scope-limited counterexample"},{"id":"e-mf-static-pack-example","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET"],"conclusion":"SC-K-GREEDY-STATIC-PACK-NO","statement":"The explicit five-site nine-client integer instance follows the deterministic greedy insertion order, reaches an exact NE by five strict site transfers, and has a surviving stationary site whose fixed two-client load 44 exceeds cap 41 without a macro.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"exact construction"},{"id":"e-mf-global-cap-example","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET"],"conclusion":"SC-K-GREEDY-CAP-INFEASIBLE","statement":"The explicit six-site instance has the stated greedy order and exact reachable on-path NE; private-plus-shared clients force an ordinary load 44 at one deviation in every pure assignment.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"exact construction"},{"id":"e-mf-global-cap-limit","kind":"attacks","track":"computation","premises":["SC-K-GREEDY-CAP-INFEASIBLE"],"conclusion":"MF-PURE-CAP-POLY","statement":"The capped Nashification theorem remains true, but its global cap-and-isolated-macro hypothesis can be infeasible even when a favorable exact off-path NE exists.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"scope-limited counterexample"},{"id":"e-mf-greedy-max-mult","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET"],"conclusion":"SC-K-GREEDY-MAX-MULT","statement":"Opening-time uncovered sets and final insertion scores force each customer to be initially assigned to a covered occupied site of maximal final multiplicity.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-distinct-greedy-two","kind":"derives","track":"computation","premises":["SC-K-GREEDY-BUDGET","MF-MODEL","MF-CONT-COMPLETE"],"conclusion":"SC-K-DISTINCT-GREEDY-2","statement":"Persistent first-site R/2 insertion score and polynomial minimum-load-preserving Nashification bound every possible off-path payoff by 2a.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-range-greedy-two","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET","MF-PURE-CAP-POLY","MF-CONT-COMPLETE","SC-K-GREEDY-MAX-MULT","MF-PACK-2"],"conclusion":"SC-K-RANGE-GREEDY-2","statement":"Groupwise range-preserving identical-machine Nashification checks cross-q incentives; singleton customer pool and relaxed deviator cap complete all source/target cases.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-light-component-two","kind":"derives","track":"computation","premises":["SC-K-RANGE-GREEDY-2","SC-K-GREEDY-BUDGET"],"conclusion":"SC-K-LIGHT-COMPONENT-GREEDY-2","statement":"A cross-q client of weight at least gamma automatically passes the multiplicity-class range certificate.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-heavy-overlap-two","kind":"derives","track":"computation","premises":["SC-K-RANGE-GREEDY-2","SC-K-GREEDY-BUDGET"],"conclusion":"SC-K-GREEDY-HEAVY-OVERLAP-2","statement":"All shared clients being heavy implies the range certificate and the initial greedy profile is already an exact NE.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-greedy-repair-escape","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET"],"conclusion":"SC-K-GREEDY-REPAIR-ORDER-NO","statement":"The displayed finite integer input, exact on-path NE checks and universal mixed off-path dominance algebra prove this fixed-instance counterexample: Exact integer assignment and forced 96-weight customer at G give ratio 32/15 after a strict-repair terminal NE, but another on-path NE remains good.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"exact obstruction"},{"id":"e-mf-greedy-heaviest-escape","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET"],"conclusion":"SC-K-GREEDY-HEAVIEST-NO","statement":"The displayed finite integer input, exact on-path NE checks and universal mixed off-path dominance algebra prove this fixed-instance counterexample: A tie-free greatest-improving-weight repair path ends at a 88/43 forced off-path ratio, while an alternate one-step repair retains budgets.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"exact obstruction"},{"id":"e-mf-repair-order-limits","kind":"limits","track":"computation","premises":["SC-K-GREEDY-REPAIR-ORDER-NO","SC-K-GREEDY-HEAVIEST-NO"],"conclusion":"SC-K-GREEDY-UNOPENED-2","statement":"The empty-target initial cap invariant does not make arbitrary or largest-weight strict on-path repair a safe factor-two selection rule.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"exact obstruction"},{"id":"e-mf-two-site-component-greedy-two","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET","SC-K-GREEDY-MAX-MULT","MF-PACK-2","MF-PURE-CAP-POLY","MF-CONT-COMPLETE"],"conclusion":"SC-K-TWO-SITE-COMPONENT-GREEDY-2","statement":"Descending-weight transfers in unequal-q pairs have one scalar load-difference invariant, preserve the greedy box, and permit orphan-aware factor-two completion; equal-q components use identical-link Nashification.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-fixed-greedy-lexmax-escape","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-REPAIR-ORDER-NO"],"conclusion":"SC-K-GREEDY-FIXED-LEXMAX-NO","statement":"A sixteen-assignment integer input has a unique fixed-layout maximum minimum load at the already forced 32/15 bad NE.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"exact obstruction"},{"id":"e-mf-fixed-greedy-potential-escape","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET"],"conclusion":"SC-K-GREEDY-FIXED-POTENTIAL-NO","statement":"The exact weighted potential transfer identity and full two-NE classification prove the unique global potential minimum has a forced 215/107 off-path gain, though a good NE shares the layout.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"exact obstruction"},{"id":"e-mf-fixed-selection-limits","kind":"limits","track":"computation","premises":["SC-K-GREEDY-FIXED-LEXMAX-NO","SC-K-GREEDY-FIXED-POTENTIAL-NO"],"conclusion":"SC-K-GREEDY-UNOPENED-2","statement":"The unopened-site deviator cap and customer exact potential do not make either fixed-greedy-layout optimization rule a safe universal customer-NE selector.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"exact obstruction"},{"id":"e-mf-all-or-one-greedy-two","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET","SC-K-GREEDY-MAX-MULT","MF-PACK-2","MF-PURE-CAP-POLY","MF-CONT-COMPLETE"],"conclusion":"SC-K-ALL-OR-ONE-COMPONENT-GREEDY-2","statement":"Descending-weight list assignment to minimum normalized load proves exact client NE, preserves greedy load box, and uses private reserve to cover singleton-source orphan budgets in arbitrary-size all-or-one universal proof"},{"id":"e-mf-singleton-reset","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET","SC-K-GREEDY-MAX-MULT","MF-PACK-2","MF-PURE-CAP-POLY"],"conclusion":"SC-K-GREEDY-SINGLETON-RESET","statement":"Reset off-path customers to greedy initial sites; original q=1 pool and unopened target budget bound all ordinary loads by 2 gamma.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-box-to-two","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET","SC-K-GREEDY-SINGLETON-RESET","MF-PACK-2","MF-PURE-CAP-POLY","MF-CONT-COMPLETE"],"conclusion":"SC-K-GREEDY-BOX-TO-2","statement":"A supplied box-constrained exact on-path NE uses the singleton reset for q=1 sources and box budgets for surviving q>=2 sources.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-uniform-light-flow","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET","SC-K-GREEDY-MAX-MULT","SC-K-GREEDY-BOX-TO-2"],"conclusion":"SC-K-UNIFORM-LIGHT-FLOW-2","statement":"Lower-bounded integral convex-cost flow selects a box-constrained NE; a reverse equal-unit path prevents upper-box overflow even on arbitrary partial-overlap graphs.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-uniform-light-audit","kind":"checks","track":"computation","premises":["E-K-UNIFORM-LIGHT-AUDIT"],"conclusion":"SC-K-UNIFORM-LIGHT-FLOW-2","statement":"The integer chain is a finite exact separation from RANGE, ALL-OR-ONE and NESTED-ANCHOR; this check is not a universal proof.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_uniform_light_flow.py"],"status":"finite arithmetic check"},{"id":"e-mf-two-light-lower-potential","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET"],"conclusion":"SC-K-TWO-LIGHT-LOWER-POTENTIAL-NO","statement":"A four-state parametric potential comparison proves unique lower-constrained minimum above L upper box despite a box NE.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"exact obstruction"},{"id":"e-mf-two-light-audit","kind":"checks","track":"computation","premises":["E-K-TWO-LIGHT-POTENTIAL-AUDIT"],"conclusion":"SC-K-TWO-LIGHT-LOWER-POTENTIAL-NO","statement":"The finite rational audit verifies instances of the analytic family but does not establish the universal theorem.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_two_light_potential.py"],"status":"finite arithmetic check"},{"id":"e-mf-two-light-uniform-limit","kind":"limits","track":"computation","premises":["SC-K-TWO-LIGHT-LOWER-POTENTIAL-NO"],"conclusion":"SC-K-UNIFORM-LIGHT-FLOW-2","statement":"The equal-unit reverse path and its lower-only potential selection cannot be extended unchanged to distinct light weights.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"exact obstruction"},{"id":"e-mf-star-light-greedy-two","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET","SC-K-GREEDY-MAX-MULT","SC-K-GREEDY-BOX-TO-2","SC-K-LIGHT-COMPONENT-GREEDY-2"],"conclusion":"SC-K-STAR-LIGHT-GREEDY-2","statement":"Anchored star queues preserve box and exact NE in polynomial time; equal-multiplicity light components use restricted identical-link Nashification, then box completion gives factor two.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-star-light-audit","kind":"checks","track":"computation","premises":["E-K-STAR-LIGHT-AUDIT"],"conclusion":"SC-K-STAR-LIGHT-GREEDY-2","statement":"Strict three-site integer witness separates this condition from RANGE, ALL-OR-ONE, NESTED-ANCHOR and UNIFORM-LIGHT; a finite check is not the theorem proof.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_star_edges.py"],"status":"finite arithmetic check"},{"id":"e-mf-reset-pack","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET","SC-K-GREEDY-SINGLETON-RESET","MF-PURE-CAP-POLY"],"conclusion":"SC-K-RESET-PACK-INTERFACE","statement":"Reset original pools after every deviation; checked deletion packing controls the surviving source and original greedy budgets control other sites.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-double-lpt","kind":"derives","track":"computation","premises":["SC-K-GREEDY-BUDGET","SC-K-RESET-PACK-INTERFACE","MF-PURE-CAP-POLY"],"conclusion":"SC-K-DOUBLE-LPT-GREEDY-2","statement":"Two LPT checks and restricted-identical-link minimum-load-preserving Nashification produce all needed on-path payoffs and deletion partitions.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-path-edge","kind":"derives","track":"computation","premises":["SC-K-GREEDY-BUDGET","SC-K-GREEDY-MAX-MULT","SC-K-GREEDY-BOX-TO-2","SC-K-LIGHT-COMPONENT-GREEDY-2"],"conclusion":"SC-K-PATH-EDGE-LIGHT-GREEDY-2","statement":"Directed paths preserve boxes and strict no-return for equal weight on each edge; frozen heavy customers and box completion close factor two.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-type-ip","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BOX-TO-2"],"conclusion":"SC-K-BOX-NE-FPT-TYPES","statement":"Integer type supports encode every site-uniform boxed NE at fixed occupancy; fixed-variable ILP decides and constructs when parameters are bounded.","refs":["research/current/multi_facility/type_compression.md"],"status":"internal proof"},{"id":"e-mf-light-type-ip","kind":"derives","track":"computation","premises":["SC-K-BOX-NE-FPT-TYPES","SC-K-GREEDY-BUDGET","SC-K-GREEDY-BOX-TO-2"],"conclusion":"SC-K-FROZEN-LIGHT-FPT","statement":"Freeze heavy clients, solve independent bounded light-overlap components and use box inequalities to certify heavy incentives.","refs":["research/current/multi_facility/type_compression.md"],"status":"internal proof"},{"id":"e-mf-catalog-xp","kind":"derives","track":"computation","premises":["SC-K-2-E","MF-PURE-CAP-POLY"],"conclusion":"SC-K-CATALOG-WEIGHT-XP-2","statement":"Enumerate occupancy and site-pure type-count assignments at fixed full catalog and weight diversity, select global lexmax, complete deviations.","refs":["research/current/multi_facility/type_compression.md"],"status":"internal proof"},{"id":"e-mf-double-lpt-audit","kind":"checks","track":"computation","premises":["E-K-DOUBLE-LPT-AUDIT"],"conclusion":"SC-K-DOUBLE-LPT-GREEDY-2","statement":"Finite exact witness checks arithmetic and separation, not the universal algorithmic theorem.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_double_lpt.py"],"status":"finite arithmetic check"},{"id":"e-mf-path-edge-audit","kind":"checks","track":"computation","premises":["E-K-PATH-EDGE-AUDIT"],"conclusion":"SC-K-PATH-EDGE-LIGHT-GREEDY-2","statement":"Finite exact witness checks arithmetic and separation, not the universal algorithmic theorem.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_path_edges.py"],"status":"finite arithmetic check"},{"id":"e-mf-three-chain-box","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET","SC-K-GREEDY-MAX-MULT","SC-K-GREEDY-BOX-TO-2"],"conclusion":"SC-K-THREE-SITE-CHAIN-BOX-EXISTS","statement":"Full-box potential minimizer cannot have a blocked ML return: simultaneously return all upstream HM arrivals and the ML client, preserve every box, and strictly lower exact potential.","refs":["research/current/multi_facility/three_site_chain_box.md"],"status":"internal proof"},{"id":"e-mf-converging-path","kind":"derives","track":"computation","premises":["SC-K-GREEDY-BUDGET","SC-K-GREEDY-BOX-TO-2","MF-MODEL"],"conclusion":"SC-K-CONVERGING-PATH-BOX-2","statement":"Case-split on the first Z, T, X improvements; a T-first total-budget inequality or an X-first return exclusion keeps all subsequent strict moves within the full box, and three binary clients bound the path length.","refs":["research/current/multi_facility/converging_path_box.md"],"status":"internal proof"},{"id":"e-mf-converging-path-audit","kind":"checks","track":"computation","premises":["E-K-CONVERGING-PATH-AUDIT"],"conclusion":"SC-K-CONVERGING-PATH-BOX-2","statement":"Finite exact suffix enumeration tests the case argument but is not the universal proof.","refs":["research/current/multi_facility/converging_path_box.md","tests/audits/kfac_converging_path.py"],"status":"finite arithmetic check"},{"id":"e-mf-height-two-box","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET","SC-K-GREEDY-MAX-MULT","SC-K-GREEDY-BOX-TO-2"],"conclusion":"SC-K-HEIGHT-TWO-BOX-EXISTS","statement":"At any blocked backward move select entire incoming customer pools of source parents until overflow is offset; a first-crossing prefix maintains all boxes and strictly decreases the exact potential.","refs":["research/current/multi_facility/height_two_box.md"],"status":"internal proof"},{"id":"e-mf-height-two-three-chain","kind":"derives","track":"computation","premises":["SC-K-HEIGHT-TWO-BOX-EXISTS"],"conclusion":"SC-K-THREE-SITE-CHAIN-BOX-EXISTS","statement":"The directed three-site chain is a path of exactly two edges and is therefore a special case; its direct one-pool proof remains independently useful.","refs":["research/current/multi_facility/height_two_box.md","research/current/multi_facility/three_site_chain_box.md"],"status":"scope inclusion"},{"id":"e-mf-converging-four","kind":"derives","track":"computation","premises":["SC-K-GREEDY-BUDGET","SC-K-GREEDY-MAX-MULT","SC-K-GREEDY-BOX-TO-2","MF-MODEL"],"conclusion":"SC-K-CONVERGING-PATH-4MOVE-2","statement":"Test Z forward, T forward, X forward, a newly active T, then possible Z return; each other moved client remains permanently stable and each actual move preserves the box.","refs":["research/current/multi_facility/converging_four_moves.md"],"status":"internal proof"},{"id":"e-mf-converging-four-audit","kind":"checks","track":"computation","premises":["E-K-CONVERGING-FOUR-AUDIT"],"conclusion":"SC-K-CONVERGING-PATH-4MOVE-2","statement":"Finite exact branch checks are separate from the universal four-move proof.","refs":["research/current/multi_facility/converging_four_moves.md","tests/audits/kfac_converging_four_moves.py"],"status":"finite arithmetic check"},{"id":"e-mf-converging-four-old","kind":"derives","track":"computation","premises":["SC-K-CONVERGING-PATH-4MOVE-2"],"conclusion":"SC-K-CONVERGING-PATH-BOX-2","statement":"The earlier tight-A equal-A/C seven-step theorem is a restricted instance; its independent proof remains in the current layer.","refs":["research/current/multi_facility/converging_four_moves.md","research/current/multi_facility/converging_path_box.md"],"status":"scope inclusion"},{"id":"e-mf-height-two-audit","kind":"checks","track":"computation","premises":["E-K-HEIGHT-TWO-AUDIT"],"conclusion":"SC-K-HEIGHT-TWO-BOX-EXISTS","statement":"The multi-parent unequal-light integer witness confirms one instance and class separation but not the universal exchange theorem.","refs":["research/current/multi_facility/height_two_box.md","tests/audits/kfac_height_two.py"],"status":"finite arithmetic check"},{"id":"e-mf-incidence-box-dp","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET"],"conclusion":"SC-K-INCIDENCE-BOX-DP","statement":"Exact site subset domains and client best-response constraints form a finite-domain CSP; expanding client bags to their site neighborhoods bounds primal width by d(tau+1)-1.","refs":["research/current/multi_facility/bounded_incidence_box.md"],"status":"internal proof"},{"id":"e-mf-height-two-incidence-2","kind":"derives","track":"computation","premises":["SC-K-INCIDENCE-BOX-DP","SC-K-HEIGHT-TWO-BOX-EXISTS","SC-K-GREEDY-BOX-TO-2"],"conclusion":"SC-K-HEIGHT-TWO-INCIDENCE-2","statement":"The shallow graph proof supplies feasibility, the sparse-incidence DP selects an exact boxed NE in bit-polynomial time, and BOX-TO-2 completes all labeled deviations.","refs":["research/current/multi_facility/bounded_incidence_box.md"],"status":"internal proof"},{"id":"e-mf-local-weight-dp","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET"],"conclusion":"SC-K-LOCAL-WEIGHT-BOX-DP","statement":"Type compositions live in site-primal bags; guessed final weight-count vectors and partial counts enforce exact customer incentives and full boxes in polynomial states for fixed width and local diversity.","refs":["research/current/multi_facility/local_weight_box_dp.md"],"status":"internal proof"},{"id":"e-mf-inward-star","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET","SC-K-GREEDY-MAX-MULT","SC-K-GREEDY-BOX-TO-2"],"conclusion":"SC-K-INWARD-STAR-2","statement":"Maximum dynamic-key leaf queues preserve all full boxes and past center-client best responses, then complete every deviation via BOX-TO-2.","refs":["research/current/multi_facility/inward_star_box.md"],"status":"internal proof"},{"id":"e-mf-box-potential-hard","kind":"limits","track":"computation","premises":["SC-K-LEXMAX-STRONG-HARD"],"conclusion":"SC-K-BOX-POTENTIAL-STRONG-HARD","statement":"The same 3-PARTITION family gives a strong NP-hardness threshold for exact potential optimization over full-box states; it does not imply hardness of finding a factor-two witness.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal reduction"}]}</script>
<script>
const graph = JSON.parse(document.getElementById('graph-data').textContent);
const byId = new Map(graph.nodes.map(n => [n.id,n]));
const routeBox = document.getElementById('routes');
const inspector = document.getElementById('inspector');
const search = document.getElementById('search');
const track = document.getElementById('track');
const kind = document.getElementById('kind');
const clear = document.getElementById('clear');
let selected = null;
const trackNames = {model:'Model',local:'Local geometry',shared:'Shared phi',heterogeneous:'Heterogeneous',computation:'Exact computation',extensions:'Cost extensions',evidence:'Evidence'};
const add = (parent,tag,text,cls) => { const e=document.createElement(tag); if(text!==null)e.textContent=text; if(cls)e.className=cls; parent.appendChild(e); return e; };
const link = (parent,path) => { const a=add(parent,'a',path); a.href='../'+path; a.target='_blank'; a.rel='noopener'; return a; };
for(const t of Object.keys(trackNames)) { const o=add(track,'option',trackNames[t]); o.value=t; }
for(const k of Object.keys(graph.legend)) { const o=add(kind,'option',k); o.value=k; }
function nodeButton(parent,id,target) {
  const n=byId.get(id), b=add(parent,'button',null,'node'+(target?' target':''));
  b.type='button'; b.setAttribute('aria-label',n.id+' '+n.title);
  add(b,'strong',n.id); add(b,'small',n.title);
  b.addEventListener('click',()=>selectNode(id)); return b;
}
function selectNode(id) {
  selected=id; clear.hidden=false; const n=byId.get(id); inspector.replaceChildren();
  add(inspector,'h2',n.title); add(inspector,'span',n.id+' · '+n.kind+' · '+n.status+' · '+trackNames[n.track],'badge');
  add(inspector,'p',n.detail);
  add(inspector,'h3','现行说明与原始来源'); const list=add(inspector,'ul');
  for(const ref of n.refs) link(add(list,'li'),ref);
  const incoming=graph.hyperedges.filter(e=>e.conclusion===id);
  const outgoing=graph.hyperedges.filter(e=>e.premises.includes(id));
  add(inspector,'h3','Relationships');
  add(inspector,'p',incoming.length+' incoming · '+outgoing.length+' outgoing. Click a route ID to keep the branch in view.');
  const rel=add(inspector,'ul');
  for(const e of [...incoming,...outgoing]) {
    const a=add(add(rel,'li'),'a',e.id+' · '+e.kind+' · '+e.statement); a.href='#'+e.id;
  }
  render();
}
function render() {
  const q=search.value.trim().toLowerCase(), branch=track.value, relation=kind.value;
  routeBox.replaceChildren(); let count=0;
  for(const e of graph.hyperedges) {
    const terms=[e.id,e.statement,...e.refs,e.conclusion,byId.get(e.conclusion).title,...e.premises.flatMap(p=>[p,byId.get(p).title])].join(' ').toLowerCase();
    if(branch && e.track!==branch) continue;
    if(relation && e.kind!==relation) continue;
    if(q && !terms.includes(q)) continue;
    if(selected && !e.premises.includes(selected) && e.conclusion!==selected) continue;
    count++;
    const card=add(routeBox,'article',null,'route'); card.id=e.id; card.dataset.kind=e.kind;
    const meta=add(card,'div',null,'meta'); add(meta,'span',e.id); add(meta,'span',e.kind); add(meta,'span',e.status); add(meta,'span',trackNames[e.track]);
    const row=add(card,'div',null,'relation'); const inputs=add(row,'div',null,'premises');
    for(const p of e.premises) nodeButton(inputs,p,false);
    add(row,'span',e.kind==='attacks'?'⊣':'⇒','junction');
    nodeButton(row,e.conclusion,true);
    add(card,'p',e.statement);
    const sources=add(card,'div',null,'refs'); add(sources,'span','现行说明与来源: ');
    e.refs.forEach((ref,i)=>{ if(i)add(sources,'span',' · '); link(sources,ref); });
  }
  if(!count)add(routeBox,'div','No routes match. Clear a filter or select another branch.','empty');
  document.getElementById('count').textContent=count+' / '+graph.hyperedges.length+' hyperedges';
}
for(const control of [search,track,kind]) control.addEventListener('input',render);
clear.addEventListener('click',()=>{selected=null;clear.hidden=true;render();});
render();
</script>
