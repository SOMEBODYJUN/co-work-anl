rch_reduction.md","history/source/notes/multi_facility/complement_reduction_pro_report_2026-10-08.md"],"status":"complete current proof, internally reconstructed and exactly audited; unrefereed"},{"id":"SC-K-BOX-BOUNDED-COMPLEMENT","kind":"claim","track":"computation","title":"General boxed selection as bounded complement NE","detail":"Y_t=q_t M-X_t preserves all deviations and turns full boxes into q_t M-1<=Y_t<=q_t M. Computation does not expand binary q. Reverse mapping requires the exact compatible home, weight and initial-band contract; arbitrary unbounded NE is insufficient.","refs":["research/current/multi_facility/complement_search_reduction.md","history/source/notes/multi_facility/complement_reduction_pro_report_2026-10-08.md"],"status":"complete current proof, internally reconstructed and exactly audited; unrefereed"},{"id":"MF-COMPLEMENT-CODE","kind":"artifact","track":"computation","title":"Canonical search compiler, bounded import and NE decoder","detail":"Exact numeric I/O and literal canonical greedy; actual Instance interface and supplied-NE verification. Reuses only numeric I/O from equal-light module, never its solver. CLI preserves existing files.","refs":["research/current/multi_facility/complement_search_reduction.md","multi_facility_spe/complement_reduction.py"],"status":"implemented interfaces only; no equilibrium solver"},{"id":"E-K-COMPLEMENT-AUDIT","kind":"evidence","track":"evidence","title":"Definition-level source and labeled-facility exact audit","detail":"448 paired-tie compilations, 5718 states, 45372 cross-site deviations, 179338 physical conditional costs, 224 canonical trajectory checks, and 700 bounded imports with 9930 states; repeated runs not aggregated. Large numeric I/O and strict unbounded-NE boundary have separate regressions.","refs":["research/current/multi_facility/complement_search_reduction.md","tests/audits/kfac_complement_reduction.py","tests/test_complement_reduction.py","evidence/runs/2026-10-08/complement_reduction_final.json"],"status":"finite internal definition-level checks"},{"id":"FOUR-PARTITION-SOURCE","kind":"source","track":"computation","title":"Binary PARTITION NP-completeness","detail":"Nonempty positive binary integer PARTITION is NP-complete; the only imported complexity fact.","refs":["research/current/shared/four_site_no_fptas.md"],"status":"standard literature fact"},{"id":"FOUR-BALANCE-ENC","kind":"lemma","track":"computation","title":"Near-unit exact balance encoding","detail":"n=2max(t,2), positive variable weights sum to n with total perturbation at most 1/(8n); signed balance iff source PARTITION YES.","refs":["research/current/shared/four_site_no_fptas.md"],"status":"independently internally audited; unrefereed"},{"id":"FOUR-GLOBAL-GAP","kind":"lemma","track":"computation","title":"Four-site full continuation gap","detail":"YES alpha*=13/10; NO all sixteen labeled on-path layouts and all real-probability exact independent-mixed NE continuations require >=13/10+1/(100n^2). Positive integer polynomial-size realization.","refs":["research/current/shared/four_site_no_fptas.md"],"status":"independently internally audited; unrefereed"},{"id":"SC-FOUR-NO-FPTAS","kind":"claim","track":"computation","title":"No instance-optimal FPTAS at four common sites","detail":"Two labeled facilities, exactly four common sites, positive binary integer atomic weights, exact independent-mixed full continuation. Under P!=NP no additive or multiplicative FPTAS with explicit rational output. Does not exclude PTAS or arbitrary boxed NE search.","refs":["research/current/shared/four_site_no_fptas.md"],"status":"complete current proof with independent internal audits; unrefereed"},{"id":"FOUR-FPTAS-BUILDER","kind":"artifact","track":"computation","title":"Four-site integer gap constructor","detail":"Constructs the explicit positive integer instance in source-bit-polynomial time, without any partition or NE oracle.","refs":["research/current/shared/four_site_no_fptas.md","facility_spe/shared/four_site_fptas_hardness.py"],"status":"canonical constructor, not an equilibrium solver"},{"id":"E-FOUR-FPTAS-AUDIT","kind":"evidence","track":"computation","title":"Two independent exact gap audits","detail":"32-source full-layout support audit and independent 19-source core/unique-layout audit plus analytic diagonal guards. Overlapping samples and repeated closed supports are not aggregated; no original archive obtained.","refs":["research/current/shared/four_site_no_fptas.md","research/FOUR_SITE_FPTAS_AUDIT_2026-10-09.md","tests/audits/four_site_fptas.py","tests/audits/four_site_fptas_independent.py","evidence/runs/2026-10-09/four_site_fptas.json","evidence/runs/2026-10-09/four_site_fptas_independent.json"],"status":"finite internal definition-level checks"},{"id":"SC-TWO-NEAR-BAND-REP","kind":"claim","track":"computation","title":"Exact central-band completion for fixed heavy supports","detail":"Positive rational two-facility local game; light w<=H, heavy w>H with fixed pure/mixed supports. Deterministic bit-polynomial existence test and exact rational NE representative in abs(Delta)<=H. No prescribed-Delta optimization or general k claim.","refs":["research/current/shared/near_band_completion.md"],"status":"complete local proof with independent internal audits; global EPTAS candidate not registered"},{"id":"Q-SC-ALPHA-EPTAS","kind":"obligation","track":"computation","title":"Complete general instance-optimal EPTAS candidate","detail":"Concrete heavy-support spectra and central exact representative yield a C^2 candidate error argument. Formal general algorithm, bit complexity, canonical implementation and full-output audit remain to deliver; no EPTAS theorem registered.","refs":["research/current/shared/near_band_completion.md","research/questions/shared_alpha_eptas.md","research/NEXT_DIRECTION_DEBATE_2026-10-09.md"],"status":"concrete candidate; formal algorithm theorem not registered"},{"id":"E-NEAR-BAND-AUDITS","kind":"evidence","track":"evidence","title":"Independent central-band and preliminary global exact audits","detail":"1322 fixed-support inputs; independent 2004 local inputs and 8000 heavy supports; global prototype 186 inputs and 2976 labeled layouts. Overlapping samples not aggregated. Finite checks do not prove the EPTAS.","refs":["research/current/shared/near_band_completion.md","tests/audits/near_band_completion.py","tests/audits/near_band_completion_independent.py","tests/audits/shared_eptas_candidate.py","evidence/runs/2026-10-09/near_band_completion.json","evidence/runs/2026-10-09/near_band_completion_independent.json","evidence/runs/2026-10-09/shared_eptas_candidate.json"],"status":"finite internal exact attacks; no universal EPTAS certificate"},{"id":"CAG-PAPER","kind":"source","track":"extensions","title":"Deng sequential CAG conjecture","detail":"Paper §2 and Definition 4 specify equal-sharing customer attraction; §5 proves the two-player bound and gives a shared-catalog lower family. §6 proposes the general upper bound. Exact catalog scope is fixed independently for this branch.","refs":["research/current/customer_attraction/model.md","research/current/customer_attraction/literature.md"],"status":"primary-source facts checked; no general upper theorem imported"},{"id":"CAG-MODEL","kind":"definition","track":"extensions","title":"Sequential common themes and unit equal shares","detail":"Finite common labeled catalog, unit providers moving once in order, unit customers sharing among all coverers; pure SPE requires every ordered history, including arbitrary ties.","refs":["research/current/customer_attraction/model.md"],"status":"specified"},{"id":"Q-CAG-HALF","kind":"obligation","track":"extensions","title":"Every common-catalog pure SPE covers half of OPT","detail":"For every finite CAG-MODEL instance, every m>=1 and every full history-dependent pure SPE, OPT_m<=2W. Still unresolved; no target counterexample is certified.","refs":["research/current/customer_attraction/README.md","research/questions/customer_attraction_half_coverage.md"],"status":"open"},{"id":"CA-EXACT-PURE-SPE-ALL","kind":"claim","track":"extensions","title":"Exact set-valued enumeration of every pure SPE terminal","detail":"At each prefix count k, retain child terminals with own payoff at least max_b min_child_b payoff_b. Necessary and sufficient for all ordered-history pure SPE terminal counts; reconstruct a full strategy for every retained terminal. Finite, not bit-polynomial.","refs":["research/current/customer_attraction/exact_solver.md"],"status":"complete finite recursion proof and independent exact oracle; unrefereed"},{"id":"CA-CONTINUATION-WITNESSES","kind":"construction","track":"extensions","title":"Complete finite strategies attacking three bridges","detail":"Explicit common-catalog unit-customer strategies: two-player SPE not PNE, same-count ordered histories with different replies and nonmonotone payoffs, and a five-theme residual-floor counterexample.","refs":["research/current/customer_attraction/literature.md","research/current/customer_attraction/continuation_lemmas.md"],"status":"specified and independently exactly checked"},{"id":"CA-SPE-NON-PNE","kind":"claim","track":"extensions","title":"A common-catalog SPE terminal need not be PNE","detail":"There exists a two-player four-unit-customer common catalog and complete pure SPE whose terminal admits a profitable static action deviation; a separate three-player three-customer witness is included.","refs":["research/current/customer_attraction/literature.md","research/current/customer_attraction/continuation_lemmas.md"],"status":"complete direct reconstruction and independent exact certificates; unrefereed"},{"id":"CA-HISTORY-TIES","kind":"claim","track":"extensions","title":"Arbitrary history ties defeat state and payoff simplifications","detail":"There exists a three-player two-singleton common-catalog full pure SPE with different replies at equal-count histories AB and BA and payoffs (1/2,1,1/2). Neither direction of chronological payoff monotonicity is universal.","refs":["research/current/customer_attraction/continuation_lemmas.md"],"status":"complete direct reconstruction and independent exact certificates; unrefereed"},{"id":"CA-RESIDUAL-NO","kind":"claim","track":"extensions","title":"Per-player and mean residual floors are false","detail":"Two players, five shared themes and 14 unit customers admit a complete pure SPE with u=(4,5), W=9, OPT=10 and maximum untouched theme size 5. Thus both u_i>=max untouched and W>=m max untouched are false; half coverage is not refuted.","refs":["research/current/customer_attraction/continuation_lemmas.md"],"status":"complete direct reconstruction and independent exact certificates; unrefereed"},{"id":"CA-STATIC-BRIDGE","kind":"rejected","track":"extensions","title":"Import static smoothness by identifying SPE with PNE","detail":"A sequential deviation can change follower choices, so full SPE does not provide fixed-other-action Nash inequalities.","refs":["research/current/customer_attraction/literature.md"],"status":"refuted bridge"},{"id":"CA-STATE-BRIDGE","kind":"rejected","track":"extensions","title":"Impose anonymous ties or monotone player payoffs","detail":"Count-set memoization does not constrain a full strategy to be Markov. Both chronological monotonicities are false.","refs":["research/current/customer_attraction/continuation_lemmas.md"],"status":"refuted bridge"},{"id":"CA-RESIDUAL-BRIDGE","kind":"rejected","track":"extensions","title":"Charge each optimal theme its untouched mass per player","detail":"Per-agent and aggregate maximum-residual bounds fail through overlapping follower response cycles. Optimal portfolio coverage must be retained in a new proof.","refs":["research/current/customer_attraction/continuation_lemmas.md"],"status":"refuted bridge"},{"id":"CA-EXACT-CODE","kind":"construction","track":"extensions","title":"Canonical finite attraction solver and verifier","detail":"Separate customer_attraction package with rational shares, set-valued recursion, full ordered-history strategies, independent definition-level verifier and exclusive-output CLI.","refs":["research/current/customer_attraction/exact_solver.md"],"status":"implemented finite exact contract"},{"id":"CA-EXACT-CHECKS","kind":"evidence","track":"extensions","title":"Independent ordered-strategy tiny oracle","detail":"Direct enumeration of complete strategy maps and individual-customer payoffs checks all attainable counts and paths for bounded inputs; boundary, CLI and witness regressions are additional finite checks.","refs":["research/current/customer_attraction/exact_solver.md"],"status":"finite exact checks only"},{"id":"CA-ATTACK-CHECKS","kind":"evidence","track":"extensions","title":"Frozen finite search and complete witness audits","detail":"Integer-scaled outcome search and independent unit-customer audits have frozen parameters and results. Earlier zero residual counterexamples do not survive the later five-theme exact witness.","refs":["research/current/customer_attraction/continuation_lemmas.md","research/current/customer_attraction/README.md"],"status":"finite exact checks only"},{"id":"CA-TWO-REMAINING-TAX","kind":"claim","track":"extensions","title":"Fixed-prefix tax for exactly two remaining players","detail":"For every fixed legal incumbent prefix and arbitrary pure SPE of exactly two remaining unit providers, every comparison pair has remaining profit at most actual remaining profit plus sum_A 1/((b+1)(b+2)). Zero background reconstructs 3/2; general-m not asserted.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"complete algebraic proof and independent exact identity audit; unrefereed"},{"id":"CA-TAX-FRAME","kind":"definition","track":"extensions","title":"Remaining-profit objective and telescoping tax","detail":"F_k(b) maximizes remaining-provider total profit, with pointwise c/(b+c), over k shared themes. The tax sums 1/(b+1)-1/(b+c+1). Nonzero background remaining profit is not total covered welfare.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"specified"},{"id":"CA-TAX-OPPORTUNITY-GAP","kind":"rejected","track":"extensions","title":"Refuted general first-step tax opportunity bridge","detail":"Empty-background three-player full SPE BBB has F3=15>u_first+tax(B)+F2(B)=29/2. Root total tax remains equality in this witness.","refs":["research/current/customer_attraction/tax_bridge_counterexample.md","research/current/customer_attraction/two_remaining_tax.md"],"status":"refuted by exact complete-history counterexample"},{"id":"CA-PORTFOLIO-WITNESS","kind":"construction","track":"extensions","title":"Unique optimal support and deficient deviation assignment","detail":"Two-player five-theme complete strategy with 86 unit clones: W=44, unique optimal support B,D has OPT=45, uncovered mass 42 and deviation matrix [[19,19],[22,22]].","refs":["research/current/customer_attraction/portfolio_matching_counterexample.md"],"status":"specified and independently exactly checked"},{"id":"CA-PORTFOLIO-MATCHING-NO","kind":"claim","track":"extensions","title":"Even existential optimal-portfolio matching is false","detail":"The displayed full SPE has a unique optimal theme support but every assignment of its themes to the two actual move positions yields deviation utility 41<42 omitted customers. This refutes the existential-optimum bridge, not half coverage.","refs":["research/current/customer_attraction/portfolio_matching_counterexample.md"],"status":"complete direct reconstruction and independent exact certificates; unrefereed"},{"id":"CA-PORTFOLIO-BRIDGE","kind":"rejected","track":"extensions","title":"Match an optimal portfolio to real unilateral deviation utilities","detail":"The proposed existence of an optimal portfolio and permutation charging all omitted customers using real one-step deviation payoffs fails under history-dependent responses.","refs":["research/current/customer_attraction/portfolio_matching_counterexample.md"],"status":"refuted bridge"},{"id":"CA-TAX-IDENTITY-CHECKS","kind":"evidence","track":"extensions","title":"Independent exact atomwise tax identity audit","detail":"All five binary membership indicators are enumerated for specified zero, positive and huge background loads. This checks formulas and remainder signs; universal proof is algebraic, not these runs.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"finite exact checks only"},{"id":"CA-PORTFOLIO-CHECKS","kind":"evidence","track":"extensions","title":"Independent complete strategy and unique-OPT audit","detail":"Direct unit-customer arithmetic verifies each full strategy branch, every two-theme optimum, unique optimal support and both deviation assignments; canonical verifier corroborates.","refs":["research/current/customer_attraction/portfolio_matching_counterexample.md"],"status":"finite exact checks only"},{"id":"CA-THREE-UPPER-142-81","kind":"claim","track":"extensions","title":"Universal three-player welfare bound 142/81","detail":"Every three-player full history-dependent pure SPE on any finite common catalog satisfies OPT3<=142W/81. Non-sharpness and general-m remain unresolved.","refs":["research/current/customer_attraction/three_player_bound.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-TAX-BRIDGE-NO","kind":"claim","track":"extensions","title":"First-step tax bridge fails at the empty root","detail":"Four themes and 15 unit clients, complete always-B pure SPE: F3=15, actual W=9, first-step RHS=29/2; total root tax is equality, not refuted.","refs":["research/current/customer_attraction/tax_bridge_counterexample.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-GENERAL-TAX-NO","kind":"claim","track":"extensions","title":"General incumbent-background total tax is false","detail":"Disjoint A7/B1/C1, seven-player full always-A SPE, reached prefix AAA with four remaining: F4=24/5>4+3/4; infinite exact family. Root coverage and zero-background total tax unaffected.","refs":["research/current/customer_attraction/general_tax_counterexample.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-STRATEGY-CONE","kind":"claim","track":"extensions","title":"Exact rational cone for each full ordered strategy","detail":"For fixed m,p labeled common themes with possible duplicate coverage, full strategies define rational SPE multiplicity cones; normalized sections compact, worst ratio attained by integer clones, exact Farkas witnesses certify each cone.","refs":["research/current/customer_attraction/strategy_cone.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-COVERAGE-OPPORTUNITY-NO","kind":"claim","track":"extensions","title":"Coverage opportunity losses cannot be charged period by period","detail":"Full three-player SPE AAB with eleven unit clients: at the reached second node delta=F2(A)-F1(A)=3>u2=5/2. Global telescoping loss identity holds; total balance and half coverage remain unresolved.","refs":["research/current/customer_attraction/coverage_opportunity_counterexample.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-COVERAGE-BALANCE-GAP","kind":"obligation","track":"extensions","title":"Global coverage opportunity balance with transfers between periods","detail":"Delta_i are nonnegative and telescope to OPT-W. The target is sum_i(u_i-delta_i)>=0; stronger prefix balances remain unproved. Individual increments may be negative at reached SPE histories.","refs":["research/current/customer_attraction/coverage_opportunity_counterexample.md"],"status":"open global balance; not established by local comparisons"},{"id":"CA-FOUR-UPPER-1499-750","kind":"claim","track":"extensions","title":"Universal four-player welfare bound below two","detail":"Every four-player full history-dependent pure SPE on every finite common unit-sharing catalog satisfies OPT4<=1499W/750; all ties, repeated and empty themes included. Sharpness and general m>=5 unresolved.","refs":["research/current/customer_attraction/four_player_bound.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-LAST-NODE-OPT-TAX","kind":"claim","track":"extensions","title":"Last-node optimum versus root prefix tax","detail":"Every m-player path with a true last-node best response satisfies OPT_m<=m*u_m+tau_0(c_<m). Root-tax failures require u_m>W/m; this does not prove general root tax or half coverage.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"complete direct proof with independent internal review and exact audit; unrefereed"},{"id":"CA-THREE-SHARP-5-3","kind":"claim","track":"extensions","title":"Sharp welfare ratio 5/3 for every three-player pure SPE","detail":"Any finite common catalog, exactly three unit providers and every full ordered-history pure SPE satisfy OPT3<=5W/3. Eight genuine incentive slack types and an atomwise nonnegative identity prove the upper bound; full always-big SPE attains 5/3. No general-m or novelty claim.","refs":["research/current/customer_attraction/three_player_sharp.md"],"status":"complete sharp three-player proof with independent internal reviews and exact audit; unrefereed"},{"id":"CA-DISJOINT-MAXIMA-2M1","kind":"claim","track":"extensions","title":"Sharp arbitrary-player bound for disjoint maximal petals","detail":"After removing the common customer core, distinct inclusion-maximal topic petals are pairwise disjoint. Every full-history pure SPE chooses maximal petals at every history and satisfies OPT_m<=C+(2-1/m)(W-C); sharp. Internal subsets may overlap; general maximal overlap excluded.","refs":["research/current/customer_attraction/disjoint_maxima_bound.md"],"status":"complete structural-class proof with independent internal review and exact audit; unrefereed"},{"id":"CA-UNIFORM-PORTFOLIO-TWO","kind":"claim","track":"extensions","title":"Valid averaged true-deviation interface with two players remaining","detail":"Every legal fixed background with exactly two remaining players satisfies 2R_d(T,S)<=R_d(A,B)+V1T+V1S+V2T+V2S. Four genuine last-node comparisons and a symbolic nonnegative identity cover all history-dependent ties. The arbitrary-player averaged interface remains unproved.","refs":["research/current/customer_attraction/global_new_uniform_portfolio_two.md"],"status":"complete two-remaining-player identity with independent internal review and exact audit; unrefereed"},{"id":"CA-FIVE-LIFT-ROWS-NO","kind":"claim","track":"extensions","title":"Specified five-player two-root linear relaxation cannot prove half coverage","detail":"A rational 23-mask point satisfies all 460 specified necessary rows with W=1 and auxiliary O>2. It has no complete strategy or actual optimum interpretation; this refutes only this linear proof template, not a CAG/SPE conjecture.","refs":["research/current/customer_attraction/five_player_lift_obstruction.md"],"status":"complete relaxation obstruction with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-CREDIBLE-CONTINUATIONS","kind":"claim","track":"extensions","title":"All credible full-history continuations and exact joint candidate interface","detail":"Recursive credible child menus realize every full-history pure SPE for a fixed instance and target terminal, with finite full support in uniform mode. A fixed-path joint MILP has rigorous M=m bounds; candidates require exact certificate verification. Two selected five-player cones have exact ratios 8/5 and 7/5, with no universal inference.","refs":["research/current/customer_attraction/credible_continuations.md"],"status":"complete finite-interface proof and exact selected-certificate audits; unrefereed"},{"id":"CA-UNIFORM-ROOT-GAP","kind":"obligation","track":"extensions","title":"Averaged actual-prefix true deviations at arbitrary-player roots","detail":"Unproved stronger interface m|union T_j|<=(m-1)W+sum_ij V_ij for m>=3; all V use the original ordered prefix and the specified full strategy. If valid, it gives sharp 2-1/m. Changing follower choices changes later replies; frozen portfolios are not legal comparisons.","refs":["research/current/customer_attraction/global_new_uniform_portfolio_two.md"],"status":"open"},{"id":"CA-LAST-TWO-FLOOR","kind":"claim","track":"extensions","title":"Both last players exceed the local worst last-response floor","detail":"At every fixed ordered history with exactly two remaining unit providers, each actual SPE payoff is at least theta(P)=min_A max_B U_p(B,A). Any maximizer of f_p(A) guarantees this against every true last-player best response. Includes ties, repeats and arbitrary incumbent backgrounds.","refs":["research/current/customer_attraction/last_two_floor.md"],"status":"complete current proof with independent exact audit; unrefereed"},{"id":"CA-ALL-N-WELFARE-4N","kind":"claim","track":"extensions","title":"A general but weak all-player welfare guarantee","detail":"For all n>=2 and all complete-history pure SPE in CAG-MODEL, W>=4(n-1)OPT_n/[n(2n-1)]. It follows from the two last-player floors and K/n for others. Weaker than the current three- and four-player theorems; does not prove general half coverage.","refs":["research/current/customer_attraction/last_two_floor.md"],"status":"complete current proof with independent exact audit; unrefereed"},{"id":"CA-LAST-FLOOR-ALL-PLAYERS-NO","kind":"claim","track":"extensions","title":"A complete four-player SPE refutes the universal theta payoff floor","detail":"One valid four-player, twelve-topic unit-customer game has global theta=6135346 and first-player payoff 6135345 in a saved complete SPE. All 1885 ordered decision histories are independently replayed. W=24541476, OPT4=24541532, so the half-coverage conjecture is not refuted.","refs":["research/current/customer_attraction/uploaded_tool_audit.md"],"status":"complete current proof with independent exact audit; unrefereed"},{"id":"CA-MOBIUS-BOOLEAN","kind":"claim","track":"extensions","title":"Unique signed unit-type representation of any Boolean subset potential","detail":"For p>=1 and rational F:2^[p]->Q with F(empty)=0, the two Mobius inversions uniquely determine signed customer-type coefficients whose harmonic potential equals F on all square-free profiles. This determines its repeated-count extension; nonnegative inverse is necessary and sufficient after positive denominator scaling.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-MOBIUS-FULL-HISTORY-EMBED","kind":"claim","track":"extensions","title":"Full-history embedding of a no-repeat marginal-payoff game","detail":"For p>=n>=1, integer signed coefficients x and K=4sum|x_B|+1 give strictly positive integer unit-customer types x_B+K. Every complete CAG SPE chooses unused labels at every history, including repeated off-path histories. Restrictions to no-repeat histories are exactly all SPEs of the marginal-payoff subset-potential game. Roots, ordered root paths and fresh ties correspond; not arbitrary payoff tables.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-MOBIUS-BIAS-BARRIER","kind":"claim","track":"extensions","title":"The safe compiler raises welfare too much to refute half coverage","detail":"Under the full-history compiler conditions, root SPE and OPT both use n distinct labels, with common coverage bias K(2^p-2^(p-n)). Hence 2W-OPT >= K(2^p-2^(p-n))-3sum|x_B|>0. Welfare ratios are not preserved. For n>=5, OPT/W<125/123.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-THREE-REMAINING-PROFIT-5-3","kind":"claim","track":"extensions","title":"Sharp remaining-profit bound under arbitrary fixed background for three players","detail":"At any fixed legal ordered prefix with exactly three remaining unit providers, every complete-history pure SPE satisfies max_{T1,T2,T3} R_b(T1,T2,T3) <=(5/3)R_b(actual). R_b sums the three remaining profits, not total coverage; every history tie and repeated/empty theme is allowed. A nonnegative coefficient identity covers all backgrounds, and zero background attains the uniform factor.","refs":["research/current/customer_attraction/three_remaining_profit_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-FOUR-REMAINING-PROFIT-1499-750","kind":"claim","track":"extensions","title":"Four remaining players: arbitrary-background profit bound 1499/750","detail":"At any fixed legal ordered prefix with exactly four remaining unit providers, every complete-history pure SPE satisfies max_{T1,T2,T3,T4} R_b(T1,T2,T3,T4) <=(1499/750)R_b(actual). R_b is remaining total profit, not global coverage. Corrected background pair/last aggregation, actual D/Q/R/S deviation nodes and all nonnegative cubic customer coefficients cover every background, tie, repeated or empty theme. Sharpness is not claimed.","refs":["research/current/customer_attraction/four_remaining_profit_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-SUNFLOWER-MAXIMA-2M1","kind":"claim","track":"extensions","title":"Sunflower maximal themes: sharp arbitrary-player coverage bound","detail":"Every finite common catalog whose distinct inclusion-maximal themes are C disjoint-union P_j with pairwise disjoint private petals, arbitrary internal subthemes, every n>=1 and every complete-history pure SPE: OPT_n<=|C|+(2-1/n)(W-|C|). In particular any catalog with at most two distinct maximal coverage sets. Does not require all actions maximal or the terminal to be PNE.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-MAXIMA-SUPERSET-SEATS","kind":"claim","track":"extensions","title":"Superset seat guarantee for arbitrary common catalogs","detail":"Assign every catalog theme to an inclusion-maximal superset B_j. With w_j globally private clients and v_j remaining clients, f_j(k)=w_j/k+v_j/n, the n-th largest seat nu guarantees every player of every full-history pure SPE u_i>=nu and W>=n nu. At any prefix R(p,L)>=remaining players guarantees each remaining payoff>=L. Shared-client union budget is unresolved.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-SUNFLOWER-PRIVATE-GAP","kind":"claim","track":"extensions","title":"Private-petal gap restores all-maximal play and singleton stability","detail":"In the sunflower class, if every nonmaximal theme misses a private client in at least one containing maximal theme, every complete-history pure SPE selects maximal themes at every history, and root petal counts are singleton PNE. Unique-maximal catalogs need no gap condition. Sunflower welfare requires no such extra condition.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-LAMINAR-INCIDENCE-THETA","kind":"claim","track":"extensions","title":"Laminar maximal incidence: all-history individual theta guarantee","detail":"Every legal ordered prefix of a finite common unit catalog with laminar customer incidences among distinct maximal coverage sets: every remaining player in every complete-history pure SPE receives at least global theta_n. Arbitrary internal subsets, omitted cores, repeated actions and ties are retained.","refs":["research/current/customer_attraction/laminar_incidence_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-LAMINAR-INCIDENCE-MAXIMA-2M1","kind":"claim","track":"extensions","title":"Laminar maximal incidence: sharp arbitrary-player coverage bound","detail":"For every n>=1 in the preceding structural class, OPT_n<=c+(2-1/n)(W-c), c the common maximal core. The factor is sharp, strictly extends sunflower maximal themes, and is not an unrestricted catalog theorem.","refs":["research/current/customer_attraction/laminar_incidence_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-AGGREGATE-LAST-FLOOR-NO","kind":"claim","track":"extensions","title":"Aggregate last-slot theta floor is false for every n>=3","detail":"For every n>=3 a legal common unit catalog has a complete pure SPE with W=n theta_n-1. A compact n=3, six-topic, 36-unit-customer witness has payoffs (10,12,12), W=34, theta=12 and OPT=36. Refutes W>=n theta, not half coverage.","refs":["research/current/customer_attraction/aggregate_theta_counterexample.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-OBLIVIOUS-MIXED-SECURITY-2N1","kind":"claim","track":"extensions","title":"Universal sharp oblivious mixed security lower bound","detail":"For every finite common unit catalog and n>=1, max_p min_{fixed n-1 competing themes} E_p u >= OPT_n/(2n-1), sharp for every n. Opponents do not observe the random realization. Individual or aggregate SPE security bridges remain open.","refs":["research/current/customer_attraction/oblivious_security.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-ROOT-TAX-ORDER-COUNTS-NO","kind":"claim","track":"extensions","title":"Terminal counts do not determine root-tax validity","detail":"For every n>=4 there is a static PNE count vector realizable by a full pure SPE whose credible ordered path has W+tax-OPT=1, while an alternative non-SPE order of exactly the same vector has OPT-W-tax=(n-1)(n-3)/n>0. Does not refute root tax for actual SPE paths.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-THREE-MAXIMA-HALF","kind":"claim","track":"extensions","title":"At most three maximal coverages: arbitrary-player half coverage","detail":"For every finite common unit catalog with at most three distinct inclusion-maximal coverage sets, arbitrary internal subthemes and every complete ordered-history pure SPE: n>=2 gives OPT_n<=U<=c+2(W-c), where U is the maximal union and c its common core. n=1 and unique maxima are optimal. Crossed incidences are allowed; this class and unrestricted-size laminar incidence are incomparable. A sharper scalar certificate S=max(sum(a),n+max(a),3n/2) is proved; no welfare sharpness claim.","refs":["research/current/customer_attraction/three_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-FIVE-UPPER-221-100","kind":"claim","track":"extensions","title":"Five unit providers: universal 221/100 coverage bound","detail":"Exactly five unit providers, arbitrary finite common unit catalog and every complete ordered-history pure SPE at zero root background: OPT_5<=beta W<=221W/100, beta=24236714656727/10967499015623>2. Two true middle-player deviations and arbitrary-prefix two-player tax supply 21 legal nonnegative slacks; all 1024 customer types have exact nonnegative residuals. Empty and repeated topics included. Does not prove half coverage, sharpness, a background five-player bound, or n>=6.","refs":["research/current/customer_attraction/five_player_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audit; unrefereed"},{"id":"CA-DYNAMIC-MAXIMA-FLOOR","kind":"claim","track":"extensions","title":"Dynamic maximal-routing payoff floors at every history","detail":"Any finite common unit catalog, n>=1 providers, s>=2 distinct inclusion-maximal coverages, arbitrary internal subthemes and every complete ordered-history pure SPE. U is the maximal union, c its maximal common core. At every legal prefix length t, the current payoff is at least c/n+(U-c)/D_t, D_t=max(t+s(n-t)/2,n+s-1); root W>=c+Gamma_(n,s)(U-c), Gamma=sum_t 1/D_t. The full-union bound depends on s and does not solve unrestricted half coverage.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-DYNAMIC-MAXIMA-MIXED","kind":"claim","track":"extensions","title":"Separate private/shared monotone payoff budgets","detail":"Same all-history unit CAG domain with s>=2. P is total globally private mass and V=U-c-P. For t<n-1 let Z_t=t+s(n-t)/2, A_t=(n+t)/(2(t+1)Z_t), B_t=1/Z_t; at t=n-1 set A=1/(n+s-1), B=(n+1)/(n(n+s-1)). Their suffix minima give every current payoff at least c/n+P*underline(A)_t+V*underline(B)_t and W>=c+P*sum underline(A)+V*sum underline(B). A coefficient certificate, with no unrestricted half-coverage or optimality claim.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-FIVE-MAXIMA-HALF","kind":"claim","track":"extensions","title":"At most five maximal coverages: arbitrary-player half coverage","detail":"Any finite common unit catalog with at most five distinct inclusion-maximal coverages, arbitrary internal subthemes, any n>=1 and every complete ordered-history pure SPE: OPT_n<=2W. For n>=5 also OPT_n=U<=2W-c. For n=5 and s>=2, W>=c+(5/9)P+(67027/125400)V. Cases n<=4 use existing unconditional bounds; n>=6 follows dynamic floors and Gamma>=4n^2/(7n^2+3n+14)>1/2. No general-six-or-more-maxima or sharpness claim.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-FIVE-REPLY-UPPER","kind":"claim","track":"extensions","title":"Five providers: three true reply menus improve the universal coverage bound","detail":"Exactly five unit providers, arbitrary finite common catalog and every complete ordered-history pure SPE at zero root background: OPT_5<=beta W, beta=493266145873827/234749688354196 approximately 2.10124302755>2. Three true optimal-theme reply menus and 24 nonnegative slacks give an exact identity checked on all 49152 affine corners; empty and repeated topics included. No half-coverage, sharpness, arbitrary-background or n>=6 claim.","refs":["research/current/customer_attraction/five_player_reply_bound.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-ONE-FOLLOWER-DECORRELATION","kind":"claim","track":"extensions","title":"One credible follower: exact decorrelation identity under any background","detail":"At any legal ordered history with exactly two providers remaining, every full pure SPE and every distribution p on the common finite catalog satisfy E_A U_d(A,B(A))-E_(A,Aprime iid p) U_d(A,B(Aprime))=E_(A,Aprime) [U_d(B(A),A)-U_d(B(Aprime),A)]>=0. The dual value restricted to actual competitor tuples is at most the current payoff. Empty/repeated topics and all history-dependent ties included; no extension to multiple followers.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"i cope"},{"id":"E-CA-TAX-CHECKS","kind":"checks","track":"extensions","premises":["CA-TAX-IDENTITY-CHECKS"],"conclusion":"CA-TAX-FRAME","statement":"Rational atomwise arithmetic checks the implemented representation separately from its universal algebraic proof.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"recorded within stated scope"},{"id":"E-CA-PORTFOLIO-CHECKS","kind":"checks","track":"extensions","premises":["CA-PORTFOLIO-CHECKS"],"conclusion":"CA-PORTFOLIO-WITNESS","statement":"The supplied complete certificate and optimal support are verified independently of the SPE outcome recurrence.","refs":["research/current/customer_attraction/portfolio_matching_counterexample.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-UPPER-142-81","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-TWO-REMAINING-TAX"],"conclusion":"CA-THREE-UPPER-142-81","statement":"Every three-player full history-dependent pure SPE on any finite common catalog satisfies OPT3<=142W/81. Non-sharpness and general-m remain unresolved.","refs":["research/current/customer_attraction/three_player_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-BOUND-LIMIT","kind":"limits","track":"extensions","premises":["CA-THREE-UPPER-142-81"],"conclusion":"Q-CAG-HALF","statement":"This proves the target for exactly three players; it does not prove arbitrary player count.","refs":["research/current/customer_attraction/three_player_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-TAX-BRIDGE-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-TAX-BRIDGE-NO","statement":"Four themes and 15 unit clients, complete always-B pure SPE: F3=15, actual W=9, first-step RHS=29/2; total root tax is equality, not refuted.","refs":["research/current/customer_attraction/tax_bridge_counterexample.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIRST-TAX-ATTACK","kind":"attacks","track":"extensions","premises":["CA-TAX-BRIDGE-NO"],"conclusion":"CA-TAX-OPPORTUNITY-GAP","statement":"The complete empty-prefix three-player example refutes the universally quantified first-step bridge.","refs":["research/current/customer_attraction/tax_bridge_counterexample.md"],"status":"recorded within stated scope"},{"id":"E-CA-GENERAL-TAX-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-GENERAL-TAX-NO","statement":"Disjoint A7/B1/C1, seven-player full always-A SPE, reached prefix AAA with four remaining: F4=24/5>4+3/4; infinite exact family. Root coverage and zero-background total tax unaffected.","refs":["research/current/customer_attraction/general_tax_counterexample.md"],"status":"recorded within stated scope"},{"id":"E-CA-STRATEGY-CONE","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-STRATEGY-CONE","statement":"For fixed m,p labeled common themes with possible duplicate coverage, full strategies define rational SPE multiplicity cones; normalized sections compact, worst ratio attained by integer clones, exact Farkas witnesses certify each cone.","refs":["research/current/customer_attraction/strategy_cone.md"],"status":"recorded within stated scope"},{"id":"E-CA-COVERAGE-OPPORTUNITY-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-COVERAGE-OPPORTUNITY-NO","statement":"Explicit full ordered strategy and exact continuation comparisons establish the local opportunity counterexample.","refs":["research/current/customer_attraction/coverage_opportunity_counterexample.md"],"status":"recorded within stated scope"},{"id":"E-CA-COVERAGE-GLOBAL-GAP","kind":"limits","track":"extensions","premises":["CA-COVERAGE-OPPORTUNITY-NO","CAG-MODEL"],"conclusion":"CA-COVERAGE-BALANCE-GAP","statement":"Local delta<=u fails, but the algebraic global balance remains equivalent to root half coverage.","refs":["research/current/customer_attraction/coverage_opportunity_counterexample.md"],"status":"recorded within stated scope"},{"id":"E-CA-COVERAGE-BALANCE-TARGET","kind":"limits","track":"extensions","premises":["CA-COVERAGE-BALANCE-GAP"],"conclusion":"Q-CAG-HALF","statement":"Only a proved global balance can close this representation of the target; no such proof is registered.","refs":["research/current/customer_attraction/coverage_opportunity_counterexample.md"],"status":"recorded within stated scope"},{"id":"E-CA-FOUR-UPPER-1499-750","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-TWO-REMAINING-TAX"],"conclusion":"CA-FOUR-UPPER-1499-750","statement":"Every four-player full history-dependent pure SPE on every finite common unit-sharing catalog satisfies OPT4<=1499W/750; all ties, repeated and empty themes included. Sharpness and general m>=5 unresolved.","refs":["research/current/customer_attraction/four_player_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FOUR-UPPER-1499-750-LIMIT","kind":"limits","track":"extensions","premises":["CA-FOUR-UPPER-1499-750"],"conclusion":"Q-CAG-HALF","statement":"Four-player bound settles exactly four players; general m>=5 remains open.","refs":["research/current/customer_attraction/four_player_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAST-NODE-OPT-TAX","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-LAST-NODE-OPT-TAX","statement":"Every m-player path with a true last-node best response satisfies OPT_m<=m*u_m+tau_0(c_<m). Root-tax failures require u_m>W/m; this does not prove general root tax or half coverage.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAST-NODE-OPT-TAX-LIMIT","kind":"limits","track":"extensions","premises":["CA-LAST-NODE-OPT-TAX"],"conclusion":"Q-CAG-HALF","statement":"A high last-player payoff is a necessary condition for root-tax failure, not a proof or refutation of the general conjecture.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-SHARP","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-THREE-SHARP-5-3","statement":"True off-path L_i and C->Q->R continuations supply eight nonnegative incentive slacks; 50W-30OPT equals their weighted sum plus a universally nonnegative atomwise remainder, and the known big-theme family is fully reconstructed.","refs":["research/current/customer_attraction/three_player_sharp.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-SHARP-OLD-BOUND","kind":"derives","track":"extensions","premises":["CA-THREE-SHARP-5-3"],"conclusion":"CA-THREE-UPPER-142-81","statement":"Since 5/3<142/81 and W>=0, the sharp theorem also implies the earlier weaker inequality; its independent tax-based derivation remains preserved.","refs":["research/current/customer_attraction/three_player_sharp.md","research/current/customer_attraction/three_player_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-SHARP-GENERAL-LIMIT","kind":"limits","track":"extensions","premises":["CA-THREE-SHARP-5-3"],"conclusion":"Q-CAG-HALF","statement":"The sharp three-player theorem applies only to three players; the separate four-player theorem closes four, while general m>=5 remains open.","refs":["research/current/customer_attraction/three_player_sharp.md"],"status":"recorded within stated scope"},{"id":"E-CA-DISJOINT-MAXIMA-2M1","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-DISJOINT-MAXIMA-2M1","statement":"After removing the common customer core, distinct inclusion-maximal topic petals are pairwise disjoint. Every full-history pure SPE chooses maximal petals at every history and satisfies OPT_m<=C+(2-1/m)(W-C); sharp. Internal subsets may overlap; general maximal overlap excluded.","refs":["research/current/customer_attraction/disjoint_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-DISJOINT-MAXIMA-2M1-LIMIT","kind":"limits","track":"extensions","premises":["CA-DISJOINT-MAXIMA-2M1"],"conclusion":"Q-CAG-HALF","statement":"This settles all player counts only for the stated structural class, not every common catalog.","refs":["research/current/customer_attraction/disjoint_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-UNIFORM-PORTFOLIO-TWO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-UNIFORM-PORTFOLIO-TWO","statement":"Every legal fixed background with exactly two remaining players satisfies 2R_d(T,S)<=R_d(A,B)+V1T+V1S+V2T+V2S. Four genuine last-node comparisons and a symbolic nonnegative identity cover all history-dependent ties. The arbitrary-player averaged interface remains unproved.","refs":["research/current/customer_attraction/global_new_uniform_portfolio_two.md"],"status":"recorded within stated scope"},{"id":"E-CA-UNIFORM-PORTFOLIO-TWO-LIMIT","kind":"limits","track":"extensions","premises":["CA-UNIFORM-PORTFOLIO-TWO"],"conclusion":"Q-CAG-HALF","statement":"The fixed-background two-player identity does not prove the root averaged interface for three or more players.","refs":["research/current/customer_attraction/global_new_uniform_portfolio_two.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-LIFT-ROWS-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-TWO-REMAINING-TAX"],"conclusion":"CA-FIVE-LIFT-ROWS-NO","statement":"A rational 23-mask point satisfies all 460 specified necessary rows with W=1 and auxiliary O>2. It has no complete strategy or actual optimum interpretation; this refutes only this linear proof template, not a CAG/SPE conjecture.","refs":["research/current/customer_attraction/five_player_lift_obstruction.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-LIFT-ROWS-NO-LIMIT","kind":"limits","track":"extensions","premises":["CA-FIVE-LIFT-ROWS-NO"],"conclusion":"Q-CAG-HALF","statement":"Only the explicitly specified relaxed comparison system is insufficient; no main-target counterexample follows.","refs":["research/current/customer_attraction/five_player_lift_obstruction.md"],"status":"recorded within stated scope"},{"id":"E-CA-CREDIBLE-CONTINUATIONS","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-EXACT-PURE-SPE-ALL","CA-STRATEGY-CONE"],"conclusion":"CA-CREDIBLE-CONTINUATIONS","statement":"Recursive credible child menus realize every full-history pure SPE for a fixed instance and target terminal, with finite full support in uniform mode. A fixed-path joint MILP has rigorous M=m bounds; candidates require exact certificate verification. Two selected five-player cones have exact ratios 8/5 and 7/5, with no universal inference.","refs":["research/current/customer_attraction/credible_continuations.md"],"status":"recorded within stated scope"},{"id":"E-CA-CREDIBLE-CONTINUATIONS-LIMIT","kind":"limits","track":"extensions","premises":["CA-CREDIBLE-CONTINUATIONS"],"conclusion":"Q-CAG-HALF","statement":"Full support is a sampler property; finitely sampled or numerically optimized strategies do not establish a general welfare bound.","refs":["research/current/customer_attraction/credible_continuations.md"],"status":"recorded within stated scope"},{"id":"E-CA-UNIFORM-ROOT-GAP","kind":"limits","track":"extensions","premises":["CA-UNIFORM-PORTFOLIO-TWO"],"conclusion":"CA-UNIFORM-ROOT-GAP","statement":"The exact two-player identity motivates but does not establish this stronger arbitrary-player interface.","refs":["research/current/customer_attraction/global_new_uniform_portfolio_two.md"],"status":"recorded within stated scope"},{"id":"E-CA-UNIFORM-ROOT-GAP-TARGET","kind":"limits","track":"extensions","premises":["CA-UNIFORM-ROOT-GAP"],"conclusion":"Q-CAG-HALF","statement":"Only a proof of the full averaged interface would establish its stronger sharp bound; no such proof is registered.","refs":["research/current/customer_attraction/global_new_uniform_portfolio_two.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAST-TWO-FLOOR","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-LAST-TWO-FLOOR","statement":"At every fixed ordered history with exactly two remaining unit providers, each actual SPE payoff is at least theta(P)=min_A max_B U_p(B,A). Any maximizer of f_p(A) guarantees this against every true last-player best response. Includes ties, repeats and arbitrary incumbent backgrounds.","refs":["research/current/customer_attraction/last_two_floor.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAST-TWO-FLOOR-LIMIT","kind":"limits","track":"extensions","premises":["CA-LAST-TWO-FLOOR"],"conclusion":"Q-CAG-HALF","statement":"This result does not settle the half-coverage conjecture for arbitrary player counts.","refs":["research/current/customer_attraction/last_two_floor.md"],"status":"recorded within stated scope"},{"id":"E-CA-ALL-N-WELFARE-4N","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-LAST-TWO-FLOOR"],"conclusion":"CA-ALL-N-WELFARE-4N","statement":"For all n>=2 and all complete-history pure SPE in CAG-MODEL, W>=4(n-1)OPT_n/[n(2n-1)]. It follows from the two last-player floors and K/n for others. Weaker than the current three- and four-player theorems; does not prove general half coverage.","refs":["research/current/customer_attraction/last_two_floor.md"],"status":"recorded within stated scope"},{"id":"E-CA-ALL-N-WELFARE-4N-LIMIT","kind":"limits","track":"extensions","premises":["CA-ALL-N-WELFARE-4N"],"conclusion":"Q-CAG-HALF","statement":"This result does not settle the half-coverage conjecture for arbitrary player counts.","refs":["research/current/customer_attraction/last_two_floor.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAST-FLOOR-ALL-PLAYERS-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-LAST-FLOOR-ALL-PLAYERS-NO","statement":"One valid four-player, twelve-topic unit-customer game has global theta=6135346 and first-player payoff 6135345 in a saved complete SPE. All 1885 ordered decision histories are independently replayed. W=24541476, OPT4=24541532, so the half-coverage conjecture is not refuted.","refs":["research/current/customer_attraction/uploaded_tool_audit.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAST-FLOOR-ALL-PLAYERS-NO-LIMIT","kind":"limits","track":"extensions","premises":["CA-LAST-FLOOR-ALL-PLAYERS-NO"],"conclusion":"Q-CAG-HALF","statement":"This result does not settle the half-coverage conjecture for arbitrary player counts.","refs":["research/current/customer_attraction/uploaded_tool_audit.md"],"status":"recorded within stated scope"},{"id":"E-CA-MOBIUS-BOOLEAN","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-MOBIUS-BOOLEAN","statement":"For p>=1 and rational F:2^[p]->Q with F(empty)=0, the two Mobius inversions uniquely determine signed customer-type coefficients whose harmonic potential equals F on all square-free profiles. This determines its repeated-count extension; nonnegative inverse is necessary and sufficient after positive denominator scaling.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"recorded within stated scope"},{"id":"E-CA-MOBIUS-BOOLEAN-LIMIT","kind":"limits","track":"extensions","premises":["CA-MOBIUS-BOOLEAN"],"conclusion":"Q-CAG-HALF","statement":"This interface or representation does not close the arbitrary-player half-coverage conjecture.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"recorded within stated scope"},{"id":"E-CA-MOBIUS-FULL-HISTORY-EMBED","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MOBIUS-BOOLEAN"],"conclusion":"CA-MOBIUS-FULL-HISTORY-EMBED","statement":"For p>=n>=1, integer signed coefficients x and K=4sum|x_B|+1 give strictly positive integer unit-customer types x_B+K. Every complete CAG SPE chooses unused labels at every history, including repeated off-path histories. Restrictions to no-repeat histories are exactly all SPEs of the marginal-payoff subset-potential game. Roots, ordered root paths and fresh ties correspond; not arbitrary payoff tables.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"recorded within stated scope"},{"id":"E-CA-MOBIUS-FULL-HISTORY-EMBED-LIMIT","kind":"limits","track":"extensions","premises":["CA-MOBIUS-FULL-HISTORY-EMBED"],"conclusion":"Q-CAG-HALF","statement":"This interface or representation does not close the arbitrary-player half-coverage conjecture.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"recorded within stated scope"},{"id":"E-CA-MOBIUS-BIAS-BARRIER","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MOBIUS-FULL-HISTORY-EMBED"],"conclusion":"CA-MOBIUS-BIAS-BARRIER","statement":"Under the full-history compiler conditions, root SPE and OPT both use n distinct labels, with common coverage bias K(2^p-2^(p-n)). Hence 2W-OPT >= K(2^p-2^(p-n))-3sum|x_B|>0. Welfare ratios are not preserved. For n>=5, OPT/W<125/123.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"recorded within stated scope"},{"id":"E-CA-MOBIUS-BIAS-BARRIER-LIMIT","kind":"limits","track":"extensions","premises":["CA-MOBIUS-BIAS-BARRIER"],"conclusion":"Q-CAG-HALF","statement":"The sufficiently large safe bias compiler itself cannot yield a main-conjecture counterexample; smaller biases need full SPE revalidation.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-REMAINING-PROFIT-5-3","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-THREE-REMAINING-PROFIT-5-3","statement":"At any fixed legal ordered prefix with exactly three remaining unit providers, every complete-history pure SPE satisfies max_{T1,T2,T3} R_b(T1,T2,T3) <=(5/3)R_b(actual). R_b sums the three remaining profits, not total coverage; every history tie and repeated/empty theme is allowed. A nonnegative coefficient identity covers all backgrounds, and zero background attains the uniform factor.","refs":["research/current/customer_attraction/three_remaining_profit_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-REMAINING-PROFIT-5-3-LIMIT","kind":"limits","track":"extensions","premises":["CA-THREE-REMAINING-PROFIT-5-3"],"conclusion":"Q-CAG-HALF","statement":"This interface or representation does not close the arbitrary-player half-coverage conjecture.","refs":["research/current/customer_attraction/three_remaining_profit_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FOUR-REMAINING-PROFIT-1499-750","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-TWO-REMAINING-TAX"],"conclusion":"CA-FOUR-REMAINING-PROFIT-1499-750","statement":"At any fixed legal ordered prefix with exactly four remaining unit providers, every complete-history pure SPE satisfies max_{T1,T2,T3,T4} R_b(T1,T2,T3,T4) <=(1499/750)R_b(actual). R_b is remaining total profit, not global coverage. Corrected background pair/last aggregation, actual D/Q/R/S deviation nodes and all nonnegative cubic customer coefficients cover every background, tie, repeated or empty theme. Sharpness is not claimed.","refs":["research/current/customer_attraction/four_remaining_profit_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FOUR-REMAINING-PROFIT-1499-750-LIMIT","kind":"limits","track":"extensions","premises":["CA-FOUR-REMAINING-PROFIT-1499-750"],"conclusion":"Q-CAG-HALF","statement":"The four-remaining profit interface does not close root half coverage for five or more players: its coarse portfolio estimate has coefficient 1499m/3000 on remaining profit and an additional background term.","refs":["research/current/customer_attraction/four_remaining_profit_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-SUNFLOWER-MAXIMA-2M1","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MAXIMA-SUPERSET-SEATS"],"conclusion":"CA-SUNFLOWER-MAXIMA-2M1","statement":"Every finite common catalog whose distinct inclusion-maximal themes are C disjoint-union P_j with pairwise disjoint private petals, arbitrary internal subthemes, every n>=1 and every complete-history pure SPE: OPT_n<=|C|+(2-1/n)(W-|C|). In particular any catalog with at most two distinct maximal coverage sets. Does not require all actions maximal or the terminal to be PNE.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-MAXIMA-SUPERSET-SEATS","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-MAXIMA-SUPERSET-SEATS","statement":"Assign every catalog theme to an inclusion-maximal superset B_j. With w_j globally private clients and v_j remaining clients, f_j(k)=w_j/k+v_j/n, the n-th largest seat nu guarantees every player of every full-history pure SPE u_i>=nu and W>=n nu. At any prefix R(p,L)>=remaining players guarantees each remaining payoff>=L. Shared-client union budget is unresolved.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-SUNFLOWER-PRIVATE-GAP","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-DISJOINT-MAXIMA-2M1"],"conclusion":"CA-SUNFLOWER-PRIVATE-GAP","statement":"In the sunflower class, if every nonmaximal theme misses a private client in at least one containing maximal theme, every complete-history pure SPE selects maximal themes at every history, and root petal counts are singleton PNE. Unique-maximal catalogs need no gap condition. Sunflower welfare requires no such extra condition.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-SUNFLOWER-MAXIMA-2M1-LIMIT","kind":"limits","track":"extensions","premises":["CA-SUNFLOWER-MAXIMA-2M1","CA-MAXIMA-SUPERSET-SEATS"],"conclusion":"Q-CAG-HALF","statement":"The sharp result requires sunflower maximal coverage sets. The general superset seat interface does not yet budget arbitrary shared-client unions, so the unrestricted conjecture remains open.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAMINAR-INCIDENCE-THETA","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-LAMINAR-INCIDENCE-THETA","statement":"Every legal ordered prefix of a finite common unit catalog with laminar customer incidences among distinct maximal coverage sets: every remaining player in every complete-history pure SPE receives at least global theta_n. Arbitrary internal subsets, omitted cores, repeated actions and ties are retained.","refs":["research/current/customer_attraction/laminar_incidence_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAMINAR-INCIDENCE-MAXIMA-2M1","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-LAMINAR-INCIDENCE-THETA"],"conclusion":"CA-LAMINAR-INCIDENCE-MAXIMA-2M1","statement":"For every n>=1 in the preceding structural class, OPT_n<=c+(2-1/n)(W-c), c the common maximal core. The factor is sharp, strictly extends sunflower maximal themes, and is not an unrestricted catalog theorem.","refs":["research/current/customer_attraction/laminar_incidence_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-AGGREGATE-LAST-FLOOR-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MOBIUS-BOOLEAN","CA-MOBIUS-FULL-HISTORY-EMBED"],"conclusion":"CA-AGGREGATE-LAST-FLOOR-NO","statement":"For every n>=3 a legal common unit catalog has a complete pure SPE with W=n theta_n-1. A compact n=3, six-topic, 36-unit-customer witness has payoffs (10,12,12), W=34, theta=12 and OPT=36. Refutes W>=n theta, not half coverage.","refs":["research/current/customer_attraction/aggregate_theta_counterexample.md"],"status":"recorded within stated scope"},{"id":"E-CA-OBLIVIOUS-MIXED-SECURITY-2N1","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-OBLIVIOUS-MIXED-SECURITY-2N1","statement":"For every finite common unit catalog and n>=1, max_p min_{fixed n-1 competing themes} E_p u >= OPT_n/(2n-1), sharp for every n. Opponents do not observe the random realization. Individual or aggregate SPE security bridges remain open.","refs":["research/current/customer_attraction/oblivious_security.md"],"status":"recorded within stated scope"},{"id":"E-CA-ROOT-TAX-ORDER-COUNTS-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-ROOT-TAX-ORDER-COUNTS-NO","statement":"For every n>=4 there is a static PNE count vector realizable by a full pure SPE whose credible ordered path has W+tax-OPT=1, while an alternative non-SPE order of exactly the same vector has OPT-W-tax=(n-1)(n-3)/n>0. Does not refute root tax for actual SPE paths.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-MAXIMA-HALF","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MAXIMA-SUPERSET-SEATS"],"conclusion":"CA-THREE-MAXIMA-HALF","statement":"For every finite common unit catalog with at most three distinct inclusion-maximal coverage sets, arbitrary internal subthemes and every complete ordered-history pure SPE: n>=2 gives OPT_n<=U<=c+2(W-c), where U is the maximal union and c its common core. n=1 and unique maxima are optimal. Crossed incidences are allowed; this class and unrestricted-size laminar incidence are incomparable. A sharper scalar certificate S=max(sum(a),n+max(a),3n/2) is proved; no welfare sharpness claim.","refs":["research/current/customer_attraction/three_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-MAXIMA-HALF-LIMIT","kind":"limits","track":"extensions","premises":["CA-THREE-MAXIMA-HALF"],"conclusion":"Q-CAG-HALF","statement":"This theorem retains its stated structural or exact-player-count assumptions. The arbitrary-player half-coverage conjecture remains open for general catalogs; the new scalar shared-union obstruction is not an SPE counterexample.","refs":["research/current/customer_attraction/three_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-UPPER-221-100","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-TWO-REMAINING-TAX"],"conclusion":"CA-FIVE-UPPER-221-100","statement":"Exactly five unit providers, arbitrary finite common unit catalog and every complete ordered-history pure SPE at zero root background: OPT_5<=beta W<=221W/100, beta=24236714656727/10967499015623>2. Two true middle-player deviations and arbitrary-prefix two-player tax supply 21 legal nonnegative slacks; all 1024 customer types have exact nonnegative residuals. Empty and repeated topics included. Does not prove half coverage, sharpness, a background five-player bound, or n>=6.","refs":["research/current/customer_attraction/five_player_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-UPPER-221-100-LIMIT","kind":"limits","track":"extensions","premises":["CA-FIVE-UPPER-221-100"],"conclusion":"Q-CAG-HALF","statement":"This theorem retains its stated structural or exact-player-count assumptions. The arbitrary-player half-coverage conjecture remains open for general catalogs; the new scalar shared-union obstruction is not an SPE counterexample.","refs":["research/current/customer_attraction/five_player_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-DYNAMIC-MAXIMA-FLOOR","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-DYNAMIC-MAXIMA-FLOOR","statement":"Any finite common unit catalog, n>=1 providers, s>=2 distinct inclusion-maximal coverages, arbitrary internal subthemes and every complete ordered-history pure SPE. U is the maximal union, c its maximal common core. At every legal prefix length t, the current payoff is at least c/n+(U-c)/D_t, D_t=max(t+s(n-t)/2,n+s-1); root W>=c+Gamma_(n,s)(U-c), Gamma=sum_t 1/D_t. The full-union bound depends on s and does not solve unrestricted half coverage.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-DYNAMIC-MAXIMA-MIXED","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-DYNAMIC-MAXIMA-MIXED","statement":"Same all-history unit CAG domain with s>=2. P is total globally private mass and V=U-c-P. For t<n-1 let Z_t=t+s(n-t)/2, A_t=(n+t)/(2(t+1)Z_t), B_t=1/Z_t; at t=n-1 set A=1/(n+s-1), B=(n+1)/(n(n+s-1)). Their suffix minima give every current payoff at least c/n+P*underline(A)_t+V*underline(B)_t and W>=c+P*sum underline(A)+V*sum underline(B). A coefficient certificate, with no unrestricted half-coverage or optimality claim.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-MAXIMA-HALF","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-DYNAMIC-MAXIMA-FLOOR","CA-DYNAMIC-MAXIMA-MIXED","CA-TWO-REMAINING-TAX","CA-THREE-SHARP-5-3","CA-FOUR-UPPER-1499-750"],"conclusion":"CA-FIVE-MAXIMA-HALF","statement":"Any finite common unit catalog with at most five distinct inclusion-maximal coverages, arbitrary internal subthemes, any n>=1 and every complete ordered-history pure SPE: OPT_n<=2W. For n>=5 also OPT_n=U<=2W-c. For n=5 and s>=2, W>=c+(5/9)P+(67027/125400)V. Cases n<=4 use existing unconditional bounds; n>=6 follows dynamic floors and Gamma>=4n^2/(7n^2+3n+14)>1/2. No general-six-or-more-maxima or sharpness claim.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-MAXIMA-HALF-LIMIT","kind":"limits","track":"extensions","premises":["CA-FIVE-MAXIMA-HALF"],"conclusion":"Q-CAG-HALF","statement":"Half coverage is proved for arbitrary n when the distinct inclusion-maximal coverage count is at most five. Unrestricted catalogs with n>=5 remain open. No SPE counterexample is certified.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-REPLY-UPPER","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-FIVE-REPLY-UPPER","statement":"Exactly five unit providers, arbitrary finite common catalog and every complete ordered-history pure SPE at zero root background: OPT_5<=beta W, beta=493266145873827/234749688354196 approximately 2.10124302755>2. Three true optimal-theme reply menus and 24 nonnegative slacks give an exact identity checked on all 49152 affine corners; empty and repeated topics included. No half-coverage, sharpness, arbitrary-background or n>=6 claim.","refs":["research/current/customer_attraction/five_player_reply_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-ONE-FOLLOWER-DECORRELATION","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-ONE-FOLLOWER-DECORRELATION","statement":"At any legal ordered history with exactly two providers remaining, every full pure SPE and every distribution p on the common finite catalog satisfy E_A U_d(A,B(A))-E_(A,Aprime iid p) U_d(A,B(Aprime))=E_(A,Aprime) [U_d(B(A),A)-U_d(B(Aprime),A)]>=0. The dual value restricted to actual competitor tuples is at most the current payoff. Empty/repeated topics and all history-dependent ties included; no extension to multiple followers.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"recorded within stated scope"},{"id":"E-CA-ADAPTIVE-DECORRELATION-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-ADAPTIVE-DECORRELATION-NO","statement":"A saved four-provider, twelve-theme complete unit CAG SPE has true root replies c(4)=(2,3,11), c(9)=(6,7,3). Uniformly mixing queries 4 and 9 gives adaptive payoff minus independent reply payoff -11/4. All 1885 ordered nodes and 22620 action comparisons are replayed exactly. Refutes universal decorrelation, not u_i>=v_n, W>=n v_n or half coverage.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"recorded within stated scope"},{"id":"E-CA-ACTUAL-ROOT-TAIL-MENU-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-ACTUAL-ROOT-TAIL-MENU-NO","statement":"A complete three-provider, six-theme, 36-unit-customer SPE has root payoff10, unrestricted oblivious security v_3=10, and restricted actual-root continuation-menu minimax value z_1=11. The two unused query rows sum to22 for every mixture; equal mixture attains11. All43 ordered nodes and258 comparisons pass. A stationary reply-kernel choice also gives cap11. Not a half-coverage or unrestricted security-bridge counterexample.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"recorded within stated scope"},{"id":"E-CA-CREDIBLE-MENU-SECURITY-NO-ALL-N","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MOBIUS-BOOLEAN","CA-MOBIUS-FULL-HISTORY-EMBED"],"conclusion":"CA-CREDIBLE-MENU-SECURITY-NO-ALL-N","statement":"For every n>=3, a legal finite common catalog with positive integer unit-customer multiplicities and a complete ordered-history pure SPE has restricted actual-root menu value z_1=u_1+1/2. A two-group Boolean-potential marginal game is positively compiled with K=4sum|x|+1; its two omitted query labels prove the menu lower bound and equal mixture proves equality. Expanding to all2n pure-group tail columns gives an explicit unrestricted dual cap<=u_1. Full-history existence uses M2; finite n=3..6 regressions do not replace the universal proof.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-REPLY-UPPER-LIMIT","kind":"limits","track":"extensions","premises":["CA-FIVE-REPLY-UPPER"],"conclusion":"Q-CAG-HALF","statement":"The new universal five-player coefficient remains above2; neither nested floating LP outputs nor unrealizable relaxed points prove the conjecture or an SPE counterexample.","refs":["research/current/customer_attraction/five_player_reply_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-CREDIBLE-MENU-SECURITY-LIMIT","kind":"limits","track":"extensions","premises":["CA-OBLIVIOUS-MIXED-SECURITY-2N1","CA-ADAPTIVE-DECORRELATION-NO","CA-CREDIBLE-MENU-SECURITY-NO-ALL-N"],"conclusion":"Q-CAG-HALF","statement":"Static mixed security remains valid. Universal adaptive decorrelation and free mixing of actual root replies are false; unrestricted individual and aggregate credible SPE security bridges remain open. Enlarged competitor menus require a new cross-node payment argument.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"recorded within stated scope"}]}</script>
<script>
const graph = JSON.parse(document.getElementById('graph-data').textContent);
const byId = new Map(graph.nodes.map(n => [n.id,n]));
const routeBox = document.getElementById('routes');
const inspector = document.getElementById('inspector');
const search = document.getElementById('search');
const track = document.getElementById('track');
const kind = document.getElementById('kind');
const clear = document.getElementById('clear');
let selected = null;
const trackNames = {model:'Model',local:'Local geometry',shared:'Shared phi',heterogeneous:'Heterogeneous',computation:'Exact computation',extensions:'Cost extensions',evidence:'Evidence'};
const add = (parent,tag,text,cls) => { const e=document.createElement(tag); if(text!==null)e.textContent=text; if(cls)e.className=cls; parent.appendChild(e); return e; };
const link = (parent,path) => { const a=add(parent,'a',path); a.href='../'+path; a.target='_blank'; a.rel='noopener'; return a; };
for(const t of Object.keys(trackNames)) { const o=add(track,'option',trackNames[t]); o.value=t; }
for(const k of Object.keys(graph.legend)) { const o=add(kind,'option',k); o.value=k; }
function nodeButton(parent,id,target) {
  const n=byId.get(id), b=add(parent,'button',null,'node'+(target?' target':''));
  b.type='button'; b.setAttribute('aria-label',n.id+' '+n.title);
  add(b,'strong',n.id); add(b,'small',n.title);
  b.addEventListener('click',()=>selectNode(id)); return b;
}
function selectNode(id) {
  selected=id; clear.hidden=false; const n=byId.get(id); inspector.replaceChildren();
  add(inspector,'h2',n.title); add(inspector,'span',n.id+' · '+n.kind+' · '+n.status+' · '+trackNames[n.track],'badge');
  add(inspector,'p',n.detail);
  add(inspector,'h3','现行说明与原始来源'); const list=add(inspector,'ul');
  for(const ref of n.refs) link(add(list,'li'),ref);
  const incoming=graph.hyperedges.filter(e=>e.conclusion===id);
  const outgoing=graph.hyperedges.filter(e=>e.premises.includes(id));
  add(inspector,'h3','Relationships');
  add(inspector,'p',incoming.length+' incoming · '+outgoing.length+' outgoing. Click a route ID to keep the branch in view.');
  const rel=add(inspector,'ul');
  for(const e of [...incoming,...outgoing]) {
    const a=add(add(rel,'li'),'a',e.id+' · '+e.kind+' · '+e.statement); a.href='#'+e.id;
  }
  render();
}
function render() {
  const q=search.value.trim().toLowerCase(), branch=track.value, relation=kind.value;
  routeBox.replaceChildren(); let count=0;
  for(const e of graph.hyperedges) {
    const terms=[e.id,e.statement,...e.refs,e.conclusion,byId.get(e.conclusion).title,...e.premises.flatMap(p=>[p,byId.get(p).title])].join(' ').toLowerCase();
    if(branch && e.track!==branch) continue;
    if(relation && e.kind!==relation) continue;
    if(q && !terms.includes(q)) continue;
    if(selected && !e.premises.includes(selected) && e.conclusion!==selected) continue;
    count++;
    const card=add(routeBox,'article',null,'route'); card.id=e.id; card.dataset.kind=e.kind;
    const meta=add(card,'div',null,'meta'); add(meta,'span',e.id); add(meta,'span',e.kind); add(meta,'span',e.status); add(meta,'span',trackNames[e.track]);
    const row=add(card,'div',null,'relation'); const inputs=add(row,'div',null,'premises');
    for(const p of e.premises) nodeButton(inputs,p,false);
    add(row,'span',e.kind==='attacks'?'⊣':'⇒','junction');
    nodeButton(row,e.conclusion,true);
    add(card,'p',e.statement);
    const sources=add(card,'div',null,'refs'); add(sources,'span','现行说明与来源: ');
    e.refs.forEach((ref,i)=>{ if(i)add(sources,'span',' · '); link(sources,ref); });
  }
  if(!count)add(routeBox,'div','No routes match. Clear a filter or select another branch.','empty');
  document.getElementById('count').textContent=count+' / '+graph.hyperedges.length+' hyperedges';
}
for(const control of [search,track,kind]) control.addEventListener('input',render);
clear.addEventListener('click',()=>{selected=null;clear.hidden=true;render();});
render();
</script>
