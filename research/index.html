ses":["CA-THREE-SHARP-5-3"],"conclusion":"CA-THREE-UPPER-142-81","statement":"Since 5/3<142/81 and W>=0, the sharp theorem also implies the earlier weaker inequality; its independent tax-based derivation remains preserved.","refs":["research/current/customer_attraction/three_player_sharp.md","research/current/customer_attraction/three_player_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-SHARP-GENERAL-LIMIT","kind":"limits","track":"extensions","premises":["CA-THREE-SHARP-5-3"],"conclusion":"Q-CAG-HALF","statement":"The sharp three-player theorem applies only to three players; the separate four-player theorem closes four, while general m>=5 remains open.","refs":["research/current/customer_attraction/three_player_sharp.md"],"status":"recorded within stated scope"},{"id":"E-CA-DISJOINT-MAXIMA-2M1","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-DISJOINT-MAXIMA-2M1","statement":"After removing the common customer core, distinct inclusion-maximal topic petals are pairwise disjoint. Every full-history pure SPE chooses maximal petals at every history and satisfies OPT_m<=C+(2-1/m)(W-C); sharp. Internal subsets may overlap; general maximal overlap excluded.","refs":["research/current/customer_attraction/disjoint_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-DISJOINT-MAXIMA-2M1-LIMIT","kind":"limits","track":"extensions","premises":["CA-DISJOINT-MAXIMA-2M1"],"conclusion":"Q-CAG-HALF","statement":"This settles all player counts only for the stated structural class, not every common catalog.","refs":["research/current/customer_attraction/disjoint_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-UNIFORM-PORTFOLIO-TWO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-UNIFORM-PORTFOLIO-TWO","statement":"Every legal fixed background with exactly two remaining players satisfies 2R_d(T,S)<=R_d(A,B)+V1T+V1S+V2T+V2S. Four genuine last-node comparisons and a symbolic nonnegative identity cover all history-dependent ties. The arbitrary-player averaged interface remains unproved.","refs":["research/current/customer_attraction/global_new_uniform_portfolio_two.md"],"status":"recorded within stated scope"},{"id":"E-CA-UNIFORM-PORTFOLIO-TWO-LIMIT","kind":"limits","track":"extensions","premises":["CA-UNIFORM-PORTFOLIO-TWO"],"conclusion":"Q-CAG-HALF","statement":"The fixed-background two-player identity does not prove the root averaged interface for three or more players.","refs":["research/current/customer_attraction/global_new_uniform_portfolio_two.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-LIFT-ROWS-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-TWO-REMAINING-TAX"],"conclusion":"CA-FIVE-LIFT-ROWS-NO","statement":"A rational 23-mask point satisfies all 460 specified necessary rows with W=1 and auxiliary O>2. It has no complete strategy or actual optimum interpretation; this refutes only this linear proof template, not a CAG/SPE conjecture.","refs":["research/current/customer_attraction/five_player_lift_obstruction.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-LIFT-ROWS-NO-LIMIT","kind":"limits","track":"extensions","premises":["CA-FIVE-LIFT-ROWS-NO"],"conclusion":"Q-CAG-HALF","statement":"Only the explicitly specified relaxed comparison system is insufficient; no main-target counterexample follows.","refs":["research/current/customer_attraction/five_player_lift_obstruction.md"],"status":"recorded within stated scope"},{"id":"E-CA-CREDIBLE-CONTINUATIONS","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-EXACT-PURE-SPE-ALL","CA-STRATEGY-CONE"],"conclusion":"CA-CREDIBLE-CONTINUATIONS","statement":"Recursive credible child menus realize every full-history pure SPE for a fixed instance and target terminal, with finite full support in uniform mode. A fixed-path joint MILP has rigorous M=m bounds; candidates require exact certificate verification. Two selected five-player cones have exact ratios 8/5 and 7/5, with no universal inference.","refs":["research/current/customer_attraction/credible_continuations.md"],"status":"recorded within stated scope"},{"id":"E-CA-CREDIBLE-CONTINUATIONS-LIMIT","kind":"limits","track":"extensions","premises":["CA-CREDIBLE-CONTINUATIONS"],"conclusion":"Q-CAG-HALF","statement":"Full support is a sampler property; finitely sampled or numerically optimized strategies do not establish a general welfare bound.","refs":["research/current/customer_attraction/credible_continuations.md"],"status":"recorded within stated scope"},{"id":"E-CA-UNIFORM-ROOT-GAP","kind":"limits","track":"extensions","premises":["CA-UNIFORM-PORTFOLIO-TWO"],"conclusion":"CA-UNIFORM-ROOT-GAP","statement":"The exact two-player identity motivates but does not establish this stronger arbitrary-player interface.","refs":["research/current/customer_attraction/global_new_uniform_portfolio_two.md"],"status":"recorded within stated scope"},{"id":"E-CA-UNIFORM-ROOT-GAP-TARGET","kind":"limits","track":"extensions","premises":["CA-UNIFORM-ROOT-GAP"],"conclusion":"Q-CAG-HALF","statement":"Only a proof of the full averaged interface would establish its stronger sharp bound; no such proof is registered.","refs":["research/current/customer_attraction/global_new_uniform_portfolio_two.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAST-TWO-FLOOR","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-LAST-TWO-FLOOR","statement":"At every fixed ordered history with exactly two remaining unit providers, each actual SPE payoff is at least theta(P)=min_A max_B U_p(B,A). Any maximizer of f_p(A) guarantees this against every true last-player best response. Includes ties, repeats and arbitrary incumbent backgrounds.","refs":["research/current/customer_attraction/last_two_floor.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAST-TWO-FLOOR-LIMIT","kind":"limits","track":"extensions","premises":["CA-LAST-TWO-FLOOR"],"conclusion":"Q-CAG-HALF","statement":"This result does not settle the half-coverage conjecture for arbitrary player counts.","refs":["research/current/customer_attraction/last_two_floor.md"],"status":"recorded within stated scope"},{"id":"E-CA-ALL-N-WELFARE-4N","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-LAST-TWO-FLOOR"],"conclusion":"CA-ALL-N-WELFARE-4N","statement":"For all n>=2 and all complete-history pure SPE in CAG-MODEL, W>=4(n-1)OPT_n/[n(2n-1)]. It follows from the two last-player floors and K/n for others. Weaker than the current three- and four-player theorems; does not prove general half coverage.","refs":["research/current/customer_attraction/last_two_floor.md"],"status":"recorded within stated scope"},{"id":"E-CA-ALL-N-WELFARE-4N-LIMIT","kind":"limits","track":"extensions","premises":["CA-ALL-N-WELFARE-4N"],"conclusion":"Q-CAG-HALF","statement":"This result does not settle the half-coverage conjecture for arbitrary player counts.","refs":["research/current/customer_attraction/last_two_floor.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAST-FLOOR-ALL-PLAYERS-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-LAST-FLOOR-ALL-PLAYERS-NO","statement":"One valid four-player, twelve-topic unit-customer game has global theta=6135346 and first-player payoff 6135345 in a saved complete SPE. All 1885 ordered decision histories are independently replayed. W=24541476, OPT4=24541532, so the half-coverage conjecture is not refuted.","refs":["research/current/customer_attraction/uploaded_tool_audit.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAST-FLOOR-ALL-PLAYERS-NO-LIMIT","kind":"limits","track":"extensions","premises":["CA-LAST-FLOOR-ALL-PLAYERS-NO"],"conclusion":"Q-CAG-HALF","statement":"This result does not settle the half-coverage conjecture for arbitrary player counts.","refs":["research/current/customer_attraction/uploaded_tool_audit.md"],"status":"recorded within stated scope"},{"id":"E-CA-MOBIUS-BOOLEAN","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-MOBIUS-BOOLEAN","statement":"For p>=1 and rational F:2^[p]->Q with F(empty)=0, the two Mobius inversions uniquely determine signed customer-type coefficients whose harmonic potential equals F on all square-free profiles. This determines its repeated-count extension; nonnegative inverse is necessary and sufficient after positive denominator scaling.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"recorded within stated scope"},{"id":"E-CA-MOBIUS-BOOLEAN-LIMIT","kind":"limits","track":"extensions","premises":["CA-MOBIUS-BOOLEAN"],"conclusion":"Q-CAG-HALF","statement":"This interface or representation does not close the arbitrary-player half-coverage conjecture.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"recorded within stated scope"},{"id":"E-CA-MOBIUS-FULL-HISTORY-EMBED","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MOBIUS-BOOLEAN"],"conclusion":"CA-MOBIUS-FULL-HISTORY-EMBED","statement":"For p>=n>=1, integer signed coefficients x and K=4sum|x_B|+1 give strictly positive integer unit-customer types x_B+K. Every complete CAG SPE chooses unused labels at every history, including repeated off-path histories. Restrictions to no-repeat histories are exactly all SPEs of the marginal-payoff subset-potential game. Roots, ordered root paths and fresh ties correspond; not arbitrary payoff tables.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"recorded within stated scope"},{"id":"E-CA-MOBIUS-FULL-HISTORY-EMBED-LIMIT","kind":"limits","track":"extensions","premises":["CA-MOBIUS-FULL-HISTORY-EMBED"],"conclusion":"Q-CAG-HALF","statement":"This interface or representation does not close the arbitrary-player half-coverage conjecture.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"recorded within stated scope"},{"id":"E-CA-MOBIUS-BIAS-BARRIER","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MOBIUS-FULL-HISTORY-EMBED"],"conclusion":"CA-MOBIUS-BIAS-BARRIER","statement":"Under the full-history compiler conditions, root SPE and OPT both use n distinct labels, with common coverage bias K(2^p-2^(p-n)). Hence 2W-OPT >= K(2^p-2^(p-n))-3sum|x_B|>0. Welfare ratios are not preserved. For n>=5, OPT/W<125/123.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"recorded within stated scope"},{"id":"E-CA-MOBIUS-BIAS-BARRIER-LIMIT","kind":"limits","track":"extensions","premises":["CA-MOBIUS-BIAS-BARRIER"],"conclusion":"Q-CAG-HALF","statement":"The sufficiently large safe bias compiler itself cannot yield a main-conjecture counterexample; smaller biases need full SPE revalidation.","refs":["research/current/customer_attraction/mobius_compiler.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-REMAINING-PROFIT-5-3","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-THREE-REMAINING-PROFIT-5-3","statement":"At any fixed legal ordered prefix with exactly three remaining unit providers, every complete-history pure SPE satisfies max_{T1,T2,T3} R_b(T1,T2,T3) <=(5/3)R_b(actual). R_b sums the three remaining profits, not total coverage; every history tie and repeated/empty theme is allowed. A nonnegative coefficient identity covers all backgrounds, and zero background attains the uniform factor.","refs":["research/current/customer_attraction/three_remaining_profit_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-REMAINING-PROFIT-5-3-LIMIT","kind":"limits","track":"extensions","premises":["CA-THREE-REMAINING-PROFIT-5-3"],"conclusion":"Q-CAG-HALF","statement":"This interface or representation does not close the arbitrary-player half-coverage conjecture.","refs":["research/current/customer_attraction/three_remaining_profit_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FOUR-REMAINING-PROFIT-1499-750","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-TWO-REMAINING-TAX"],"conclusion":"CA-FOUR-REMAINING-PROFIT-1499-750","statement":"At any fixed legal ordered prefix with exactly four remaining unit providers, every complete-history pure SPE satisfies max_{T1,T2,T3,T4} R_b(T1,T2,T3,T4) <=(1499/750)R_b(actual). R_b is remaining total profit, not global coverage. Corrected background pair/last aggregation, actual D/Q/R/S deviation nodes and all nonnegative cubic customer coefficients cover every background, tie, repeated or empty theme. Sharpness is not claimed.","refs":["research/current/customer_attraction/four_remaining_profit_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FOUR-REMAINING-PROFIT-1499-750-LIMIT","kind":"limits","track":"extensions","premises":["CA-FOUR-REMAINING-PROFIT-1499-750"],"conclusion":"Q-CAG-HALF","statement":"The four-remaining profit interface does not close root half coverage for five or more players: its coarse portfolio estimate has coefficient 1499m/3000 on remaining profit and an additional background term.","refs":["research/current/customer_attraction/four_remaining_profit_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-SUNFLOWER-MAXIMA-2M1","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MAXIMA-SUPERSET-SEATS"],"conclusion":"CA-SUNFLOWER-MAXIMA-2M1","statement":"Every finite common catalog whose distinct inclusion-maximal themes are C disjoint-union P_j with pairwise disjoint private petals, arbitrary internal subthemes, every n>=1 and every complete-history pure SPE: OPT_n<=|C|+(2-1/n)(W-|C|). In particular any catalog with at most two distinct maximal coverage sets. Does not require all actions maximal or the terminal to be PNE.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-MAXIMA-SUPERSET-SEATS","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-MAXIMA-SUPERSET-SEATS","statement":"Assign every catalog theme to an inclusion-maximal superset B_j. With w_j globally private clients and v_j remaining clients, f_j(k)=w_j/k+v_j/n, the n-th largest seat nu guarantees every player of every full-history pure SPE u_i>=nu and W>=n nu. At any prefix R(p,L)>=remaining players guarantees each remaining payoff>=L. Shared-client union budget is unresolved.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-SUNFLOWER-PRIVATE-GAP","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-DISJOINT-MAXIMA-2M1"],"conclusion":"CA-SUNFLOWER-PRIVATE-GAP","statement":"In the sunflower class, if every nonmaximal theme misses a private client in at least one containing maximal theme, every complete-history pure SPE selects maximal themes at every history, and root petal counts are singleton PNE. Unique-maximal catalogs need no gap condition. Sunflower welfare requires no such extra condition.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-SUNFLOWER-MAXIMA-2M1-LIMIT","kind":"limits","track":"extensions","premises":["CA-SUNFLOWER-MAXIMA-2M1","CA-MAXIMA-SUPERSET-SEATS"],"conclusion":"Q-CAG-HALF","statement":"The sharp result requires sunflower maximal coverage sets. The general superset seat interface does not yet budget arbitrary shared-client unions, so the unrestricted conjecture remains open.","refs":["research/current/customer_attraction/sunflower_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAMINAR-INCIDENCE-THETA","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-LAMINAR-INCIDENCE-THETA","statement":"Every legal ordered prefix of a finite common unit catalog with laminar customer incidences among distinct maximal coverage sets: every remaining player in every complete-history pure SPE receives at least global theta_n. Arbitrary internal subsets, omitted cores, repeated actions and ties are retained.","refs":["research/current/customer_attraction/laminar_incidence_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-LAMINAR-INCIDENCE-MAXIMA-2M1","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-LAMINAR-INCIDENCE-THETA"],"conclusion":"CA-LAMINAR-INCIDENCE-MAXIMA-2M1","statement":"For every n>=1 in the preceding structural class, OPT_n<=c+(2-1/n)(W-c), c the common maximal core. The factor is sharp, strictly extends sunflower maximal themes, and is not an unrestricted catalog theorem.","refs":["research/current/customer_attraction/laminar_incidence_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-AGGREGATE-LAST-FLOOR-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MOBIUS-BOOLEAN","CA-MOBIUS-FULL-HISTORY-EMBED"],"conclusion":"CA-AGGREGATE-LAST-FLOOR-NO","statement":"For every n>=3 a legal common unit catalog has a complete pure SPE with W=n theta_n-1. A compact n=3, six-topic, 36-unit-customer witness has payoffs (10,12,12), W=34, theta=12 and OPT=36. Refutes W>=n theta, not half coverage.","refs":["research/current/customer_attraction/aggregate_theta_counterexample.md"],"status":"recorded within stated scope"},{"id":"E-CA-OBLIVIOUS-MIXED-SECURITY-2N1","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-OBLIVIOUS-MIXED-SECURITY-2N1","statement":"For every finite common unit catalog and n>=1, max_p min_{fixed n-1 competing themes} E_p u >= OPT_n/(2n-1), sharp for every n. Opponents do not observe the random realization. Individual or aggregate SPE security bridges remain open.","refs":["research/current/customer_attraction/oblivious_security.md"],"status":"recorded within stated scope"},{"id":"E-CA-ROOT-TAX-ORDER-COUNTS-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-ROOT-TAX-ORDER-COUNTS-NO","statement":"For every n>=4 there is a static PNE count vector realizable by a full pure SPE whose credible ordered path has W+tax-OPT=1, while an alternative non-SPE order of exactly the same vector has OPT-W-tax=(n-1)(n-3)/n>0. Does not refute root tax for actual SPE paths.","refs":["research/current/customer_attraction/two_remaining_tax.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-MAXIMA-HALF","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MAXIMA-SUPERSET-SEATS"],"conclusion":"CA-THREE-MAXIMA-HALF","statement":"For every finite common unit catalog with at most three distinct inclusion-maximal coverage sets, arbitrary internal subthemes and every complete ordered-history pure SPE: n>=2 gives OPT_n<=U<=c+2(W-c), where U is the maximal union and c its common core. n=1 and unique maxima are optimal. Crossed incidences are allowed; this class and unrestricted-size laminar incidence are incomparable. A sharper scalar certificate S=max(sum(a),n+max(a),3n/2) is proved; no welfare sharpness claim.","refs":["research/current/customer_attraction/three_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-THREE-MAXIMA-HALF-LIMIT","kind":"limits","track":"extensions","premises":["CA-THREE-MAXIMA-HALF"],"conclusion":"Q-CAG-HALF","statement":"This theorem retains its stated structural or exact-player-count assumptions. The arbitrary-player half-coverage conjecture remains open for general catalogs; the new scalar shared-union obstruction is not an SPE counterexample.","refs":["research/current/customer_attraction/three_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-UPPER-221-100","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-TWO-REMAINING-TAX"],"conclusion":"CA-FIVE-UPPER-221-100","statement":"Exactly five unit providers, arbitrary finite common unit catalog and every complete ordered-history pure SPE at zero root background: OPT_5<=beta W<=221W/100, beta=24236714656727/10967499015623>2. Two true middle-player deviations and arbitrary-prefix two-player tax supply 21 legal nonnegative slacks; all 1024 customer types have exact nonnegative residuals. Empty and repeated topics included. Does not prove half coverage, sharpness, a background five-player bound, or n>=6.","refs":["research/current/customer_attraction/five_player_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-UPPER-221-100-LIMIT","kind":"limits","track":"extensions","premises":["CA-FIVE-UPPER-221-100"],"conclusion":"Q-CAG-HALF","statement":"This theorem retains its stated structural or exact-player-count assumptions. The arbitrary-player half-coverage conjecture remains open for general catalogs; the new scalar shared-union obstruction is not an SPE counterexample.","refs":["research/current/customer_attraction/five_player_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-DYNAMIC-MAXIMA-FLOOR","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-DYNAMIC-MAXIMA-FLOOR","statement":"Any finite common unit catalog, n>=1 providers, s>=2 distinct inclusion-maximal coverages, arbitrary internal subthemes and every complete ordered-history pure SPE. U is the maximal union, c its maximal common core. At every legal prefix length t, the current payoff is at least c/n+(U-c)/D_t, D_t=max(t+s(n-t)/2,n+s-1); root W>=c+Gamma_(n,s)(U-c), Gamma=sum_t 1/D_t. The full-union bound depends on s and does not solve unrestricted half coverage.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-DYNAMIC-MAXIMA-MIXED","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-DYNAMIC-MAXIMA-MIXED","statement":"Same all-history unit CAG domain with s>=2. P is total globally private mass and V=U-c-P. For t<n-1 let Z_t=t+s(n-t)/2, A_t=(n+t)/(2(t+1)Z_t), B_t=1/Z_t; at t=n-1 set A=1/(n+s-1), B=(n+1)/(n(n+s-1)). Their suffix minima give every current payoff at least c/n+P*underline(A)_t+V*underline(B)_t and W>=c+P*sum underline(A)+V*sum underline(B). A coefficient certificate, with no unrestricted half-coverage or optimality claim.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-MAXIMA-HALF","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-DYNAMIC-MAXIMA-FLOOR","CA-DYNAMIC-MAXIMA-MIXED","CA-TWO-REMAINING-TAX","CA-THREE-SHARP-5-3","CA-FOUR-UPPER-1499-750"],"conclusion":"CA-FIVE-MAXIMA-HALF","statement":"Any finite common unit catalog with at most five distinct inclusion-maximal coverages, arbitrary internal subthemes, any n>=1 and every complete ordered-history pure SPE: OPT_n<=2W. For n>=5 also OPT_n=U<=2W-c. For n=5 and s>=2, W>=c+(5/9)P+(67027/125400)V. Cases n<=4 use existing unconditional bounds; n>=6 follows dynamic floors and Gamma>=4n^2/(7n^2+3n+14)>1/2. No general-six-or-more-maxima or sharpness claim.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-MAXIMA-HALF-LIMIT","kind":"limits","track":"extensions","premises":["CA-FIVE-MAXIMA-HALF"],"conclusion":"Q-CAG-HALF","statement":"Half coverage is proved for arbitrary n when the distinct inclusion-maximal coverage count is at most five. Unrestricted catalogs with n>=5 remain open. No SPE counterexample is certified.","refs":["research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-REPLY-UPPER","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-FIVE-REPLY-UPPER","statement":"Exactly five unit providers, arbitrary finite common catalog and every complete ordered-history pure SPE at zero root background: OPT_5<=beta W, beta=493266145873827/234749688354196 approximately 2.10124302755>2. Three true optimal-theme reply menus and 24 nonnegative slacks give an exact identity checked on all 49152 affine corners; empty and repeated topics included. No half-coverage, sharpness, arbitrary-background or n>=6 claim.","refs":["research/current/customer_attraction/five_player_reply_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-ONE-FOLLOWER-DECORRELATION","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-ONE-FOLLOWER-DECORRELATION","statement":"At any legal ordered history with exactly two providers remaining, every full pure SPE and every distribution p on the common finite catalog satisfy E_A U_d(A,B(A))-E_(A,Aprime iid p) U_d(A,B(Aprime))=E_(A,Aprime) [U_d(B(A),A)-U_d(B(Aprime),A)]>=0. The dual value restricted to actual competitor tuples is at most the current payoff. Empty/repeated topics and all history-dependent ties included; no extension to multiple followers.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"recorded within stated scope"},{"id":"E-CA-ADAPTIVE-DECORRELATION-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-ADAPTIVE-DECORRELATION-NO","statement":"A saved four-provider, twelve-theme complete unit CAG SPE has true root replies c(4)=(2,3,11), c(9)=(6,7,3). Uniformly mixing queries 4 and 9 gives adaptive payoff minus independent reply payoff -11/4. All 1885 ordered nodes and 22620 action comparisons are replayed exactly. Refutes universal decorrelation, not u_i>=v_n, W>=n v_n or half coverage.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"recorded within stated scope"},{"id":"E-CA-ACTUAL-ROOT-TAIL-MENU-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-ACTUAL-ROOT-TAIL-MENU-NO","statement":"A complete three-provider, six-theme, 36-unit-customer SPE has root payoff10, unrestricted oblivious security v_3=10, and restricted actual-root continuation-menu minimax value z_1=11. The two unused query rows sum to22 for every mixture; equal mixture attains11. All43 ordered nodes and258 comparisons pass. A stationary reply-kernel choice also gives cap11. Not a half-coverage or unrestricted security-bridge counterexample.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"recorded within stated scope"},{"id":"E-CA-CREDIBLE-MENU-SECURITY-NO-ALL-N","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MOBIUS-BOOLEAN","CA-MOBIUS-FULL-HISTORY-EMBED"],"conclusion":"CA-CREDIBLE-MENU-SECURITY-NO-ALL-N","statement":"For every n>=3, a legal finite common catalog with positive integer unit-customer multiplicities and a complete ordered-history pure SPE has restricted actual-root menu value z_1=u_1+1/2. A two-group Boolean-potential marginal game is positively compiled with K=4sum|x|+1; its two omitted query labels prove the menu lower bound and equal mixture proves equality. Expanding to all2n pure-group tail columns gives an explicit unrestricted dual cap<=u_1. Full-history existence uses M2; finite n=3..6 regressions do not replace the universal proof.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-REPLY-UPPER-LIMIT","kind":"limits","track":"extensions","premises":["CA-FIVE-REPLY-UPPER"],"conclusion":"Q-CAG-HALF","statement":"The new universal five-player coefficient remains above2; neither nested floating LP outputs nor unrealizable relaxed points prove the conjecture or an SPE counterexample.","refs":["research/current/customer_attraction/five_player_reply_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-CREDIBLE-MENU-SECURITY-LIMIT","kind":"limits","track":"extensions","premises":["CA-OBLIVIOUS-MIXED-SECURITY-2N1","CA-ADAPTIVE-DECORRELATION-NO","CA-CREDIBLE-MENU-SECURITY-NO-ALL-N"],"conclusion":"Q-CAG-HALF","statement":"Static mixed security remains valid. Universal adaptive decorrelation and free mixing of actual root replies are false; unrestricted individual and aggregate credible SPE security bridges remain open. Enlarged competitor menus require a new cross-node payment argument.","refs":["research/current/customer_attraction/continuation_security_barriers.md"],"status":"recorded within stated scope"},{"id":"E-CA-SIX-MAXIMA-NO-PRIVATE-HALF","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-TWO-REMAINING-TAX","CA-THREE-SHARP-5-3","CA-FOUR-UPPER-1499-750"],"conclusion":"CA-SIX-MAXIMA-NO-PRIVATE-HALF","statement":"CAG-MODEL, at most six distinct inclusion-maximal coverages, no customer outside their common core belonging to exactly one maximum, arbitrary internal subthemes and every complete ordered-history pure SPE: OPT_n<=2W for all n>=1; for n>=5 also OPT_n=U<=2W-c. Shared-only dynamic floors F(p,r) are nondecreasing along all routed successors. The n=5,6 branches have 67 explicit integer/12 path coefficient certificates covering all 3752 residual-incidence inequalities; n>=7 has an analytic reciprocal-sum bound, n<=4 uses existing universal bounds. This shared-only proof retains its own scope; the separate CA-SIX-MAXIMA-HALF joint budget proves unrestricted half coverage.","refs":["research/current/customer_attraction/six_maxima_no_private.md","evidence/runs/2026-10-10/customer_attraction_six_maxima_no_private_certificates.json"],"status":"recorded within stated scope"},{"id":"E-CA-SIX-MAXIMA-NO-PRIVATE-HALF-LIMIT","kind":"limits","track":"extensions","premises":["CA-SIX-MAXIMA-NO-PRIVATE-HALF"],"conclusion":"Q-CAG-HALF","statement":"Arbitrary-provider half coverage holds for at most six maxima when every non-core customer belongs to at least two maxima. The separate joint-budget CA-SIX-MAXIMA-HALF now covers unrestricted six maxima for every n. For each of those four counts an exact dynamic-seat aggregate-path budget obstruction has sum_t xi_t<OPT_n/2, but the chosen legal path need not be an SPE path, so these do not refute equilibrium half coverage.","refs":["research/current/customer_attraction/six_maxima_no_private.md","research/current/customer_attraction/six_maxima_seat_obstructions.md"],"status":"recorded within stated scope"},{"id":"E-CA-SIX-MAXIMA-NINE-PLUS-HALF","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-DYNAMIC-MAXIMA-MIXED"],"conclusion":"CA-SIX-MAXIMA-NINE-PLUS-HALF","statement":"CAG-MODEL, at most six distinct inclusion-maximal coverages, arbitrary private and shared incidence, arbitrary internal subthemes, n>=9 and every complete ordered-history pure SPE: OPT_n=U<=2W-c. Fixed six-maxima mixed private coefficients each exceed or equal1/(2n), so their monotone envelope sums to at least1/2. Shared sum B_n=H_n−2(n−1)/[n(n+2)(n+5)] exceeds665881/1330560>1/2 for all n>=9 by an exact logarithm-series/trapezoid lower bound and decreasing correction. The separate CA-SIX-MAXIMA-HALF joint-budget theorem now covers n=5..8 and completes the unrestricted class.","refs":["research/current/customer_attraction/six_maxima_no_private.md","research/current/customer_attraction/dynamic_maxima_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-SIX-MAXIMA-NINE-PLUS-HALF-LIMIT","kind":"limits","track":"extensions","premises":["CA-SIX-MAXIMA-NINE-PLUS-HALF"],"conclusion":"Q-CAG-HALF","statement":"Unrestricted catalogs with at most six maximal coverages are now covered for n<=4 by general results and n>=9 by this corollary. The separate joint-budget CA-SIX-MAXIMA-HALF now covers counts n=5,6,7,8 without incidence restrictions. No SPE counterexample is asserted.","refs":["research/current/customer_attraction/six_maxima_no_private.md"],"status":"recorded within stated scope"},{"id":"E-CA-MOBIUS-SECURITY-BIAS-BARRIER","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MOBIUS-FULL-HISTORY-EMBED"],"conclusion":"CA-MOBIUS-SECURITY-BIAS-BARRIER","statement":"For p>=n>=2, arbitrary signed x and legal integer r_B=x_B+K, every n-distinct profile satisfies u_i-v_n>=K c-M, c=2^(p-n)(2^n-n-1)/(np)>=1/4 and M=sum|x_B|. A static dual uniform over all(n-1)-distinct-topic backgrounds gives this without SPE incentives. K=4M+1 and M2 imply individual margin>=1/4 and aggregate margin>=n/4 for every full-history root SPE. Smaller/nonuniform compensation remains open.","refs":["research/current/customer_attraction/compiler_security_barrier.md"],"status":"recorded within stated scope"},{"id":"E-CA-OPTIMAL-LAST-QUERY-SUM-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-MOBIUS-BOOLEAN"],"conclusion":"CA-OPTIMAL-LAST-QUERY-SUM-NO","statement":"A legal four-provider, seven-theme,1651-unit-customer complete pure SPE has path(E,G,A,C), payoffs(390,389,390,390), W1559, unique optimal support{B,C,D,F}, OPT1562. Against actual last-prefix(E,G,A), all four optimal query values equal390, giving1560>W; no alternate optimum repairs the bridge. All400 ordered nodes,2800 comparisons and210 terminal multisets pass two independent Fraction checks. A static dual cap4889/14<389 confirms that this instance satisfies the genuine mixed-security bridges.","refs":["research/current/customer_attraction/optimal_last_query_counterexample.md"],"status":"recorded within stated scope"},{"id":"E-CA-SECURITY-COMPILER-QUERY-LIMIT","kind":"limits","track":"extensions","premises":["CA-MOBIUS-SECURITY-BIAS-BARRIER","CA-OPTIMAL-LAST-QUERY-SUM-NO"],"conclusion":"Q-CAG-HALF","statement":"The prescribed sufficient-bias Mobius compiler satisfies genuine individual and aggregate security guarantees. An optimal last-query-sum sufficient bridge is false even with a unique optimum. Neither fact resolves unrestricted individual/aggregate security, root total tax, or arbitrary-player half coverage.","refs":["research/current/customer_attraction/compiler_security_barrier.md","research/current/customer_attraction/optimal_last_query_counterexample.md"],"status":"recorded within stated scope"},{"id":"E-CA-PREFIX-BALANCE-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-PREFIX-BALANCE-NO","statement":"For every integer n>=4 a common n+2-theme catalog with 2n^2-2n-2 distinct unit customers has a complete ordered-history pure SPE with actual path A,B^(n-1), u1=n-1/n, W=n^2-2, unique optimal support all n leaves, OPT=2n^2-2n-2 and F_(n-1)(A)=OPT-2(n-2). Hence B1=4-n-1/n<0. For every fixed real alpha<2, some n in this same family violates alpha*u1+F_(n-1)(A)>=OPT. All-history Jensen and true-continuation cases prove the universal result; independent finite n4..8 audits are supplementary. Half gap 2(n-1) and root-tax gap (n-3)/2+1/(n-1)+1/n are positive.","refs":["research/current/customer_attraction/prefix_balance_family.md","research/current/customer_attraction/prefix_balance_counterexample.md"],"status":"recorded within stated scope"},{"id":"E-CA-PREFIX-BALANCE-NO-LIMIT","kind":"limits","track":"extensions","premises":["CA-PREFIX-BALANCE-NO","CA-COVERAGE-OPPORTUNITY-NO"],"conclusion":"CA-COVERAGE-BALANCE-GAP","statement":"Period-by-period and every-prefix nonnegative coverage-loss charging are both false at reached complete-SPE histories. The final telescoping total balance remains equivalent to unrestricted half coverage and unresolved; this family retains positive half-coverage and root-total-tax margins. Adaptive weights or extra budgets are not excluded.","refs":["research/current/customer_attraction/prefix_balance_family.md","research/current/customer_attraction/prefix_balance_counterexample.md","research/current/customer_attraction/coverage_opportunity_counterexample.md"],"status":"explicit scope boundary"},{"id":"E-CA-FIVE-INDEXED-UPPER","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-TWO-REMAINING-TAX"],"conclusion":"CA-FIVE-INDEXED-UPPER","statement":"Exactly five unit providers, finite common catalog, zero root background and every complete ordered-history pure SPE: OPT_5<=beta W with beta=145473820534756099649387160645076613709/70560308704423797361284609157664425493 approximately2.06169478572>2. Indexed original-strategy second/third deviations yield437 necessary rows;57 nonnegative rational multipliers and complete6144 conditioned histogram residual ranges prove the exact identity. Arbitrary ties, empty/repeated themes and comparison indices retained. No n>=6, background or half-coverage claim.","refs":["research/current/customer_attraction/five_player_indexed_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-INDEXED-UPPER-LIMIT","kind":"limits","track":"extensions","premises":["CA-FIVE-INDEXED-UPPER"],"conclusion":"Q-CAG-HALF","statement":"The exact universal coefficient remains above2 and the matching primal proves only insufficiency of this437-row necessary-condition relaxation; general five-player half coverage remains open.","refs":["research/current/customer_attraction/five_player_indexed_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-INDEXED-ROWS-NO","kind":"derives","track":"extensions","premises":["CA-FIVE-INDEXED-UPPER"],"conclusion":"CA-FIVE-INDEXED-ROWS-NO","statement":"The precisely specified437-row indexed true-continuation necessary-condition relaxation with nonnegative type masses and W=1 has a64-atom exact rational feasible point O=beta>2. The matching universal dual makes beta its exact optimum. O is only the comparison-union variable; no complete SPE realization, genuine catalog OPT, original-game sharpness or conjecture counterexample is asserted.","refs":["research/current/customer_attraction/five_player_indexed_obstruction.md"],"status":"recorded within stated scope"},{"id":"E-CA-FIVE-INDEXED-ROWS-NO-LIMIT","kind":"limits","track":"extensions","premises":["CA-FIVE-INDEXED-ROWS-NO"],"conclusion":"Q-CAG-HALF","statement":"The exact universal coefficient remains above2 and the matching primal proves only insufficiency of this437-row necessary-condition relaxation; general five-player half coverage remains open.","refs":["research/current/customer_attraction/five_player_indexed_obstruction.md"],"status":"recorded within stated scope"},{"id":"E-CA-SIX-MAXIMA-HALF","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-DYNAMIC-MAXIMA-MIXED","CA-TWO-REMAINING-TAX","CA-THREE-SHARP-5-3","CA-FOUR-UPPER-1499-750","CA-FIVE-MAXIMA-HALF","CA-SIX-MAXIMA-NINE-PLUS-HALF"],"conclusion":"CA-SIX-MAXIMA-HALF","statement":"CAG-MODEL, at most six distinct inclusion-maximal coverages, arbitrary private/shared incidence, arbitrary internal subthemes and every complete ordered-history pure SPE: OPT_n<=2W for every n>=1; U<=2W for n>=5. Last actions must have maximal coverage. The five-player branch uses52 complete restricted-growth routing strings and32 valid slack rows per path; explicit nonnegative integer/10000 duals cover20080 exact customer/action membership columns. Six/seven/eight-player cases use the same path-free multipliers35/48,1/8,5/48,1/96 on a larger true-membership domain, verified on14112 columns and396 compressed cases. Earlier containers are never counted as true coverage. The old universal n<=4 bounds and analytic six-maxima n>=9 corollary complete all n. No universal core-strengthened U<=2W-c or seven-maxima claim.","refs":["research/current/customer_attraction/six_maxima_joint_bound.md","evidence/certificates/customer_attraction/six_maxima_joint_bound.json"],"status":"recorded within stated scope"},{"id":"E-CA-SIX-MAXIMA-HALF-LIMIT","kind":"limits","track":"extensions","premises":["CA-SIX-MAXIMA-HALF"],"conclusion":"Q-CAG-HALF","statement":"The unrestricted at-most-six-maxima slice is proved for every player count. The remaining universal half-coverage question needs n>=5 and at least seven distinct maximal coverages. The critical-case proof gives U<=2W without a universal core correction; no original-game sharpness or counterexample is claimed.","refs":["research/current/customer_attraction/six_maxima_joint_bound.md"],"status":"recorded within stated scope"},{"id":"E-CA-ROOT-TAX-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-ROOT-TAX-NO","statement":"A four-provider six-theme61-unit-customer complete ordered-history pure SPE has actual pathAAAF, payoffs(9,9,9,11), W38, OPT61 and pre-last root tax45/2. The actual zero-background root total-tax gap is OPT-W-tax=1/2>0. This refutes root total tax, rather than a non-SPE reordering or nonzero-background version. Static safety v4=9 has matching certificates; individual and aggregate safety and half coverage hold in this instance.","refs":["research/current/customer_attraction/root_tax_counterexample.md"],"status":"complete internal proof; unrefereed"},{"id":"E-CA-ROOT-TAX-NO-REVIEW","kind":"checks","track":"extensions","premises":["CA-ROOT-SECURITY-UPLOAD-CHECKS"],"conclusion":"CA-ROOT-TAX-NO","statement":"Exact full certificate replay for the finite counterexamples; independent mathematical reconstruction for the cone-equivalence theorem. These checks do not prove universalBR.","refs":["research/current/customer_attraction/root_tax_counterexample.md","evidence/runs/2026-10-10/customer_attraction_security_cone_review.md"],"status":"independent internal checks; not external peer review"},{"id":"E-CA-AGGREGATE-DECORRELATION-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL"],"conclusion":"CA-AGGREGATE-DECORRELATION-NO","statement":"A complete four-provider six-theme89-unit-customer SPE has W85, OPT89 and p on labels1,2 each half with aggregate decorrelation-1/48 and all later-player decorrelations zero. Incentive slack43/12 leaves compensated budget57/16>0. Matched unrestricted safety v4=508643/26546 gives W-4v4=110919/13273>0. The older36-unit certificate already also refutes aggregate decorrelation; the special zero-follower-decorrelation feature is preserved.","refs":["research/current/customer_attraction/global_security_budget_boundaries.md"],"status":"complete internal proof; unrefereed"},{"id":"E-CA-AGGREGATE-DECORRELATION-NO-REVIEW","kind":"checks","track":"extensions","premises":["CA-ROOT-SECURITY-UPLOAD-CHECKS"],"conclusion":"CA-AGGREGATE-DECORRELATION-NO","statement":"Exact full certificate replay for the finite counterexamples; independent mathematical reconstruction for the cone-equivalence theorem. These checks do not prove universalBR.","refs":["research/current/customer_attraction/global_security_budget_boundaries.md","evidence/runs/2026-10-10/customer_attraction_security_cone_review.md"],"status":"independent internal checks; not external peer review"},{"id":"E-CA-ONPATH-DECOUPLED-BUDGET-NO","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-ACTUAL-ROOT-TAIL-MENU-NO"],"conclusion":"CA-ONPATH-DECOUPLED-BUDGET-NO","statement":"The existing36-unit three-provider six-theme complete SPE, with p on unusedX2,Y2 each half, has D=(10,12,12), C=(11,23/2,12), kappa=(-1,1/2,0) and every actual incentive slack zero. Thus W-sum C=-1/2 refutes the all-p compensated budgetGB. This p has static guarantee25/3 below optimalv3=10; BR and the restriction to safety-optimalp are not refuted.","refs":["research/current/customer_attraction/global_security_budget_boundaries.md"],"status":"complete internal proof; unrefereed"},{"id":"E-CA-ONPATH-DECOUPLED-BUDGET-NO-REVIEW","kind":"checks","track":"extensions","premises":["CA-ROOT-SECURITY-UPLOAD-CHECKS"],"conclusion":"CA-ONPATH-DECOUPLED-BUDGET-NO","statement":"Exact full certificate replay for the finite counterexamples; independent mathematical reconstruction for the cone-equivalence theorem. These checks do not prove universalBR.","refs":["research/current/customer_attraction/global_security_budget_boundaries.md","evidence/runs/2026-10-10/customer_attraction_security_cone_review.md"],"status":"independent internal checks; not external peer review"},{"id":"E-CA-SECURITY-CONE-DUAL","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-STRATEGY-CONE"],"conclusion":"CA-SECURITY-CONE-DUAL","statement":"For a fixed complete ordered policy and rationalp, the entire rational SPE customer cone satisfies W>=n min_B beta_B(p).w iff one unrestricted static competitor distributionQ and nonnegative full-tree incentive multipliers lambda give c-n sumQ beta=Gamma^T lambda+r with r>=0. Finite minimax and Farkas prove equivalence; fixed-p universal certificate existence remains unresolved. Different-coverage catalogs require an existing legal realization of the policy for the perturbation argument. Standard extension of the existing strategy cone, not a new equilibrium mechanism or a universalBR proof.","refs":["research/current/customer_attraction/security_cone_duality.md"],"status":"complete internal proof; unrefereed"},{"id":"E-CA-SECURITY-CONE-DUAL-REVIEW","kind":"checks","track":"extensions","premises":["CA-ROOT-SECURITY-UPLOAD-CHECKS"],"conclusion":"CA-SECURITY-CONE-DUAL","statement":"Exact full certificate replay for the finite counterexamples; independent mathematical reconstruction for the cone-equivalence theorem. These checks do not prove universalBR.","refs":["research/current/customer_attraction/security_cone_duality.md","evidence/runs/2026-10-10/customer_attraction_security_cone_review.md"],"status":"independent internal checks; not external peer review"},{"id":"E-CA-ROOT-TOTAL-TAX-GAP","kind":"attacks","track":"extensions","premises":["CA-ROOT-TAX-NO"],"conclusion":"CA-ROOT-TOTAL-TAX-GAP","statement":"A strict deficit in a legal complete ordered-history SPE refutes this sufficient bridge, without refuting half coverage or unrestricted mixed security.","refs":["research/current/customer_attraction/root_tax_counterexample.md"],"status":"complete exact counterexample"},{"id":"E-CA-ALL-P-COMPENSATED-BUDGET-GAP","kind":"attacks","track":"extensions","premises":["CA-ONPATH-DECOUPLED-BUDGET-NO"],"conclusion":"CA-ALL-P-COMPENSATED-BUDGET-GAP","statement":"A strict deficit in a legal complete ordered-history SPE refutes this sufficient bridge, without refuting half coverage or unrestricted mixed security.","refs":["research/current/customer_attraction/global_security_budget_boundaries.md"],"status":"complete exact counterexample"},{"id":"E-CA-UPLOADED-BRIDGES-TARGET-LIMIT","kind":"limits","track":"extensions","premises":["CA-ROOT-TAX-NO","CA-AGGREGATE-DECORRELATION-NO","CA-ONPATH-DECOUPLED-BUDGET-NO","CA-SECURITY-CONE-DUAL"],"conclusion":"Q-CAG-HALF","statement":"Root total tax and all-p decorrelated total budgets are false. The full-tree unrestricted safety-dual equivalence is valid but does not establish universal certificate existence. All three replayed games satisfy BR and half coverage; general n>=5 catalogs remain unresolved.","refs":["research/current/customer_attraction/root_tax_counterexample.md","research/current/customer_attraction/global_security_budget_boundaries.md","research/current/customer_attraction/security_cone_duality.md"],"status":"open target; precise failed sufficient routes"},{"id":"E-CA-INDIVIDUAL-SECURITY-NO-PROOF","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-OBLIVIOUS-MIXED-SECURITY-2N1"],"conclusion":"CA-INDIVIDUAL-SECURITY-NO","statement":"A full43-history pure SPE with34 distinct unit customers and six distinct theme coverages has u1=29/3<v3=2411/246 by11/82. Matching static primal/dual certify the genuine max-min value; the optimal query distribution is unique. Aggregate W>=3v3 and half coverage remain true. Three is the minimum possible player count for this auxiliary failure, with no customer-count or topic-count minimality claim.","refs":["research/current/customer_attraction/individual_security_counterexample.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"E-CA-INDIVIDUAL-SECURITY-NO-CHECKS","kind":"checks","track":"extensions","premises":["CA-GENERAL-GLUING-CHECKS"],"conclusion":"CA-INDIVIDUAL-SECURITY-NO","statement":"Exact scopes and mathematical quantifiers independently checked; numerical audits certify only their stated instance or coefficient domains, not the unrestricted target.","refs":["research/current/customer_attraction/individual_security_counterexample.md"],"status":"independent internal checks; not external peer review"},{"id":"E-CA-IID-SECURITY-BENCHMARK-PROOF","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-OBLIVIOUS-MIXED-SECURITY-2N1"],"conclusion":"CA-IID-SECURITY-BENCHMARK","statement":"For every common finite catalog, n>=1 and nonnegative customer masses, maximizers of expected harmonic potential are precisely symmetric mixed static Nash distributions. All maximizers have identical positive-type coverage probabilities for n>=2, and a unique expected coverage Z_n; n v_n<=Z_n<=U. Does not establish sequential W>=Z_n or W>=n v_n.","refs":["research/current/customer_attraction/iid_security_and_flow_barriers.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"E-CA-IID-SECURITY-BENCHMARK-CHECKS","kind":"checks","track":"extensions","premises":["CA-GENERAL-GLUING-CHECKS"],"conclusion":"CA-IID-SECURITY-BENCHMARK","statement":"Exact scopes and mathematical quantifiers independently checked; numerical audits certify only their stated instance or coefficient domains, not the unrestricted target.","refs":["research/current/customer_attraction/iid_security_and_flow_barriers.md"],"status":"independent internal checks; not external peer review"},{"id":"E-CA-FULL-TREE-AVERAGING-NO-PROOF","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-IID-SECURITY-BENCHMARK","CA-STRATEGY-CONE"],"conclusion":"CA-FULL-TREE-AVERAGING-NO","statement":"For the specified36-theme policy with six labels and uniform q, exact nonnegative separators exclude arbitrary nonnegative depth weights and even all43 node weights after averaging each node's deviations with q, plus any static Nash multipliers and nonnegative residuals. Separators violate the full SPE rows; only these compression templates are refuted. The unaveraged full-tree and other-Q bridges remain open.","refs":["research/current/customer_attraction/iid_security_and_flow_barriers.md"],"status":"complete current proof with indep s","track":"extensions","premises":["CAG-MODEL","CA-FOUR-REMAINING-PROFIT-1499-750"],"conclusion":"CA-TAIL-FOUR-ALL-N","statement":"For every shared-catalog unit model, every complete history-dependent pure SPE and n>=4, OPT_n<=(n/2-1/750)W. Depends jointly on the all-legal-background four-remaining profit theorem, combinatorial index-subset comparison, K/n true deviation floors, and the integer background load tax bound. Does not imply a constant-two bound for n>=5.","refs":["research/current/customer_attraction/tail_profit_lift.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"E-CA-TAIL-FOUR-ALL-N-CHECKS","kind":"checks","track":"extensions","premises":["CA-GENERAL-GLUING-CHECKS"],"conclusion":"CA-TAIL-FOUR-ALL-N","statement":"Exact scopes and mathematical quantifiers independently checked; numerical audits certify only their stated instance or coefficient domains, not the unrestricted target.","refs":["research/current/customer_attraction/tail_profit_lift.md"],"status":"independent internal checks; not external peer review"},{"id":"E-CA-SEVEN-MAXIMA-N7-PLUS-PROOF","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-DYNAMIC-MAXIMA-MIXED","CA-TWO-REMAINING-TAX"],"conclusion":"CA-SEVEN-MAXIMA-N7-PLUS","statement":"A complete source proof, independently audited in all finite coefficient branches and its analytic n>=13 tail, proves U=OPT_n<=2W with exactly seven maxima, arbitrary internal subthemes, all ties, and n>=7. This current page is a dependency and asset overview rather than the full current rewrite. For exactly seven maxima and n5/n6,16/44 route-target orbits remain missing; existing partial trees cannot close them.","refs":["research/current/customer_attraction/seven_maxima_checkpoint.md"],"status":"complete source proof independently audited; current dependency overview only; unrefereed"},{"id":"E-CA-SEVEN-MAXIMA-N7-PLUS-CHECKS","kind":"checks","track":"extensions","premises":[ e mechanisms.","refs":["research/current/customer_attraction/terminal_tie_quotient.md"],"status":"complete stated-scope proof; general target not closed"},{"id":"E-CA-TERMINAL-TIE-LOCAL-QUADRATIC-CHECKS","kind":"checks","track":"evidence","premises":["CA-TERMINAL-TIE-CHECKS"],"conclusion":"CA-TERMINAL-TIE-LOCAL-QUADRATIC","statement":"Independent Fraction reconstruction checks the specified identities and complete finite witness; finite checks do not construct universal half-cover multipliers.","refs":["research/current/customer_attraction/terminal_tie_quotient.md"],"status":"internal exact arithmetic audit"},{"id":"E-CA-TERMINAL-TIE-FIXED-LIFT-NO-DERIVES","kind":"derives","track":"extensions","premises":["CAG-MODEL","CA-TERMINAL-REPLY-DUAL-LIFT","CA-TERMINAL-TIE-QUOTIENT-LIFT"],"conclusion":"CA-TERMINAL-TIE-FIXED-LIFT-NO","statement":"Three unit customers and a complete three-player SPE admit a nonnegative normalized certificate for the natural 2c-o target whose preserved early payment leaves remainder s with s dot w=-3/2. Reciprocal terminal ties, and even additional nonnegative original incentive rows, cannot repair it without reducing or changing the early weights. A different normalized certificate in the same instance does lift; this is not a welfare or safety counterexample.","refs":["research/current/customer_attraction/terminal_tie_lift_obstruction.md"],"status":"complete stated-scope proof; general target not closed"},{"id":"E-CA-TERMINAL-TIE-FIXED-LIFT-NO-CHECKS","kind":"checks","track":"evidence","premises":["CA-TERMINAL-TIE-CHECKS"],"conclusion":"CA-TERMINAL-TIE-FIXED-LIFT-NO","statement":"Independent Fraction reconstruction checks the specified identities and complete finite witness; finite checks do not construct universal half-cover multipliers.","refs":["research/current/customer_attraction/terminal_tie_lift_obstruction.md"],"status":"internal exact arithmetic audit"},{"id":"E-CA-TERMINAL-TIE-FIXED-LIFT-LIMITS","kind":"limits","track":"extensions","premises":["CA-TERMINAL-TIE-FIXED-LIFT-NO","CA-TERMINAL-TIE-QUOTIENT-LIFT"],"conclusion":"CA-TERMINAL-TRANSPORT-GAP","statement":"A normalized certificate and its early weights must be chosen together with terminal corrections: arbitrary input certificates cannot be repaired by adding nonnegative original rows. Nonuniform incumbent transfers survive beyond unseen-customer corrections.","refs":["research/current/customer_attraction/terminal_tie_quotient.md","research/current/customer_attraction/terminal_tie_lift_obstruction.md"],"status":"exact restriction on the proposed lifting mechanism; general target open"},{"id":"WC-RING-CERT","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL"],"conclusion":"OC-INTERFACE-v1","statement":"Direct load identities, odd parity, and exact positive product feasibility prove the full-state interface.","refs":["research/current/weighted_congestion/odd_ring_linear.md"],"status":"proved within explicit scope"},{"id":"WC-RING-RESET","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL","OC-INTERFACE-v1"],"conclusion":"OC-AMPLIFIER-LIMIT-v1","statement":"A degree-one reset with finitely many degree-d buffers has strict cyclic product>1 whenever alpha<H_d(t).","refs":["research/current/weighted_congestion/odd_ring_linear.md"],"status":"proved within explicit scope"},{"id":"WC-RING-ENVELOPE","kind":"derives","track":"weighted_congestion","premises":["OC-AMPLIFIER-LIMIT-v1"],"conclusion":"OC-AMPLIFIER-ENVELOPE-v1","statement":"Exact convex minimization of t+(1+t)^(-d), with strictly positive correction, excludes E_d itself.","refs":["research/current/weighted_congestion/odd_ring_linear.md"],"status":"proved within explicit scope"},{"id":"WC-RING-FAILED-EDGE","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL","OC-INTERFACE-v1"],"conclusion":"OC-LIGHT-FORCING-EXACT-v1","statement":"Direct stability checks prove necessity under light forcing; one equal edge yields a PNE if its hub test fails." "],"status":"complete exact statements with independent internal reconstruction; unrefereed"},{"id":"E-WCF-R3-FIXED-DEGREE-FAIL-v1","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL"],"conclusion":"WCF-R3-FIXED-DEGREE-FAIL-v1","statement":"Keeping crossover weights/amplitudes and raising six degrees gives a 9/5-PNE at degree40; best factors converge to 5235403/2930833<9/5. Reweighting is not excluded.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/crossover/README.md"],"status":"complete exact statements with independent internal reconstruction; unrefereed"},{"id":"E-WC-R3-CROSS32-TOPOLOGY-SEPARATION-v1","kind":"derives","track":"weighted_congestion","premises":["WC-R3-SOURCE32-178-v1","WCF-R3-CROSS32-AUDIT-v1","WC-R3-FULL-TOPOLOGY-REDUCTION-v3"],"conclusion":"WC-R3-CROSS32-TOPOLOGY-SEPARATION-v1","statement":"T32<=89/50<9/5<B(G), allowing all positive common light weights and arbitrary nonnegative principal/side polynomial coefficients in the symmetric topology.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/crossover/separation.md"],"status":"complete exact statements with independent internal reconstruction; unrefereed"},{"id":"E-WC-R3-DENSE-SHARE-v1","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL"],"conclusion":"WC-R3-DENSE-SHARE-v1","statement":"For all positive real finite weight sets and nonnegative polynomial c, uniform Shapley shares of W*c(W) have increasing raw shares, decreasing shares per weight, and minw*c(W)<=phi_i<=maxw*c(W).","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/weight_bands/README.md","research/reviews/weighted_congestion/weight_bands_review/independent_review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"E-WC-R3-DENSE-LOCAL-v1","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL","WC-R3-DENSE-SHARE-v1"],"conclusion":"WC-R3-DENSE-LOCAL-v1","statement":"For every finite polynomial congestion game, resource potential-user weight ratio at most R>=1 ensures every stated scaled-potential minimizer is R-PNE, with no degree or cardinality factor. Empty strategies and zero costs included.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/weight_bands/README.md","research/reviews/weighted_congestion/weight_bands_review/independent_review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"E-WC-R3-DENSE-POT-SHARP-v1","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL","WC-R3-DENSE-SHARE-v1"],"conclusion":"WC-R3-DENSE-POT-SHARP-v1","statement":"For every fixed R>1, an explicit finite-game sequence of local ratio R has unique stated-potential minimizers with factors tending to R, while each game has an exact PNE.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/weight_bands/README.md","research/reviews/weighted_congestion/weight_bands_review/independent_review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"E-WC-R3-BAND-CURL-v1","kind":"derives","track":"weighted_congestion","premises":["WC-R3-DENSE-SHARE-v1"],"conclusion":"WC-R3-BAND-CURL-v1","statement":"Two users of weights 1,M>1 with cubic total cost give incompatible mixed differences kappa versus kappa/M for separately normalized Shapley marginals. This does not rule out weighted or other potentials.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/weight_bands/README.md","research/reviews/weighted_congestion/weight_bands_review/independent_review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"E-WC-R3-BAND-LINEAR-v1","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL","WC-R3-DENSE-SHARE-v1"],"conclusion":"WC-R3-BAND-LINEAR-v1","statement":"For every integer d>=7 the specified unmodified/scaled Shapley selector has unique minima with factor at least d/6 although exact PNE exists. Optional empty-choice padding makes each potential band arbitrarily dense without rescuing this selector.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/weight_bands/README.md","research/reviews/weighted_congestion/weight_bands_review/independent_review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"E-WCF-R3-SCALED-ORIGINAL-v1","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL"],"conclusion":"WCF-R3-SCALED-ORIGINAL-v1","statement":"For weights (1,1/(10m),1/(20m),1/(50m)), six degrees32m^2 and original amplitudes, B(G_m)->65/34 and every m>=1 has no9/5-PNE. Any fixed alpha<65/34 is obstructed for all sufficiently large m.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/crossover/limit_family.md","research/reviews/weighted_congestion/crossover_limit_review/review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"E-WCF-R3-SCALED-RETUNED-v2","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL"],"conclusion":"WCF-R3-SCALED-RETUNED-v2","statement":"With exactly the displayed retuned rational amplitudes, every m>=20 and separately m=3 gives no2-PNE; m=1,2 have2-PNE; B(G_m)->100/49. Version1 m>=52 is a proved subcase, not silently rewritten.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/crossover/limit_family.md","research/reviews/weighted_congestion/crossover_limit_review/review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"E-WCF-R3-SCALED-TEMPLATE-v1","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL"],"conclusion":"WCF-R3-SCALED-TEMPLATE-v1","statement":"For every real 1<=alpha<r, r>2 root of r^3-r^2-2r-1, fixed rational amplitudes and a finite M yield strict alpha improvement at every state for all m>=M. The selected-witness cone is infeasible at alpha>=r; full-topology optimality is unclaimed.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/crossover/limit_family.md","research/reviews/weighted_congestion/crossover_limit_review/review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"E-WC-R3-POTENTIAL-DENSITY-PADDING-v1","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL"],"conclusion":"WC-R3-POTENTIAL-DENSITY-PADDING-v1","statement":"Arbitrary finite empty/{e} positive-weight padding preserves all finite-alpha equilibrium projection/lift and original deviation costs. Every occupied potential-weight interval can have minimum count L, yet that subclass and the full G_d have identical successful-factor sets and thresholds.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/density_padding/optional_user_density_padding.md","research/reviews/weighted_congestion/density_padding/review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"E-WC-R3-ODD-RING-CERTIFICATE-v1","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL"],"conclusion":"WC-R3-ODD-RING-CERTIFICATE-v1","statement":"For odd m>=3, n_i>=1, positive u_i,v_i, 1<=k_i<=d and alpha>1, the specified two strict local tests have positive coefficients iff all N_i,Q_i>0 and product n_i N_i Q_i/(M_i P_i)>1. They exclude alpha-PNE at every state.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/odd_ring/cohort_lower_bound_and_envelope.md","research/reviews/weighted_congestion/odd_ring_independent/REVIEW.md","research/reviews/weighted_congestion/odd_ring_independent/EXACT_ENVELOPE_REVIEW.md","research/reviews/weighted_congestion/odd_ring_parameters/exact_envelope_review.md","research/reviews/weighted_congestion/odd_ring_literature/notes.md"],"status":"complete general proofs with independent internal reconstruction; unrefereed; global priority unverified"},{"id":"E-WC-R3-ODD-RING-ENVELOPE-v1","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL","WC-R3-ODD-RING-CERTIFICATE-v1"],"conclusion":"WC-R3-ODD-RING-ENVELOPE-v1","statement":"For each d>=2 and alpha>1, some finite odd ring satisfies the positive monomial local-test system iff alpha<T_d=sup_R>1 [R(1+R)^d+1]/[(1+R)^d+R^(d+1)]. H_d<T_d<=H_d+1/(2^d+1), H_d=d/[(d+1)d^(1/(d+1))-d], hence T_d~d/ln d.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/odd_ring/cohort_lower_bound_and_envelope.md","research/reviews/weighted_congestion/odd_ring_independent/REVIEW.md","research/reviews/weighted_congestion/odd_ring_independent/EXACT_ENVELOPE_REVIEW.md","research/reviews/weighted_congestion/odd_ring_parameters/exact_envelope_review.md","research/reviews/weighted_congestion/odd_ring_literature/notes.md"],"status":"complete general proofs with independent internal reconstruction; unrefereed; global priority unverified"},{"id":"E-WC-R3-ODD-RING-LOWER-v1","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL","WC-R3-ODD-RING-CERTIFICATE-v1","WC-R3-ODD-RING-ENVELOPE-v1"],"conclusion":"WC-R3-ODD-RING-LOWER-v1","statement":"For every integer d>=2 and real 1<=alpha<T_d, a finite rational-weight/coefficient congestion game, all resource latencies positive monomials of degree exactly d, has no alpha-PNE. Therefore a_*(d)>=T_d~d/ln d and liminf a_*(d)ln(d)/d>=1.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/odd_ring/cohort_lower_bound_and_envelope.md","research/reviews/weighted_congestion/odd_ring_independent/REVIEW.md","research/reviews/weighted_congestion/odd_ring_independent/EXACT_ENVELOPE_REVIEW.md","research/reviews/weighted_congestion/odd_ring_parameters/exact_envelope_review.md","research/reviews/weighted_congestion/odd_ring_literature/notes.md"],"status":"complete general proofs with independent internal reconstruction; unrefereed; global priority unverified"},{"id":"E-WC-R3-ODD-RING-POLYNOMIAL-ENVELOPE-v1","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL","WC-R3-ODD-RING-CERTIFICATE-v1","WC-R3-ODD-RING-ENVELOPE-v1"],"conclusion":"WC-R3-ODD-RING-POLYNOMIAL-ENVELOPE-v1","statement":"For d>=2 and alpha>1, allowing each odd-ring group independent nonnegative degree-at-most-d shapes F_i,G_i, common across its action copies/cohort, does not change positive two-local-test feasibility: some finite certificate exists iff alpha<T_d. Constants in mixtures and arbitrary positive real weights are covered; zero shapes cannot satisfy the strict tests.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/odd_ring/cohort_lower_bound_and_envelope.md","research/reviews/weighted_congestion/odd_ring_parameters/polynomial_envelope_review.md"],"status":"complete stated-scope proof with independent internal attack; unrefereed; global priority unverified"},{"id":"E-WC-R3-ODD-RING-SINGLETON-UPPER-v1","kind":"derives","track":"weighted_congestion","premises":["WC-MODEL","WC-R3-ODD-RING-POLYNOMIAL-ENVELOPE-v1"],"conclusion":"WC-R3-ODD-RING-SINGLETON-UPPER-v1","statement":"Every odd m>=3 ring with n_i=1 at every group, arbitrary positive real weights, symmetric action copies and nonnegative polynomial fees of degree at most d>=2 (zero fees permitted), has a min{2,T_d}-PNE. A T_d-PNE exists among the 2m single-conflict profiles modulo global action exchange. Direct support-two total-cost proof supplies factor <script>
const graph = JSON.parse(document.getElementById('graph-data').textContent);
const byId = new Map(graph.nodes.map(n => [n.id,n]));
const routeBox = document.getElementById('routes');
const inspector = document.getElementById('inspector');
const search = document.getElementById('search');
const track = document.getElementById('track');
const kind = document.getElementById('kind');
const clear = document.getElementById('clear');
let selected = null;
const trackNames = {model:'Model',local:'Local geometry',shared:'Shared phi',heterogeneous:'Heterogeneous',computation:'Exact computation',extensions:'Cost extensions',evidence:'Evidence',weighted_congestion:'加权拥塞'};
const add = (parent,tag,text,cls) => { const e=document.createElement(tag); if(text!==null)e.textContent=text; if(cls)e.className=cls; parent.appendChild(e); return e; };
const link = (parent,path) => { const a=add(parent,'a',path); a.href='../'+path; a.target='_blank'; a.rel='noopener'; return a; };
for(const t of Object.keys(trackNames)) { const o=add(track,'option',trackNames[t]); o.value=t; }
for(const k of Object.keys(graph.legend)) { const o=add(kind,'option',k); o.value=k; }
function nodeButton(parent,id,target) {
  const n=byId.get(id), b=add(parent,'button',null,'node'+(target?' target':''));
  b.type='button'; b.setAttribute('aria-label',n.id+' '+n.title);
  add(b,'strong',n.id); add(b,'small',n.title);
  b.addEventListener('click',()=>selectNode(id)); return b;
}
function selectNode(id) {
  selected=id; clear.hidden=false; const n=byId.get(id); inspector.replaceChildren();
  add(inspector,'h2',n.title); add(inspector,'span',n.id+' · '+n.kind+' · '+n.status+' · '+trackNames[n.track],'badge');
  add(inspector,'p',n.detail);
  add(inspector,'h3','现行说明与原始来源'); const list=add(inspector,'ul');
  for(const ref of n.refs) link(add(list,'li'),ref);
  const incoming=graph.hyperedges.filter(e=>e.conclusion===id);
  const outgoing=graph.hyperedges.filter(e=>e.premises.includes(id));
  add(inspector,'h3','Relationships');
  add(inspector,'p',incoming.length+' incoming · '+outgoing.length+' outgoing. Click a route ID to keep the branch in view.');
  const rel=add(inspector,'ul');
  for(const e of [...incoming,...outgoing]) {
    const a=add(add(rel,'li'),'a',e.id+' · '+e.kind+' · '+e.statement); a.href='#'+e.id;
  }
  render();
}
function render() {
  const q=search.value.trim().toLowerCase(), branch=track.value, relation=kind.value;
  routeBox.replaceChildren(); let count=0;
  for(const e of graph.hyperedges) {
    const terms=[e.id,e.statement,...e.refs,e.conclusion,byId.get(e.conclusion).title,...e.premises.flatMap(p=>[p,byId.get(p).title])].join(' ').toLowerCase();
    if(branch && e.track!==branch) continue;
    if(relation && e.kind!==relation) continue;
    if(q && !terms.includes(q)) continue;
    if(selected && !e.premises.includes(selected) && e.conclusion!==selected) continue;
    count++;
    const card=add(routeBox,'article',null,'route'); card.id=e.id; card.dataset.kind=e.kind;
    const meta=add(card,'div',null,'meta'); add(meta,'span',e.id); add(meta,'span',e.kind); add(meta,'span',e.status); add(meta,'span',trackNames[e.track]);
    const row=add(card,'div',null,'relation'); const inputs=add(row,'div',null,'premises');
    for(const p of e.premises) nodeButton(inputs,p,false);
    add(row,'span',e.kind==='attacks'?'⊣':'⇒','junction');
    nodeButton(row,e.conclusion,true);
    add(card,'p',e.statement);
    const sources=add(card,'div',null,'refs'); add(sources,'span','现行说明与来源: ');
    e.refs.forEach((ref,i)=>{ if(i)add(sources,'span',' · '); link(sources,ref); });
  }
  if(!count)add(routeBox,'div','No routes match. Clear a filter or select another branch.','empty');
  document.getElementById('count').textContent=count+' / '+graph.hyperedges.length+' hyperedges';
}
for(const control of [search,track,kind]) control.addEventListener('input',render);
clear.addEventListener('click',()=>{selected=null;clear.hidden=true;render();});
render();
</script>
