<style>
:root { color-scheme: light; --ink:#17252d; --muted:#52636b; --line:#ccd9dc; --paper:#f5f7f5; --card:#fff; --teal:#146b69; --ochre:#a36c18; --red:#aa4a45; }
* { box-sizing:border-box }
body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--paper); color:var(--ink) }
header { padding:26px max(20px,calc((100vw - 1480px)/2)); background:#143b41; color:#f2f8f6 }
h1 { margin:0; font-size:clamp(1.5rem,3vw,2.3rem); letter-spacing:-.025em }
header p { max-width:900px; margin:9px 0 0; color:#d5e4e2 }
header a { color:#d0e8eb }
.shell { max-width:1480px; margin:auto; padding:20px; display:grid; grid-template-columns:minmax(0,1fr) minmax(270px,340px); gap:18px; align-items:start }
.tools { grid-column:1/-1; display:flex; gap:10px; flex-wrap:wrap; align-items:center }
input,select { border:1px solid #a9bcbf; border-radius:7px; padding:10px 12px; font:inherit; background:white; color:var(--ink) }
button.clear { border:1px solid #a9bcbf; border-radius:7px; padding:10px 12px; font:inherit; background:white; color:var(--ink); cursor:pointer }
input { flex:1 1 250px }
.count { color:var(--muted); margin-left:auto }
.routes { min-width:0; display:grid; gap:11px }
.route { background:var(--card); border:1px solid var(--line); border-left:5px solid var(--teal); padding:14px 16px; border-radius:9px; box-shadow:0 1px 3px #18394210 }
.route[data-kind=attacks] { border-left-color:var(--red) }
.route[data-kind=checks],.route[data-kind=limits] { border-left-color:var(--ochre) }
.route[data-kind=implements] { border-left-color:#556cac }
.meta { display:flex; gap:9px; align-items:center; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700 }
.relation { display:grid; grid-template-columns:minmax(0,1fr) 34px minmax(150px,32%); align-items:center; gap:8px; margin:13px 0 }
.premises { display:flex; flex-wrap:wrap; gap:5px; padding:8px; border:1px solid var(--line); border-radius:7px; background:#f8faf8; min-height:45px }
.junction { text-align:center; font-size:20px; color:var(--teal); font-weight:700 }
.node { border:1px solid #a6c9c4; color:#124d52; background:#e8f4f1; border-radius:5px; padding:5px 8px; font:inherit; font-size:13px; text-align:left; cursor:pointer }
.node:hover,.node:focus-visible { outline:2px solid var(--teal) }
.node small { display:block; font-size:11px; opacity:.78 }
.target { width:100%; background:#e5f0f3; border-color:#7da6af }
.route[data-kind=attacks] .target { background:#faeae7; border-color:#d1a29d; color:#7c3430 }
.route p { margin:6px 0; }
.refs { font-size:12px; color:var(--muted); overflow-wrap:anywhere }
a { color:#145c76 }
aside { position:sticky; top:16px; background:#fff; border:1px solid var(--line); border-radius:9px; padding:18px; max-height:calc(100vh - 32px); overflow:auto }
aside h2 { margin:0 0 10px; font-size:19px }
aside p { margin:9px 0 }
aside ul { padding-left:20px }
.badge { display:inline-block; padding:2px 7px; border-radius:4px; background:#e9efee; font-size:12px }
.empty { padding:24px; border:1px dashed var(--line); border-radius:9px }
@media(max-width:850px) { .shell { display:block } .tools { margin-bottom:12px } aside { position:static; max-height:none; margin-top:16px } }
@media(max-width:570px) { .relation { grid-template-columns:1fr; gap:3px } .junction { transform:rotate(90deg) } }
</style>

<p>每张关系卡是一条超边：左侧的前提须同时成立，才按中间的关系类型通向右侧结论。红色反驳的是被提出的错误命题；黄色表示有限测试或适用边界。点击节点查看精确作用和原始来源。共享主定理的完整主稿与现行 Markdown 全分支重写均经过内部审读；外部同行评审另记。</p>
<p><a href="../README.md">研究总览</a> · <a href="current/claims.md">现行命题</a> · <a href="graph.json">结构化数据</a></p>

e on-path load when maximum reach is positive, with all four transfer inequalities including singleton-source clients.","refs":["research/current/multi_facility/uniform_two.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"MF-PACK-2","kind":"lemma","track":"extensions","title":"Bounded bins or singleton heavy atoms","detail":"For all a>0 and h>=1, weights totaling <=(h+1)a fit h bins of load <=2a except isolated singleton weights >2a, by pair merging.","refs":["research/current/multi_facility/uniform_two.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"MF-PURE-CAP","kind":"lemma","track":"extensions","title":"Full-game pure equilibration preserves a load cap","detail":"At any fixed layout, isolated atoms heavier than B and ordinary loads <=B form a strict-improvement invariant; a pure exact NE exists in that invariant, for every B>0.","refs":["research/current/multi_facility/uniform_two.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"MF-CONT-COMPLETE","kind":"lemma","track":"extensions","title":"Compatible complete continuation for labeled layouts","detail":"Exact on-path NE plus one exact NE at each actual deviation extend to a single complete rule; distinct coordinate deviations are distinct labeled layouts and all default subgames have pure NE.","refs":["research/current/multi_facility/uniform_two.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"SC-K-SYMMETRIC-MENU-OBSTRUCTION","kind":"claim","track":"extensions","title":"Unbounded symmetric-menu threat with a full exact SPE","detail":"For each q>=3, the three-site weights q^2,1,q-1/4 yield a lexmax on-path witness with symmetric-menu ratio q^2/(q-1/4)>q after B->T, but alpha*=1 in the full model.","refs":["research/current/multi_facility/symmetric_menu_obstruction.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"SC-K-LEXMAX-BARRIER","kind":"claim","track":"extensions","title":"Selected lexmax layouts can optimally require almost two","detail":"For every k>=2,h>=2, the explicit k-site family has unique lexmax occupancy up to labels with optimal factor 2h/(h+1) under all on/off-path NE choices, but full-instance alpha*=1 at another layout.","refs":["research/current/multi_facility/lexmax_boundary.md","research/current/multi_facility/claims.md","research/current/multi_facility/reverse_review.md"],"status":"complete current proof, independently internally audited; unrefereed"},{"id":"MF-MODEL","kind":"definition","track":"model","title":"Common catalog, arbitrary labeled k","detail":"Positive atomic weights, common finite catalog, independent mixed exact client NE and a complete continuation at all labeled layouts.","refs":["research/current/multi_facility/model.md"],"status":"specified"},{"id":"MF-LEXMAX","kind":"construction","track":"extensions","title":"Finite site-uniform lexmax family","detail":"Optimize sorted facility loads over all layouts and feasible pure-to-site client assignments, then mix independently uniformly within the chosen site.","refs":["research/current/multi_facility/uniform_two.md"],"status":"finite exact construction; not polynomial time"},{"id":"MF-SYMMETRIC-FAMILY","kind":"construction","track":"extensions","title":"Explicit three-atom q-family","detail":"k=q+1; weights q^2,1,q-1/4; covers {A,T},{A},{B}; on-path A^q B.","refs":["research/current/multi_facility/symmetric_menu_obstruction.md"],"status":"explicit family"},{"id":"MF-LEXMAX-FAMILY","kind":"construction","track":"extensions","title":"Explicit k-atom h-family","detail":"Sites A,T and k-2 private anchors; weights h,1,3(h+1)/4 at each anchor; bad occupancy A,A,anchors and good occupancy T,A,anchors.","refs":["research/current/multi_facility/lexmax_boundary.md"],"status":"explicit family"},{"id":"MF-EXACT-CODE","kind":"artifact","track":"computation","title":"Arbitrary-k exact constructor and full-rule evaluator","detail":"Separate sibling package; exhaustive lexmax, cap-preserving pure equilibrium selection, deterministic defaults, rational certificate output.","refs":["research/current/multi_facility/uniform_two.md","multi_facility_spe/two_exists.py","multi_facility_spe/__main__.py"],"status":"implemented; exponential worst case"},{"id":"MF-EXACT-AUDIT","kind":"evidence","track":"evidence","title":"Definition-level, reverse, and barrier audits","detail":"Two main exact batches plus an explicit-family barrier audit; tests do not establish universal mathematical truth.","refs":["research/current/multi_facility/reverse_review.md","tests/multi_facility/definition_check.py","tests/multi_facility/run_exact_audit.py","tests/multi_facility/run_reverse_audit.py","tests/multi_facility/run_lexmax_barrier_audit.py","evidence/runs/kfac_two_exact.json","evidence/runs/kfac_two_reverse.json","evidence/runs/kfac_lexmax_barrier.json","tests/audits/kfac_independent.py","evidence/runs/kfac_independent.json"],"status":"finite exact evidence"},{"id":"GLMM04","kind":"source","track":"computation","title":"Polynomial restricted-link Nashification","detail":"Published STOC 2004 theorem: from any feasible integer-weight assignment on identical restricted links, compute a pure Nash equilibrium with nonincreased makespan in time polynomial in job count, links, edges and log total weight.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"published fact"},{"id":"MF-PURE-CAP-POLY","kind":"lemma","track":"computation","title":"Polynomial capped full-game equilibration","detail":"Given a rational pure assignment with isolated clients heavier than B and all ordinary loads at most B, deleting isolated resources, applying restricted-link Nashification, and reinserting them produces a full pure NE with ordinary loads at most B in input-bit-polynomial time.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal deduction from published theorem; unrefereed"},{"id":"SC-K-LEXMAX-STRONG-HARD","kind":"claim","track":"computation","title":"Exact global lexmax selection is strongly NP-complete","detail":"On explicit positive-integer common-catalog inputs with k=site count and equal reaches, deciding whether the best site-uniform sorted load vector has minimum at least a threshold is strongly NP-complete by 3-PARTITION. The reduction family nevertheless has an easy exact SPE.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-LOCAL-PLS","kind":"lemma","track":"computation","title":"Polynomial lex-neighborhood suffices for factor two","detail":"A locally maximal site-uniform state for all one-customer site transfers and canonical one-facility site transfers satisfies the exact customer NE and four budget inequalities. A polynomial-bit radix potential places this sufficient-state search in PLS, not necessarily P.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-GREEDY-BUDGET","kind":"lemma","track":"computation","title":"Polynomial greedy construction of all transfer budgets","detail":"For any positive-reach rational common-catalog instance, repeated maximum of occupied-site W/(q+1) and unoccupied-site new-coverage weight produces positive facility loads and all four orphan-aware transfer budgets in polynomial time; it can fail on-path client NE.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof and independent attack; unrefereed"},{"id":"SC-K-GREEDY-UNOPENED-2","kind":"claim","track":"computation","title":"Greedy unopened target retains factor-two initial cap","detail":"After any strict site-level customer improvement from the greedy assignment, all facility loads exceed the last insertion score gamma and unopened new reach is at most gamma; an abandoned singleton source contributes at most its own current load.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-EQUAL-MULT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for equal greedy multiplicities","detail":"If all greedily occupied sites have the same multiplicity q>=2, range-preserving restricted identical-link Nashification makes the on-path mixed customer NE and restores (5)-(6), then capped polynomial deviation repair yields a full factor-two continuation.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-DISTINCT-GREEDY-3","kind":"claim","track":"computation","title":"Polynomial factor three for distinct greedy sites","detail":"If greedy occupies k distinct sites, range-preserving pure Nashification and makespan-preserving off-path completion give a bit-polynomial full factor-three continuation.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-COMPONENT-MULT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for componentwise constant greedy multiplicities","detail":"Customer-overlap components have constant q, with q=1 components singleton; range-preserving site Nashification separately by component preserves all original transfer budgets and produces a complete bit-polynomial factor-two continuation.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-GREEDY-STATIC-PACK-NO","kind":"claim","track":"computation","title":"Frozen-site cap packing fails after greedy customer repair","detail":"Five sites, eight facilities and nine integer clients: a reachable exact site-uniform NE has B-load 41/2 and E two clients totaling 44, exceeding cap 41 after B facility moves; the source B survives, but E cannot be capped if its clients remain there.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete exact construction; internally checked; unrefereed"},{"id":"SC-K-GREEDY-CAP-INFEASIBLE","kind":"claim","track":"computation","title":"Global capped off-path assignment infeasible after greedy repair","detail":"Six sites, eight facilities and ten integer customers; at one B-to-G deviation the on-path load is 41/2, while forced private 20 at B/E/G and shared 24 make every pure assignment exceed ordinary cap 41 without a >41 macro. An exact NE gives the deviator only 20.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete exact construction; internally checked; unrefereed"},{"id":"SC-K-GREEDY-MAX-MULT","kind":"lemma","track":"computation","title":"Initial greedy customers occupy maximal-final-multiplicity sites","detail":"If a client first assigned at site s can also use later opened t, then opening weights obey W_s^0>W_t^0; q_t>q_s contradicts greedy at the last insertion to t. Not asserted after client repair.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-DISTINCT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for all-distinct greedy layouts","detail":"The first maximum-reach site offers persistent insertion score R/2; range-preserving fixed-layout Nashification guarantees on-path load >=R/2 and every off-path payoff is <=R.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-RANGE-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two under multiplicity-class range certificate","detail":"Groupwise Nashification keeps initial per-facility load extrema and same-q client NE; each cross-q client passes a range inequality, while a pooled q=1 source inequality and a 2a initial deviator cap handle departures.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-LIGHT-COMPONENT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two when light overlaps preserve multiplicity","detail":"Clients lighter than final greedy score have only same-q occupied alternatives; range certification follows for cross-q heavy clients and constructs exact factor two.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-GREEDY-HEAVY-OVERLAP-2","kind":"claim","track":"computation","title":"Polynomial factor two with heavy overlapping clients","detail":"If all clients spanning occupied sites weigh at least final greedy score, the unmodified greedy assignment is a customer NE and its transfer budgets yield exact factor two.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"complete direct internal proof; unrefereed"},{"id":"SC-K-GREEDY-REPAIR-ORDER-NO","kind":"claim","track":"computation","title":"Arbitrary strict greedy customer repair can lose factor two","detail":"A six-site eight-facility integer instance has a reachable exact on-path NE whose B-to-G deviation is forced to ratio 32/15 in all mixed off-path NE; another reachable NE at the same layout retains budgets.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-GREEDY-HEAVIEST-NO","kind":"claim","track":"computation","title":"Heaviest-first greedy customer repair can lose factor two","detail":"A related integer instance forces uniquely greatest-weight improving moves to an exact on-path NE with mixed-off-path deviation ratio 88/43; a different one-step NE retains budgets.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-TWO-SITE-COMPONENT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for two-site mixed-multiplicity components","detail":"Greedy occupied-site overlap components of constant q or at most two sites admit a bit-polynomial full exact factor-two construction via descending-weight high-to-low client transfers, load box, and orphan-aware completion.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-GREEDY-FIXED-LEXMAX-NO","kind":"claim","track":"computation","title":"Fixed greedy-layout customer lexmax can uniquely select bad NE","detail":"In the six-site 32/15 integer instance, the unique fixed-layout site-pure/uniform customer lexmax is the bad exact NE, while another NE at that occupancy preserves factor two.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-GREEDY-FIXED-POTENTIAL-NO","kind":"claim","track":"computation","title":"Fixed greedy-layout global customer-potential minimum can uniquely select bad NE","detail":"A second six-site integer instance has exactly two site-pure/uniform client NEs; exact potential values 86200 and 86264 make the unique global minimum the bad state with forced mixed-off-path ratio 215/107, while the other NE preserves budgets.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-ALL-OR-ONE-COMPONENT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for arbitrary-size all-or-one mixed-q components","detail":"Each mixed-q occupied component whose customers have one occupied option or all its sites admits descending-weight minimum-normalized-load assignment, exact on-path NE, greedy box and private-reserve singleton budgets; a full exact factor-two continuation is bit-polynomial.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-DESCENT-ONLY-TRAP-NO","kind":"claim","track":"computation","title":"Unique downward-only path can require an upward return","detail":"A strict-greedy three-site six-client integer chain has a unique maximal sequence of nonincreasing-q strict moves ending at a non-NE state; a weight-2 customer must return upward, though a true NE exists.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact fixed-instance counterexample; internally audited"},{"id":"SC-K-NESTED-ANCHOR-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for weight-ordered nested anchored partial overlaps","detail":"In each mixed-q greedy overlap component, the first-opened site covers all multi-option customers and their eligible occupied sets expand in nonincreasing weight order; restricted list assignment yields exact NE, the greedy load box and singleton private reserves give all deviations.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"E-K-NESTED-ANCHOR-AUDIT","kind":"evidence","track":"evidence","title":"Exact nested-anchor and reversed-options finite audit","detail":"Fraction calculations reproduce strict greedy sequence, on-path NE, range failure, and the failure of the unrestricted reversed-option list rule; finite check does not prove universal bound.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_nested_anchor.py","examples/multi_facility/greedy_nested_anchor.json"],"status":"finite arithmetic check"},{"id":"SC-K-GREEDY-SINGLETON-RESET","kind":"claim","track":"computation","title":"Singleton deviations reset to greedy assignment","detail":"For any original q=1 source with on-path payoff at least gamma, original singleton pools and high-q greedy weights give a pure off-path NE with deviator at most 2 gamma, independent of the selected on-path customers.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-GREEDY-BOX-TO-2","kind":"claim","track":"computation","title":"A box-constrained greedy NE completes factor two","detail":"Any supplied site-uniform exact on-path NE with all weights in the greedy site box has bit-polynomial full factor-two continuation; singleton reset removes orphan reservations.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-UNIFORM-LIGHT-FLOW-2","kind":"claim","track":"computation","title":"Uniform light multi-option weights give polynomial factor two","detail":"With a common weight delta for all multi-option clients lighter than gamma, lower-bounded integral convex-cost flow yields exact NE; reverse equal-unit transport path proves the upper box for arbitrary partial overlaps.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"E-K-UNIFORM-LIGHT-AUDIT","kind":"evidence","track":"evidence","title":"Three-site uniform-light exact audit","detail":"Strict greedy trace and four-assignment Fraction enumeration confirm the fixed chain instance, range separation and exact box NE; no universal proof follows.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_uniform_light_flow.py","examples/multi_facility/greedy_uniform_light_flow.json"],"status":"finite arithmetic check"},{"id":"SC-K-TWO-LIGHT-LOWER-POTENTIAL-NO","kind":"claim","track":"computation","title":"Two unequal light clients defeat lower-box potential selection","detail":"A strict greedy seven-facility integer family has a box NE, but its lower-constrained weighted-potential minimum uniquely overflows an upper box by one; this isolates an algorithmic selection failure.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"exact parametric obstruction; internally audited"},{"id":"E-K-TWO-LIGHT-POTENTIAL-AUDIT","kind":"evidence","track":"evidence","title":"Four-state unequal-light exact audit","detail":"Fraction check of strict greedy scores, all four lower-feasible allocations, potential order and two exact NEs for selected integer family members.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_two_light_potential.py","examples/multi_facility/greedy_two_light_potential.json"],"status":"finite arithmetic check"},{"id":"SC-K-STAR-LIGHT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two for anchored light-star components","detail":"Descending-weight queues on each leaf and smallest-load eligible-leaf choice produce exact client NE inside the greedy box for arbitrary unequal light weights; heavy cross-component customers freeze.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"E-K-STAR-LIGHT-AUDIT","kind":"evidence","track":"evidence","title":"Strict anchored-star unequal-light example","detail":"Fraction audit of six greedy insertions, one customer move, box, exact NE and failure of four previous sufficient conditions.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_star_edges.py","examples/multi_facility/greedy_star_edges.json"],"status":"finite arithmetic check"},{"id":"SC-K-RESET-PACK-INTERFACE","kind":"claim","track":"computation","title":"Greedy-pool deletion packing completes arbitrary high-minimum on-path NE","detail":"Greedy-pool deletion packing completes arbitrary high-minimum on-path NE. Exact hypotheses, polynomial-bit proof, limits and review status in current branch.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-DOUBLE-LPT-GREEDY-2","kind":"claim","track":"computation","title":"Double LPT certification of complete factor two beyond the site box","detail":"Double LPT certification of complete factor two beyond the site box. Exact hypotheses, polynomial-bit proof, limits and review status in current branch.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-PATH-EDGE-LIGHT-GREEDY-2","kind":"claim","track":"computation","title":"Polynomial factor two on directed light-overlap paths","detail":"Polynomial factor two on directed light-overlap paths. Exact hypotheses, polynomial-bit proof, limits and review status in current branch.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-BOX-NE-FPT-TYPES","kind":"claim","track":"computation","title":"Fixed-parameter exact boxed site-uniform NE decision by type ILP","detail":"Fixed-parameter exact boxed site-uniform NE decision by type ILP. Exact hypotheses, polynomial-bit proof, limits and review status in current branch.","refs":["research/current/multi_facility/type_compression.md","research/current/multi_facility/claims.md"],"status":"parameterized conditional algorithm; internally reviewed"},{"id":"SC-K-FROZEN-LIGHT-FPT","kind":"claim","track":"computation","title":"Fixed-parameter frozen-heavy light-component box construction","detail":"Fixed-parameter frozen-heavy light-component box construction. Exact hypotheses, polynomial-bit proof, limits and review status in current branch.","refs":["research/current/multi_facility/type_compression.md","research/current/multi_facility/claims.md"],"status":"parameterized conditional algorithm; internally reviewed"},{"id":"SC-K-CATALOG-WEIGHT-XP-2","kind":"claim","track":"computation","title":"Unconditional factor two for fixed catalog size and weight diversity","detail":"Unconditional factor two for fixed catalog size and weight diversity. Exact hypotheses, polynomial-bit proof, limits and review status in current branch.","refs":["research/current/multi_facility/type_compression.md","research/current/multi_facility/claims.md"],"status":"bounded-parameter XP algorithm; internally reviewed"},{"id":"E-K-DOUBLE-LPT-AUDIT","kind":"evidence","track":"evidence","title":"Three-site unequal-light triangle and over-box pure NE","detail":"Exact strict greedy, two LPT runs, two pure improvements, final NE and M upper-box violation.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_double_lpt.py","examples/multi_facility/greedy_double_lpt_triangle.json"],"status":"finite arithmetic check"},{"id":"E-K-PATH-EDGE-AUDIT","kind":"evidence","track":"evidence","title":"Four-site directed path witness","detail":"Exact greedy, two strict edge moves, box, all NE inequalities and prior-condition separation.","refs":["research/current/multi_facility/polytime_frontier.md","tests/audits/kfac_path_edges.py"],"status":"finite arithmetic check"},{"id":"SC-K-THREE-SITE-CHAIN-BOX-EXISTS","kind":"claim","track":"computation","title":"Box NE exists for arbitrary-weight directed three-site light chains","detail":"A whole upstream-pool return exchange rules out the only upper-box-blocked improvement at any full-box potential minimum; no polynomial minimization algorithm is established.","refs":["research/current/multi_facility/three_site_chain_box.md","research/current/multi_facility/claims.md"],"status":"conditional box-NE existence; internally reviewed"},{"id":"SC-K-CONVERGING-PATH-BOX-2","kind":"claim","track":"computation","title":"Polynomial factor two on a bounded converging light path","detail":"Four occupied sites with three movable light edge clients, descending multiplicities toward a tight lower-box A; at most seven strict moves produce a boxed client NE.","refs":["research/current/multi_facility/converging_path_box.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"E-K-CONVERGING-PATH-AUDIT","kind":"evidence","track":"evidence","title":"Converging path exact finite-state audit","detail":"Ten thousand generated boxed configurations, all reachable strict suffixes, 165 multiplicity triples, exact rational NE/box checks; finite evidence only.","refs":["research/current/multi_facility/converging_path_box.md","tests/audits/kfac_converging_path.py"],"status":"finite arithmetic check"},{"id":"SC-K-HEIGHT-TWO-BOX-EXISTS","kind":"claim","track":"computation","title":"Box NE exists on shallow opening-directed light graphs","detail":"Every full-box constrained potential minimum is exact client NE for arbitrary unequal-weight light edges, branching and merging, provided the longest directed path has at most two edges; no polynomial optimizer.","refs":["research/current/multi_facility/height_two_box.md","research/current/multi_facility/claims.md"],"status":"conditional box-NE existence; internally reviewed"},{"id":"SC-K-CONVERGING-PATH-4MOVE-2","kind":"claim","track":"computation","title":"Four-move boxed NE on a converging light path","detail":"Without tight A or equal q_A=q_C, one client per edge and greedy opening directions D->B->A<-C give an exact boxed NE in at most four strict moves and polynomial complete factor two.","refs":["research/current/multi_facility/converging_four_moves.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"E-K-CONVERGING-FOUR-AUDIT","kind":"evidence","track":"evidence","title":"Four-move converging path exact audit","detail":"Twenty thousand rational finite configurations across 3,172 multiplicity quadruples, including slack A and unequal A/C multiplicity; finite check only. A strict real-greedy nine-facility example attains all four moves, with exact final NE.","refs":["research/current/multi_facility/converging_four_moves.md","tests/audits/kfac_converging_four_moves.py","examples/multi_facility/greedy_converging_four_moves.json"],"status":"finite arithmetic check"},{"id":"E-K-HEIGHT-TWO-AUDIT","kind":"evidence","track":"evidence","title":"Four-site multi-parent unequal light graph","detail":"Fraction audit of strict greedy trace, all sixteen variable assignments, fifteen boxed assignments, exact potential minimum and client NE; separation from prior sufficient classes.","refs":["research/current/multi_facility/height_two_box.md","tests/audits/kfac_height_two.py","examples/multi_facility/greedy_height_two_unequal.json"],"status":"finite arithmetic check"},{"id":"SC-K-INCIDENCE-BOX-DP","kind":"claim","track":"computation","title":"Bounded-incidence exact box-NE selector","detail":"Fixed two-sided individual-client degree d and bipartite incidence treewidth tau yield a bit-polynomial exact feasibility decision and witness for frozen-heavy site-uniform boxed NE. The original selector theorem is unchanged; SC-K-BOX-STRUCTURED-POLY-2 separately combines it with universal greedy feasibility.","refs":["research/current/multi_facility/bounded_incidence_box.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-HEIGHT-TWO-INCIDENCE-2","kind":"claim","track":"computation","title":"Polynomial factor two on sparse shallow light graphs","detail":"Two-option light clients with opening-directed depth at most two plus fixed individual incidence degree and treewidth admit a boxed NE selector and full exact factor-two continuation.","refs":["research/current/multi_facility/bounded_incidence_box.md","research/current/multi_facility/height_two_box.md"],"status":"conditional polynomial theorem; internally reviewed"},{"id":"SC-K-LOCAL-WEIGHT-BOX-DP","kind":"claim","track":"computation","title":"Local-weight site-primal boxed-NE selector","detail":"Fixed site-primal width and fixed distinct incident light-weight count per site give a bit-polynomial exact frozen-heavy boxed-NE decision and witness. The original selector theorem is unchanged; the new structured corollary separately supplies universal greedy feasibility.","refs":["research/current/multi_facility/local_weight_box_dp.md","research/cu audits/kfac_box_lexmax.py"],"status":"finite arithmetic check"},{"id":"SRC-RESTRICTED-PARALLEL-LINKS-2004","kind":"source","track":"computation","title":"Restricted parallel links literature boundary","detail":"Gairing--Lücking--Mavronicolas--Monien give polynomial Nashification for restricted identical links and explicitly leave exact equilibrium computation for restricted related links open; this is a literature boundary, not a hardness theorem for MF-MODEL.","refs":["research/current/multi_facility/restricted_related_link_boundary.md"],"status":"published boundary recorded in current note; external priority check pending"},{"id":"SC-K-RQ-MIXED-BOX","kind":"obligation","track":"computation","title":"Mixed-q boxed site-equilibrium selector","detail":"Universal feasibility and a finite exact constructor at canonical greedy occupancy are supplied by SC-K-GREEDY-BOX-EXISTS. The remaining obligation is general input-bit-polynomial full-box site-pure/within-site-uniform NE selection, or another polynomial factor-two construction; no hardness claim.","refs":["research/current/multi_facility/restricted_related_link_boundary.md","research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/greedy_box_global_progress.md","research/questions/greedy_box_polytime.md","research/current/multi_facility/complement_search_reduction.md"],"status":"open algorithmic obligation; no hardness claim"},{"id":"MF-FROZEN-OVERLOAD-POLY","kind":"lemma","track":"computation","title":"Polynomial completion with frozen stationary overloads","detail":"At a fixed layout and cap B>=0, a feasible pure seed has ordinary loads <=B and frozen loads >B. Every frozen client external load is bounded by residual pure forced-client floors at all ordinary alternatives and other frozen loads. Maximum-preserving identical-link Nashification plus reinsertion yields a full pure NE with the ordinary mover <=B.","refs":["research/current/multi_facility/frozen_overload_completion.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; independently internally reviewed; unrefereed"},{"id":"SC-K-FROZEN-OVERLOAD-2","kind":"claim","track":"computation","title":"Complete factor two from deviator-specific overload certificates","detail":"Any supplied rational exact independent-mixed on-path NE, together with successful frozen-overload certificates at B=2a_f for every actual labeled deviation, has a bit-polynomial complete continuation. No all-input certificate generator is asserted.","refs":["research/current/multi_facility/frozen_overload_completion.md","research/current/multi_facility/claims.md"],"status":"conditional polynomial theorem; independently internally reviewed; unrefereed"},{"id":"E-K-FROZEN-OVERLOAD-AUDIT","kind":"evidence","track":"evidence","title":"Cap-41 frozen-overload strict separation","detail":"One exact residual fixture: 12 assignments, two capped pure NEs lifting to full NE; no universal conclusion inferred from execution.","refs":["research/current/multi_facility/frozen_overload_completion.md","tests/audits/kfac_frozen_overload.py"],"status":"finite arithmetic check"},{"id":"SC-K-GREEDY-BOX-EXISTS","kind":"claim","track":"computation","title":"Universal full-box NE at canonical greedy occupancy","detail":"The forward normalized greedy interface, full-box/H repair invariants and interleaved threshold-clipped-load/home-return-count potential give exact site-uniform box NE plus H for every input, freezing heavy and singleton-option clients. Arbitrary strict improvement choices followed by prescribed repair terminate in at most product_i |A_i|-1 microsteps; trace-free rational execution has polynomial space, not a proved polynomial time bound.","refs":["research/current/multi_facility/greedy_box_global_progress.md","history/source/notes/multi_facility/greedy_box_pro_report_2026-10-07.md"],"status":"complete current proof, independently internally reviewed; unrefereed"},{"id":"SC-K-GREEDY-BOX-FINITE-2","kind":"claim","track":"computation","title":"Finite exact factor-two constructor at the greedy occupancy","detail":"Universal greedy box-NE construction plus BOX-TO-2 and labeled complete continuation yield a finite exact factor-two rule. The connected executable uses finite cap-preserving pure best responses off path/default; it does not implement the published polynomial scheduler.","refs":["research/current/multi_facility/greedy_box_global_progress.md","research/current/multi_facility/polytime_frontier.md"],"status":"complete current proof, independently internally reviewed; unrefereed"},{"id":"SC-K-BOX-STRUCTURED-POLY-2","kind":"claim","track":"computation","title":"Polynomial factor two on either structured box-DP class","detail":"Universal frozen-heavy greedy box feasibility makes either existing bounded individual-incidence width/degree DP or bounded site-primal width/local-weight-diversity DP a total bit-polynomial selector; BOX-TO-2 completes the rule. No two-option/depth-two condition is needed. Old claim scopes are retained; DP and imported scheduler lack canonical implementations.","refs":["research/current/multi_facility/greedy_box_global_progress.md","research/current/multi_facility/bounded_incidence_box.md","research/current/multi_facility/local_weight_box_dp.md"],"status":"complete current proof, independently internally reviewed; unrefereed"},{"id":"MF-GREEDY-BOX-CODE","kind":"artifact","track":"computation","title":"Exact greedy-box constructor and finite continuation integration","detail":"Fraction implementation of deterministic H-guarded improvement plus return repair with exact final checks, connected to finite off-path/default pure best responses. No general polynomial runtime guarantee.","refs":["research/current/multi_facility/greedy_box_global_progress.md","multi_facility_spe/greedy_box.py","multi_facility_spe/__main__.py","multi_facility_spe/two_exists.py"],"status":"implemented; finite exact construction, no general polynomial time bound ual-light selector and BOX-TO-2 give a same-class polynomial mathematical factor-two continuation. The original MF class and n unit augmentations already appeared in UNIFORM-LIGHT-FLOW-2; current off-path/default code remains finite.","refs":["research/current/multi_facility/equal_light_flow.md","research/current/multi_facility/polytime_frontier.md"],"status":"complete current proof, independently internally reviewed; unrefereed"},{"id":"MF-EQUAL-LIGHT-FLOW-CODE","kind":"artifact","track":"computation","title":"Canonical polynomial equal-light on-path flow","detail":"Exact Bellman-Ford flow with n unit augmentations, indivisible client nodes, no binary multiplicity expansion, and explicit rejection of unequal movable weights; connected finite complete continuation.","refs":["research/current/multi_facility/equal_light_flow.md","multi_facility_spe/equal_light_flow.py","multi_facility_spe/greedy_box.py","multi_facility_spe/__main__.py"],"status":"polynomial on-path implementation; finite off-path completion"},{"id":"E-K-EQUAL-LIGHT-FLOW-AUDIT","kind":"evidence","track":"evidence","title":"Independent all-global-minima and residual boundary checks","detail":"Two separate exact enumeration oracles check canonical global optimizers. The second audit separately instruments SHA-256-locked attached source residuals, not canonical internals. Finite checks do not prove the theorem.","refs":["research/current/multi_facility/equal_light_flow.md","tests/audits/kfac_equal_light_flow.py","tests/audits/kfac_equal_light_flow_adversary.py","evidence/runs/2026-10-07/equal_light_flow.json","evidence/runs/2026-10-07/equal_light_flow_adversary.json"],"status":"finite independent exact checks"},{"id":"E-K-EQUAL-LIGHT-CONTINUATION-AUDIT","kind":"evidence","track":"evidence","title":"Complete original-model equal-flow continuation checks","detail":"Independent conditional-cost oracle validates 301 certificates, 1338 actual labeled deviations and 5613 complete-rule layout evaluations, includ
