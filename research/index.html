ith34 distinct unit customers and six distinct theme coverages has u1=29/3<v3=2411/246 by11/82. Matching static primal/dual certify the genuine max-min value; the optimal query distribution is unique. Aggregate W>=3v3 and half coverage remain true. Three is the minimum possible player count for this auxiliary failure, with no customer-count or topic-count minimality claim.","refs":["research/current/customer_attraction/individual_security_counterexample.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-IID-SECURITY-BENCHMARK","kind":"claim","track":"extensions","title":"静态对称独立同分布均衡的唯一覆盖安全上基准","detail":"For every common finite catalog, n>=1 and nonnegative customer masses, maximizers of expected harmonic potential are precisely symmetric mixed static Nash distributions. All maximizers have identical positive-type coverage probabilities for n>=2, and a unique expected coverage Z_n; n v_n<=Z_n<=OPT_n<=U. Does not establish sequential W>=Z_n or W>=n v_n.","refs":["research/current/customer_attraction/iid_security_and_flow_barriers.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-FULL-TREE-AVERAGING-NO","kind":"claim","track":"extensions","title":"深度与节点平均偏离流不能支付独立同分布目标","detail":"For the specified36-customer policy with six labels and uniform q, exact nonnegative separators exclude arbitrary nonnegative depth weights and even all43 node weights after averaging each node's deviations with q, plus any static Nash multipliers and nonnegative residuals. Separators violate the full SPE rows; only these compression templates are refuted. The unaveraged full-tree and other-Q bridges remain open.","refs":["research/current/customer_attraction/iid_security_and_flow_barriers.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-SELECTED-SECURITY-CONES","kind":"claim","track":"extensions","title":"三个指定完整策略锥的聚合混合安全值保证","detail":"For each of the stored36/61/89-source full policies, every nonnegative customer-type vector making that policy a full ordered-history SPE satisfies W>=n v_n. Matching common-Q identities are checked for every query and every63 nonempty type; two four-player policies also satisfy each individual bridge throughout the entire cone. Five fixed games at specified exact optimal query distributions separately have positive compensated budgets over every pure SPE; finite games are not a universal proof.","refs":["research/current/customer_attraction/selected_security_cones.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-TAIL-FOUR-ALL-N","kind":"claim","track":"extensions","title":"任意背景末段利润的合法提升与全人数弱界","detail":"For every shared-catalog unit model, every complete history-dependent pure SPE and n>=4, OPT_n<=(n/2-1/750)W. Depends jointly on the all-legal-background four-remaining profit theorem, combinatorial index-subset comparison, K/n true deviation floors, and the integer background load tax bound. Does not imply a constant-two bound for n>=5.","refs":["research/current/customer_attraction/tail_profit_lift.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-SEVEN-MAXIMA-N7-PLUS","kind":"claim","track":"extensions","title":"恰七极大且至少七玩家的已审来源证明记录","detail":"A complete source proof, independently audited in all finite coefficient branches and its analytic n>=13 tail, proves U=OPT_n<=2W with exactly seven maxima, arbitrary internal subthemes, all ties, and n>=7. This current page is a dependency and asset overview rather than the full current rewrite. For exactly seven maxima and n5/n6,16/44 route-target orbits remain missing; existing partial trees cannot close them.","refs":["research/current/customer_attraction/seven_maxima_checkpoint.md"],"status":"complete source proof independently audited; current dependency overview only; unrefereed"},{"id":"CA-GENERAL-GLUING-CHECKS","kind":"evidence","track":"evidence","title":"逐人安全值与完整树拼接边界的精确审计","detail":"Independent expanded-unit and compressed-type static/full-SPE checks; two independent flow reconstructions;4914 exact full-cone coefficient identities; five ordered-history full-SPE menu exhaustions. A separate seven-max source checkpoint preserves24,384 literal columns,988 compressed columns and partial seat coverage. No target or aggregate-safety counterexample is certified.","refs":["research/current/customer_attraction/individual_security_counterexample.md","research/current/customer_attraction/iid_security_and_flow_barriers.md","research/current/customer_attraction/selected_security_cones.md","research/current/customer_attraction/seven_maxima_checkpoint.md","evidence/runs/2026-10-10/customer_attraction_individual_security.json","evidence/runs/2026-10-10/customer_attraction_lift_and_flow_review.md"],"status":"exact scoped internal audits; unrefereed"},{"id":"CA-AGGREGATE-SECURITY-GAP","kind":"obligation","track":"extensions","title":"待解：一般目录的聚合混合安全值桥","detail":"For every finite common catalog, n and full ordered-history pure SPE, W>=n v_n. Would imply OPT_n<=(2-1/n)W. Individual u_i>=v_n is now false; all-p decorrelated budgets and compressed flow templates are also false. No full-SPE aggregate counterexample or universal certificate construction is available.","refs":["research/questions/customer_attraction_general_handoff.md","research/current/customer_attraction/security_cone_duality.md","research/current/customer_attraction/individual_security_counterexample.md"],"status":"open"},{"id":"CA-RANDOM-PREFIX-EXCHANGE-NO","kind":"claim","track":"extensions","title":"随机最优排列不能平均强制前缀玩家席位","detail":"Three disjoint themes of sizes2,2,1 and a complete13-history three-player pure SPE have unique optimal supportABC. After forcing the first two positions of a random optimal index permutation then following genuine last replies, the newest payoff4/3 is below half prefix total3/2 by1/6. Does not refute uniform charging or half coverage.","refs":["research/current/customer_attraction/random_position_exchange_boundary.md"],"status":"complete current proof and exact definition-level audit; unrefereed"},{"id":"CA-SECURITY-CHAIN-INTERFACE","kind":"claim","track":"extensions","title":"背景安全值单调链与全局净债恒等式","detail":"For every complete pure SPE, V_i=v_(n-i+1)(b_i) is nondecreasing, V_n=u_n, and sum[u_i-V_i+(n-i)(V_(i+1)-V_i)]=W-nV_1. W>=(n-1/2)V_1 would suffice for half coverage but the net-debt lower bound is open.","refs":["research/current/customer_attraction/security_chain_and_local_boundary.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-LOCAL-SECURITY-INDUCTION-NO","kind":"claim","track":"extensions","title":"真实根节点的局部安全值归纳反例","detail":"A113-unit three-player six-label full SPE has u=(95/3,110/3,110/3), W105, OPT113. Matching exact static saddles and elementary rational bounds certify a negative first strong debt and negative weak-coefficient local balance. Both global safety bridges hold; no size minimality claimed.","refs":["research/current/customer_attraction/security_chain_and_local_boundary.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-STATIONARY-PAIR-TRANSPORT","kind":"claim","track":"extensions","title":"末两人平稳回复的显式循环运输证书","detail":"For every fixed n-2 ordered prefix and every complete formal policy, a last-reply graph cycle produces a customer-independent static Q and nonnegative real-history Gamma multipliers with zero remainder for penultimate payoff minus each pure static query. The paired-template remainder is nonnegative for all types iff its action law is stationary.","refs":["research/current/customer_attraction/stationary_pair_transport.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-PRESCRIBED-STATIC-KERNELS-NO","kind":"claim","track":"extensions","title":"指定根平稳核与经验独立同分布核均可失败","detail":"A22-unit three-player full SPE refutes the prescribed root reply-member stationary Q cap W/n, while a7-unit full SPE refutes empirical terminal iid rivals at the weak cap W/(n-1/2). These are specified-Q failures, not failures of unrestricted Q, aggregate safety or half coverage.","refs":["research/current/customer_attraction/stationary_pair_transport.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-TERMINAL-REPLY-DUAL-LIFT","kind":"claim","track":"extensions","title":"末回复规范化下的构造式对偶提升","detail":"Canonical same-count last replies preserve root coverage and true last optimality, not earlier SPE. Terminal rows split into two nonnegative original rows; early errors are E=sum kappa delta on a deviation-rank DAG. Any formal normalized certificate with r+E>=0 lifts explicitly to original Gamma. Universal input multipliers and a global transfer budget remain open.","refs":["research/current/customer_attraction/terminal_reply_transport.md"],"status":"complete conditional transport theorem with independent internal reconstruction and exact audits; universal gluing open; unrefereed"},{"id":"CA-DYNAMIC-IID-DEBT-INTERFACE","kind":"claim","track":"extensions","title":"背景独立同分布 KKT 与全局利润净债接口","detail":"At any legal background, harmonic iid potential is concave, its maximizers are symmetric static Nash, and remaining profit Z is unique. Total coverage equals prefix rent plus Z. Along any actual path sum(Z_h-Z_child-u_h)=Z_n-W; debt<=Z_n/(2n) would imply half coverage but remains open. All real-field, full-history multipliers are retained in the exact conditional cone interface.","refs":["research/current/customer_attraction/dynamic_iid_debt_boundary.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-WEAK-LOCAL-IID-DRIFT-NO","kind":"claim","track":"extensions","title":"五玩家真实路径上的弱局部独立漂移反例","detail":"A60-unit five-player seven-label full SPE has path(P,P,0,3,4), profits(12,12,10,12,12), W58 and OPT60. At actual PP, Z3=97/3; at PP0, Z2=21. The third payoff10 is below(9/10)(Z3-Z2)=51/5. Weak global compensation holds; no exact root iid value is asserted.","refs":["research/current/customer_attraction/dynamic_iid_debt_boundary.md"],"status":"complete current proof with independent internal reconstruction and exact audits; unrefereed"},{"id":"CA-NEW-POLICY-CONE-SECURITY","kind":"claim","track":"extensions","title":"二十一个指定新完整策略锥的聚合安全值保证","detail":"For the21 saved ordered-history formal policies(n5,m7/8 and n6,m8), one common static Q per cone pays all pure queries using nonnegative separately weighted true Gamma rows. Therefore all nonnegative real customer masses making that policy an SPE satisfy W>=n v_n. Not a universal catalog class; some formal rule cones may be degenerate.","refs":["research/current/customer_attraction/policy_security_checkpoints.md"],"status":"complete current proof and exact definition-level audit; unrefereed"},{"id":"CA-FIVE-INDIVIDUAL-SECURITY-NO","kind":"claim","track":"extensions","title":"五玩家十极大目录的真正逐人安全值缺口","detail":"A86-unit five-player catalog has ten distinct pairwise incomparable maximal themes and a full11111-history SPE with first profit81/5 below the matched true v5=2262/139 by51/695. W85, OPT86, later profits86/5. Neither aggregate safety nor half coverage is refuted.","refs":["research/current/customer_attraction/policy_security_checkpoints.md"],"status":"complete current proof and exact definition-level audit; unrefereed"},{"id":"CA-WEAK-AGGREGATE-SECURITY-GAP","kind":"obligation","track":"extensions","title":"待解：足以推出半覆盖的弱聚合安全值桥","detail":"For every finite common catalog, n and full ordered-history pure SPE, prove W>=(n-1/2)v_n, equivalently the actual-path safety debt sum is at least-v_n/2. This open strengthening may be false. Local debt negativity does not refute it.","refs":["research/current/customer_attraction/security_chain_and_local_boundary.md","research/current/customer_attraction/stationary_pair_transport.md"],"status":"open"},{"id":"CA-TERMINAL-TRANSPORT-GAP","kind":"obligation","track":"extensions","title":"待解：直接半覆盖对偶的全局真实分支支付","detail":"For each full ordered policy and every legal n-theme comparison, construct separate nonnegative true-history multipliers paying2c-o. A canonical terminal module lifts any normalized formal certificate exactly when its residual plus transfer E is nonnegative; constructing universal inputs or an all-branch payment mechanism is open.","refs":["research/current/customer_attraction/terminal_reply_transport.md"],"status":"open"},{"id":"CA-WEAK-IID-GAP","kind":"obligation","track":"extensions","title":"待解：弱全局独立同分布净债界","detail":"For every full root pure SPE, prove W>=(1-1/(2n))Z_n, equivalently total dynamic iid debt<=Z_n/(2n). Would imply half coverage via n v_n<=Z_n and static safety. A genuine local weak-drift failure has later compensation and does not refute this global bridge.","refs":["research/current/customer_attraction/dynamic_iid_debt_boundary.md"],"status":"open"},{"id":"CA-TRANSPORT-CHECKS","kind":"evidence","track":"evidence","title":"全局运输接口与完整历史局部边界的精确审计","detail":"Independent rational audits of safety-chain, stationary paired rows, terminal normalization, background iid drift,21 complete cones and86-unit five-player security loss. Finite checks do not close arbitrary-policy gluing.","refs":["research/current/customer_attraction/security_chain_and_local_boundary.md","research/current/customer_attraction/stationary_pair_transport.md","research/current/customer_attraction/terminal_reply_transport.md","research/current/customer_attraction/dynamic_iid_debt_boundary.md","research/current/customer_attraction/policy_security_checkpoints.md","evidence/runs/2026-10-10/customer_attraction_stationary_pair.json","evidence/runs/2026-10-10/customer_attraction_stationary_pair_independent.json","evidence/runs/2026-10-10/customer_attraction_stationary_pair_review.md","evidence/runs/2026-10-10/dynamic_iid.json","evidence/runs/2026-10-10/dynamic_iid_independent.json","evidence/runs/2026-10-10/dynamic_iid_review.md","evidence/runs/2026-10-10/five_individual_security_independent.json","evidence/runs/2026-10-10/new_policy_security_cones_independent.json","evidence/runs/2026-10-10/new_policy_security_exploration.json","evidence/runs/2026-10-10/new_policy_security_selection.json","evidence/runs/2026-10-10/security_chain_independent.json","evidence/runs/2026-10-10/security_chain_review.md","evidence/runs/2026-10-10/security_chain_unit.json","evidence/runs/2026-10-10/terminal_transport_audit.json","evidence/runs/2026-10-10/terminal_transport_independent.json","evidence/runs/2026-10-10/terminal_transport_mathematical_review.json","evidence/runs/2026-10-10/transport_integration_checks.json"],"status":"exact internal audits; universal gaps retained"},{"id":"CA-TERMINAL-TIE-QUOTIENT-LIFT","kind":"claim","track":"extensions","title":"模互反末端激励行的构造式证书提升","detail":"For any complete formal policy and root-preserving same-count terminal normalization, a given normalized nonnegative certificate lifts while preserving its early weights if r+E belongs to the nonnegative orthant plus the explicitly paired terminal-row span. Signed tie coefficients are implemented by nonnegative original rows. This strictly extends the coordinatewise remainder condition; universal input multipliers remain unconstructed.","refs":["research/current/customer_attraction/terminal_tie_quotient.md"],"status":"complete stated-scope derivation, independently internally audited; general gluing open; unrefereed"},{"id":"CA-TERMINAL-TIE-LOCAL-QUADRATIC","kind":"claim","track":"extensions","title":"固定末端计数类中的精确二次判别","detail":"For a fixed terminal count q, membership of its incumbent correction in its own reciprocal-row span is characterized by singleton and pair Boolean coefficients plus the zero-prefix-load constraints, using O(m^2) linear equations. Per-count cancellation is sufficient but not necessary for global cancellation; real four-edge and cross-count examples distinguish the mechanisms.","refs":["research/current/customer_attraction/terminal_tie_quotient.md"],"status":"complete stated-scope derivation, independently internally audited; general gluing open; unrefereed"},{"id":"CA-TERMINAL-TIE-FIXED-LIFT-NO","kind":"claim","track":"extensions","title":"固定早期乘子时自然半覆盖证书未必能提升","detail":"Three unit customers and a complete three-player SPE admit a nonnegative normalized certificate for the natural 2c-o target whose preserved early payment leaves remainder s with s dot w=-3/2. Reciprocal terminal ties, and even additional nonnegative original incentive rows, cannot repair it without reducing or changing the early weights. A different normalized certificate in the same instance does lift; this is not a welfare or safety counterexample.","refs":["research/current/customer_attraction/terminal_tie_lift_obstruction.md"],"status":"complete stated-scope derivation, independently internally audited; general gluing open; unrefereed"},{"id":"CA-TERMINAL-TIE-CHECKS","kind":"evidence","track":"evidence","title":"全部客户类型的末端商空间与固定提升审计","detail":"Two independent definition-level Fraction programs check complete ordered histories, natural-target success and failure certificates, four real-edge cancellation, cross-count tie payment and the exact local Boolean characterization.","refs":["research/current/customer_attraction/terminal_tie_quotient.md","research/current/customer_attraction/terminal_tie_lift_obstruction.md","tests/audits/customer_attraction_terminal_tie_quotient.py","tests/audits/customer_attraction_terminal_tie_independent.py","evidence/runs/2026-10-10/terminal_tie_quotient_audit.json","evidence/runs/2026-10-10/terminal_tie_independent.json","evidence/runs/2026-10-10/terminal_tie_quotient_review.md"],"status":"independent internal finite exact audits; no universal welfare inference"},{"id":"WC-MODEL","kind":"definition","track":"weighted_congestion","title":"加权原子多项式费用拥塞模型","detail":"WC-TARGET v1: arbitrary positive weights, finite resource-subset strategies, nonnegative degree-at-most-d latencies; exact weak alpha-PNE convention.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/weighted_congestion_frontier/MODEL.md"],"status":"specified"},{"id":"WC-LIT-SOURCE","kind":"source","track":"weighted_congestion","title":"一手文献的两列构造精确包络","detail":"CGGPW Theorem1 equation3 parameter supremum; current account independently derives a sufficient O(sqrt d) ceiling for strict new-old comparison, not a model-wide upper.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/weighted_congestion_frontier/LITERATURE.md","research/reviews/weighted_congestion/odd_ring_linear_audit/literature_review.md"],"status":"primary source checked; comparison reconstructed"},{"id":"OC-INTERFACE-v1","kind":"lemma","track":"weighted_congestion","title":"奇环全状态排除与正系数闭环证书","detail":"Finite positive-weight odd hub/cohort ring; strict light/hub tests and exact product feasibility.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/weighted_congestion_frontier/CLAIMS.md"],"status":"complete current proof, independently reconstructed and exactly audited; unrefereed"},{"id":"OC-AMPLIFIER-LIMIT-v1","kind":"claim","track":"weighted_congestion","title":"线性重置奇环的随次数增长 d/ln d 下界","detail":"Every 1<alpha<H_d(t) is excluded by a finite game; in particular d>=4 excludes alpha=d/(ln d+2).","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/weighted_congestion_frontier/CLAIMS.md"],"status":"complete current proof, independently reconstructed and exactly audited; unrefereed"},{"id":"OC-AMPLIFIER-ENVELOPE-v1","kind":"claim","track":"weighted_congestion","title":"显式 E_d 端点倍率的有限非存在构造","detail":"Every integer d>=2 has a finite legal game with no E_d-PNE; E_d~d/ln d. This is a lower bound, not a universal upper.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/weighted_congestion_frontier/CLAIMS.md"],"status":"complete current proof, independently reconstructed and exactly audited; unrefereed"},{"id":"OC-LIGHT-FORCING-EXACT-v1","kind":"lemma","track":"weighted_congestion","title":"严格轻客户强制下失败 hub 边产生真实近似均衡","detail":"Conditional on every strict light-forcing inequality, nonexistence iff every hub inequality is strict; failed edge yields explicit PNE.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/weighted_congestion_frontier/CLAIMS.md"],"status":"complete current proof, independently reconstructed and exactly audited; unrefereed"},{"id":"OC-INTERFACE-BARRIER-v1","kind":"lemma","track":"weighted_congestion","title":"指定强制偏离证书内部的尖锐主阶限制","detail":"Strict interface requires (alpha-1)(alpha^(1/d)-1)<1. Only the stated mechanism is bounded, not a_*(d).","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/weighted_congestion_frontier/CLAIMS.md"],"status":"complete current proof, independently reconstructed and exactly audited; unrefereed"},{"id":"WC-R1-INTEGER-TRIAD","kind":"claim","track":"weighted_congestion","title":"二次整数三玩家构造的精确纯均衡倍率 286/267","detail":"Exactly the six-resource degree-two game with weights (16,2,5); all eight binary profiles and 24 deviations, including endpoint PNE.","refs":["research/current/weighted_congestion/README.md","research/current/weighted_congestion/quadratic_triad/three_player_integer_obstruction.md"],"status":"complete proof and exact replay; independent frozen review not recorded; unrefereed"},{"id":"WC-R1-RESOURCE-SUPPORT","kind":"claim","track":"weighted_congestion","title":"每资源潜在用户数有界时的 r 近似纯均衡","detail":"All finite positive-weight congestion games with nonnegative nondecreasing costs and at most r>=1 potential users per resource; unweighted social-cost minimizers are r-PNE. No full-class o(d) claim.","refs":["research/current/weighted_congestion/README.md","research/current/weighted_congestion/resource_support.md","research/current/weighted_congestion/resource_support.md"],"status":"complete proof and exact replay; independent frozen review not recorded; unrefereed"},{"id":"WC-R1-SOURCE-D2-ENVELOPE","kind":"claim","track":"weighted_congestion","title":"文献源公式在二次费用下的 19/18 包络上界","detail":"All integer n>=1,k in {1,2}, w,beta in [0,1] in arXiv:2002.07466v3 equation (3); strict polynomial inequalities cover zero denominators. Not a G2 upper bound.","refs":["research/current/weighted_congestion/README.md","research/current/weighted_congestion/quadratic_source/source_family_envelope.md"],"status":"complete self-contained proof, internally reconstructed and exactly checked; unrefereed"},{"id":"WC-R2-DENSITY-CONDITION","kind":"definition","track":"weighted_congestion","title":"资源局部半开权重窗口的玩家密度","detail":"R>1; every [x,Rx) window in each resource potential-user weight multiset contains at most K_R players counting multiplicities. Equality of weight ratio R lies outside a common half-open window.","refs":["research/current/weighted_congestion/weight_density.md"],"status":"specified"},{"id":"WC-R2-DENSITY-MOMENT","kind":"lemma","track":"weighted_congestion","title":"有限稀疏权重多重集的尖锐幂矩不等式","detail":"For 0<p<1 and K_R-sparse positive finite multiset: sum z_i^p <= [(1-R^-1)^p/(1-R^-p)] K_R^(1-p) (sum z_i)^p. Constant is a supremum approached by finite repeated geometric chains; not an equilibrium sharpness claim.","refs":["research/current/weighted_congestion/weight_density.md","research/reviews/weighted_congestion/weight_density/review.md"],"status":"complete general proof, independently internally checked; unrefereed"},{"id":"WC-R2-POLYNOMIAL-INCREMENT","kind":"lemma","track":"weighted_congestion","title":"真实负载下非负多项式费用的外部性增量界","detail":"For Y=X+w>0 and nonnegative polynomial degree<=d: c(Y)-c(X)<=min(1,dw/Y)c(Y), without division by costs. Degree zero and identically zero costs included.","refs":["research/current/weighted_congestion/weight_density.md","research/reviews/weighted_congestion/weight_density/review.md"],"status":"elementary complete derivation"},{"id":"WC-R2-WEIGHT-DENSITY","kind":"claim","track":"weighted_congestion","title":"资源局部权重密度控制的近似纯均衡存在性","detail":"Every unilateral local minimum of sum_i w_i^p C_i is [1+A_R(p)K_R^(1-p)d^p]-PNE for arbitrary real MODEL games. All strict above-factor improvements decrease this potential. R=d,p=ln2/lnd,d>=3 gives <=1+4K_d and geometrically separated spectra give O(log d). Not a full-class o(d) bound.","refs":["research/current/weighted_congestion/weight_density.md","research/reviews/weighted_congestion/weight_density/review.md"],"status":"complete general proof, independently internally checked; unrefereed"},{"id":"WC-R2-DENSITY-AUDIT","kind":"evidence","track":"weighted_congestion","title":"权重密度与实际偏离的精确有理审计","detail":"Fraction comparisons for p=1/m; moment and actual game move checks include mixed degrees, empty and common resources, zero costs, repeated weights and half-open endpoints. Finite evidence does not prove arbitrary-real statements.","refs":["research/current/weighted_congestion/weight_density.md","tests/audits/weighted_congestion_density.py","evidence/runs/2026-10-14/weighted_congestion_density.json"],"status":"executed finite exact audit"},{"id":"WC-R2-LOCAL-MARGINAL-MODEL","kind":"definition","track":"weighted_congestion","title":"带固定玩家乘子的资源子集边际证书模型","detail":"All potential-user subsets, fixed player multipliers, nonnegative polynomial costs and full multi-resource deviations; certificate versus equilibrium quantifiers kept separate.","refs":["research/current/weighted_congestion/power_bridge.md"],"status":"precise method domain; WC-TARGET still open"},{"id":"WC-R2-RESOURCE-POWER-BRIDGE","kind":"claim","track":"weighted_congestion","title":"稀疏幂乘子与有序资源势的拼接桥","detail":"Shared w_i^p multipliers permit per-resource selection between density and span bounds; ordering normalization requires the stronger min-weight lower marginal. No universal density control.","refs":["research/current/weighted_congestion/power_bridge.md","research/reviews/weighted_congestion/power_bridge/independent_review.md"],"status":"complete stated-scope proof, independently internally reconstructed and exactly checked; unrefereed"},{"id":"WC-R2-POWER-PATH-OBSTRUCTION","kind":"claim","track":"weighted_congestion","title":"固定次线性幂乘子无法统一夹住资源势边际","detail":"For every p<1 and finite alpha, a finite two-weight linear resource defeats every set-potential marginal sandwich with multipliers w_i^p. This is not equilibrium nonexistence.","refs":["research/current/weighted_congestion/power_bridge.md","research/reviews/weighted_congestion/power_bridge/path_review.md"],"status":"complete stated-scope proof, independently internally reconstructed and exactly checked; unrefereed"},{"id":"WC-R2-AFFINE-TWO-TYPE","kind":"claim","track":"weighted_congestion","title":"仿射费用两类权重的尖锐边际势证书","detail":"For fixed weights and type multipliers, explicit C1 piecewise potential plus self terms attains sqrt of the h/w density ratio; cross-multiplicity lower bound matches.","refs":["research/current/weighted_congestion/power_bridge.md","research/current/weighted_congestion/power_bridge/affine_two_type.md","research/reviews/weighted_congestion/power_bridge/path_review.md"],"status":"complete stated-scope proof, independently internally reconstructed and exactly checked; unrefereed"},{"id":"WC-R2-LOCAL-MARGINAL-CHECKS","kind":"evidence","track":"weighted_congestion","title":"幂势拼接与仿射两权类型的精确核验","detail":"Fraction insertion, packing, finite two-path, branch-boundary and affine self-correction checks. Finite evidence does not replace the real-domain proof.","refs":["research/current/weighted_congestion/power_bridge.md","tests/audits/weighted_power_bridge.py","evidence/runs/2026-10-14/weighted_power_bridge.json"],"status":"finite deterministic exact audit"},{"id":"WC-R2-DENSE-SCALE-GAP","kind":"obligation","track":"weighted_congestion","title":"待解：跨资源或依赖状态的稠密权尺度存在性桥","detail":"Uniform power-multiplier subset comparisons cannot handle arbitrary dense scales; a main-goal route must change the certificate or use additional full-deviation structure.","refs":["research/current/weighted_congestion/power_bridge.md"],"status":"open; no all-class o(d) result"},{"id":"WC-SOURCE-FORMULA","kind":"definition","track":"weighted_congestion","title":"文献源两攻击测试的参数包络 F_d","detail":"Exact original formula-(3) parameter supremum; a certificate minimum rather than each game's true threshold.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/source_envelope/sharp_asymptotic_envelope.md"],"status":"specified"},{"id":"R3-SOURCE-SHARP-ASYMPTOTIC-v1","kind":"claim","track":"weighted_congestion","title":"文献源两测试包络的尖锐渐近","detail":"F_d ~ (2/sqrt(e))*sqrt(d loglog d)/log d. Explicit rounded parameters attain the scale; arbitrary source parameter sequences satisfy the matching bound. No all-game upper conclusion.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/source_envelope/sharp_asymptotic_envelope.md","research/reviews/weighted_congestion/source_envelope/review.md"],"status":"complete current proofs, independently internally attacked; unrefereed"},{"id":"WC-R3-FULL-TOPOLOGY-REDUCTION-v3","kind":"claim","track":"weighted_congestion","title":"完整对称两列拓扑向原域单项式证书的还原","detail":"For alpha>=(1+sqrt(3))/2, no alpha-PNE in the arbitrary-polynomial symmetric two-column topology yields an original-domain monomial certificate. F_d <= T_d <= max{rho,F_d}.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/source_topology/symmetric_two_column_reduction.md","research/reviews/weighted_congestion/source_topology_review/review.md"],"status":"complete current proofs, independently internally attacked; unrefereed"},{"id":"WC-R3-SOURCE32-178-v1","kind":"claim","track":"weighted_congestion","title":"次数 32 文献源包络的全参数上界","detail":"For every original source parameter, min(H,L)<=89/50; all n,k and real w,beta are covered by analytic reduction plus exact negative interval certificates.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/source_degree32/symmetric_source_interval_certificate.md"],"status":"complete exact statements with independent internal reconstruction; unrefereed"},{"id":"WCF-R3-CROSS32-AUDIT-v1","kind":"claim","track":"weighted_congestion","title":"四玩家次数 32 的严格 9/5 非存在实例","detail":"One explicit rational four-player 14-resource game has strict >9/5 improvement at every pure state; its exact best factor is frozen. No growing lower-family implication.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/crossover/README.md"],"status":"complete exact statements with independent internal reconstruction; unrefereed"},{"id":"WCF-R3-FIXED-DEGREE-FAIL-v1","kind":"claim","track":"weighted_congestion","title":"交叉构造固定系数升次数不能保持 9/5","detail":"Keeping crossover weights/amplitudes and raising six degrees gives a 9/5-PNE at degree40; best factors converge to 5235403/2930833<9/5. Reweighting is not excluded.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/crossover/README.md"],"status":"complete exact statements with independent internal reconstruction; unrefereed"},{"id":"WC-R3-CROSS32-TOPOLOGY-SEPARATION-v1","kind":"claim","track":"weighted_congestion","title":"交叉构造超过完整对称次数 32 拓扑的包络","detail":"T32<=89/50<9/5<B(G), allowing all positive common light weights and arbitrary nonnegative principal/side polynomial coefficients in the symmetric topology.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/crossover/separation.md"],"status":"complete exact statements with independent internal reconstruction; unrefereed"},{"id":"WC-R3-DENSE-SHARE-v1","kind":"claim","track":"weighted_congestion","title":"Shapley 成本份额排序与局部权重包络","detail":"For all positive real finite weight sets and nonnegative polynomial c, uniform Shapley shares of W*c(W) have increasing raw shares, decreasing shares per weight, and minw*c(W)<=phi_i<=maxw*c(W).","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/weight_bands/README.md","research/reviews/weighted_congestion/weight_bands_review/independent_review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"WC-R3-DENSE-LOCAL-v1","kind":"claim","track":"weighted_congestion","title":"资源局部权重跨度的 Shapley 势 R 近似存在性","detail":"For every finite polynomial congestion game, resource potential-user weight ratio at most R>=1 ensures every stated scaled-potential minimizer is R-PNE, with no degree or cardinality factor. Empty strategies and zero costs included.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/weight_bands/README.md","research/reviews/weighted_congestion/weight_bands_review/independent_review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"WC-R3-DENSE-POT-SHARP-v1","kind":"claim","track":"weighted_congestion","title":"指定 Shapley 势选择器的 R 因子尖锐性","detail":"For every fixed R>1, an explicit finite-game sequence of local ratio R has unique stated-potential minimizers with factors tending to R, while each game has an exact PNE.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/weight_bands/README.md","research/reviews/weighted_congestion/weight_bands_review/independent_review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"WC-R3-BAND-CURL-v1","kind":"claim","track":"weighted_congestion","title":"权带分别归一化破坏普通势可积性","detail":"Two users of weights 1,M>1 with cubic total cost give incompatible mixed differences kappa versus kappa/M for separately normalized Shapley marginals. This does not rule out weighted or other potentials.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/weight_bands/README.md","research/reviews/weighted_congestion/weight_bands_review/independent_review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"WC-R3-BAND-LINEAR-v1","kind":"claim","track":"weighted_congestion","title":"稠密单点权带下指定势选择器仍有线性损失","detail":"For every integer d>=7 the specified unmodified/scaled Shapley selector has unique minima with factor at least d/6 although exact PNE exists. Optional empty-choice padding makes each potential band arbitrarily dense without rescuing this selector.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/weight_bands/README.md","research/reviews/weighted_congestion/weight_bands_review/independent_review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"WCF-R3-SCALED-ORIGINAL-v1","kind":"claim","track":"weighted_congestion","title":"原交叉幅度与缩小权重的常数下界族","detail":"For weights (1,1/(10m),1/(20m),1/(50m)), six degrees32m^2 and original amplitudes, B(G_m)->65/34 and every m>=1 has no9/5-PNE. Any fixed alpha<65/34 is obstructed for all sufficiently large m.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/crossover/limit_family.md","research/reviews/weighted_congestion/crossover_limit_review/review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"WCF-R3-SCALED-RETUNED-v2","kind":"claim","track":"weighted_congestion","title":"重调交叉幅度的常数族与统一起始指标","detail":"With exactly the displayed retuned rational amplitudes, every m>=20 and separately m=3 gives no2-PNE; m=1,2 have2-PNE; B(G_m)->100/49. Version1 m>=52 is a proved subcase, not silently rewritten.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/crossover/limit_family.md","research/reviews/weighted_congestion/crossover_limit_review/review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"WCF-R3-SCALED-TEMPLATE-v1","kind":"claim","track":"weighted_congestion","title":"指定偏离见证锥的三次可行性边界","detail":"For every real 1<=alpha<r, r>2 root of r^3-r^2-2r-1, fixed rational amplitudes and a finite M yield strict alpha improvement at every state for all m>=M. The selected-witness cone is infeasible at alpha>=r; full-topology optimality is unclaimed.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/crossover/limit_family.md","research/reviews/weighted_congestion/crossover_limit_review/review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"WC-R3-POTENTIAL-DENSITY-PADDING-v1","kind":"claim","track":"weighted_congestion","title":"潜在用户密度填充保留完整均衡存在问题","detail":"Arbitrary finite empty/{e} positive-weight padding preserves all finite-alpha equilibrium projection/lift and original deviation costs. Every occupied potential-weight interval can have minimum count L, yet that subclass and the full G_d have identical successful-factor sets and thresholds.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/density_padding/optional_user_density_padding.md","research/reviews/weighted_congestion/density_padding/review.md"],"status":"complete stated-scope proofs with independent internal reconstruction; unrefereed"},{"id":"WC-R3-ODD-RING-CERTIFICATE-v1","kind":"claim","track":"weighted_congestion","title":"奇环全状态与有理正系数证书","detail":"For odd m>=3, n_i>=1, positive u_i,v_i, 1<=k_i<=d and alpha>1, the specified two strict local tests have positive coefficients iff all N_i,Q_i>0 and product n_i N_i Q_i/(M_i P_i)>1. They exclude alpha-PNE at every state.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/odd_ring/cohort_lower_bound_and_envelope.md","research/reviews/weighted_congestion/odd_ring_independent/REVIEW.md","research/reviews/weighted_congestion/odd_ring_independent/EXACT_ENVELOPE_REVIEW.md","research/reviews/weighted_congestion/odd_ring_parameters/exact_envelope_review.md","research/reviews/weighted_congestion/odd_ring_literature/notes.md"],"status":"complete general proofs with independent internal reconstruction; unrefereed; global priority unverified"},{"id":"WC-R3-ODD-RING-ENVELOPE-v1","kind":"claim","track":"weighted_congestion","title":"奇环局部测试的精确次数包络","detail":"For each d>=2 and alpha>1, some finite odd ring satisfies the positive monomial local-test system iff alpha<T_d=sup_R>1 [R(1+R)^d+1]/[(1+R)^d+R^(d+1)]. H_d<T_d<=H_d+1/(2^d+1), H_d=d/[(d+1)d^(1/(d+1))-d], hence T_d~d/ln d.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/odd_ring/cohort_lower_bound_and_envelope.md","research/reviews/weighted_congestion/odd_ring_independent/REVIEW.md","research/reviews/weighted_congestion/odd_ring_independent/EXACT_ENVELOPE_REVIEW.md","research/reviews/weighted_congestion/odd_ring_parameters/exact_envelope_review.md","research/reviews/weighted_congestion/odd_ring_literature/notes.md"],"status":"complete general proofs with independent internal reconstruction; unrefereed; global priority unverified"},{"id":"WC-R3-ODD-RING-LOWER-v1","kind":"claim","track":"weighted_congestion","title":"完整模型首项常数为一的 d/ln d 增长下界","detail":"For every integer d>=2 and real 1<=alpha<T_d, a finite rational-weight/coefficient congestion game, all resource latencies positive monomials of degree exactly d, has no alpha-PNE. Therefore a_*(d)>=T_d~d/ln d and liminf a_*(d)ln(d)/d>=1.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/odd_ring/cohort_lower_bound_and_envelope.md","research/reviews/weighted_congestion/odd_ring_independent/REVIEW.md","research/reviews/weighted_congestion/odd_ring_independent/EXACT_ENVELOPE_REVIEW.md","research/reviews/weighted_congestion/odd_ring_parameters/exact_envelope_review.md","research/reviews/weighted_congestion/odd_ring_literature/notes.md"],"status":"complete general proofs with independent internal reconstruction; unrefereed; global priority unverified"},{"id":"WC-R3-ODD-RING-POLYNOMIAL-ENVELOPE-v1","kind":"claim","track":"weighted_congestion","title":"独立混合多项式形状不改变奇环测试包络","detail":"For d>=2 and alpha>1, allowing each odd-ring group independent nonnegative degree-at-most-d shapes F_i,G_i, common across its action copies/cohort, does not change positive two-local-test feasibility: some finite certificate exists iff alpha<T_d. Constants in mixtures and arbitrary positive real weights are covered; zero shapes cannot satisfy the strict tests.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/odd_ring/cohort_lower_bound_and_envelope.md","research/reviews/weighted_congestion/odd_ring_parameters/polynomial_envelope_review.md"],"status":"complete stated-scope proof with independent internal attack; unrefereed; global priority unverified"},{"id":"WC-R3-ODD-RING-SINGLETON-UPPER-v1","kind":"claim","track":"weighted_congestion","title":"单成员 cohort 奇环存在稳定缺陷状态","detail":"Every odd m>=3 ring with n_i=1 at every group, arbitrary positive real weights, symmetric action copies and nonnegative polynomial fees of degree at most d>=2 (zero fees permitted), has a min{2,T_d}-PNE. A T_d-PNE exists among the 2m single-conflict profiles modulo global action exchange.","refs":["research/current/weighted_congestion/odd_ring_linear.md","research/current/weighted_congestion/odd_ring/cohort_lower_bound_and_envelope.md","research/reviews/weighted_congestion/odd_ring_parameters/SINGLETON_NOTE.md"],"status":"complete restricted existence proof with internal reconstruction; unrefereed; priority unverified"},{"id":"WC-ENVELOPE-CEILING","kind":"claim","track":"weighted_congestion","title":"文献源双攻击证书的有限包络上界","detail":"论文式(3)两比值的最小值 R 若≥e²，则 R²≤8d ln ln R/(ln R)²；ln d≥16 时 R≤√128·√(d ln ln d)/ln d。","refs":["research/current/weighted_congestion/README.md","research/current/weighted_congestion/source_ceiling/README.md"],"status":"complete restricted proof; internally reviewed; unrefereed"},{"id":"WC-R1-LF-SHARP","kind":"claim","track":"weighted_congestion","title":"文献源包络尖锐渐近的候选证明","detail":"令F_d为论文式(3)对n,k,w,β的参数sup，则F_d∼(2/√e)·√(d ln ln d)/ln d；显式合法参数游戏对每个固定c<2/√e、全部充分大d无任何α<c·√(d ln ln d)/ln d的α-PNE。","refs":["research/current/weighted_congestion/README.md","research/questions/weighted_congestion/source_envelope_candidate/sharp_envelope.md"],"status":"complete account; stated extension review pending; unrefereed"},{"id":"WC-R1-PREFIX-SMOOTHING","kind":"claim","track":"weighted_congestion","title":"非负系数多项式的前缀曲率障碍","detail":"整数 m≥3，L=3/2−2^(−m)、H=3/2、U=2−2^(−m)。任意非零非负系数有限次数多项式 p 与 ε∈(0,1)，若 p(L)≤εp(H)，则 p(U)/p(H)≥ε^(−2^(m−2))；还必有 d≥log(1/ε)/log(H/L)。","refs":["research/current/weighted_congestion/README.md","research/current/weighted_congestion/polynomial_curvature/three_load_curvature_bound.md","research/reviews/weighted_congestion/polynomial_curvature/review.md"],"status":"complete restricted proof; internally reviewed; unrefereed"},{"id":"WC-R1-THREELOAD-ENVELOPE","kind":"claim","track":"weighted_congestion","title":"非负多项式三负载取值的精确权衡","detail":"Exact three-load polynomial tradeoff","refs":["research/current/weighted_congestion/README.md","research/current/weighted_congestion/polynomial_curvature/three_point_polynomial_envelope.md"],"status":"complete account; stated extension review pending; unrefereed"},{"id":"WC-R1-HET-ENDPOINT-REDUCTION","kind":"claim","track":"weighted_congestion","title":"异权两列端点证书向等权构造的还原","detail":"异权两列 star 的重玩家权 1，轻玩家正权 w_i，总重 W；主多项式 p、各卫星多项式 f_i 非负系数且次数≤d。若 α>1 时严格通过 p(1)+Σf_i(1+w_i)>α[p(1+W)+Σf_i(1)] 与每个 p(1+w_i)+f_i(w_i)>α[p(W)+f_i(1+w_i)]，则存在同次数同权整数 star，无 γ-PNE，其中 γ=1+(floor(n)/n)(α−1)>max{1,α−1/(α−1)}、n=W/w_i 为某个选中权重对应的实数中间量。","refs":["research/current/weighted_congestion/README.md","research/current/weighted_congestion/heterogeneous_endpoint/endpoint_reduction.md","research/reviews/weighted_congestion/heterogeneous_endpoint/review.md"],"status":"complete restricted proof; internally reviewed; unrefereed"},{"id":"WC-R1-DAG-STEP","kind":"claim","track":"weighted_congestion","title":"辅助有向无环 step 博弈的精确均衡门槛","detail":"完全采用 research/current/weighted_congestion/step_dag/step_dependency_threshold.md；任意 finite simple DAG 的对称 step dependency game，满足明确严格载荷分离与非负幅度，幅度全域的最佳纯均衡门槛为唯一 q=1+ΣP_kq^{-k}，由正幅度取得。","refs":["research/current/weighted_congestion/README.md","research/current/weighted_congestion/step_dag/step_dependency_threshold.md","research/reviews/weighted_congestion/step_dag/independent_review.md"],"status":"complete restricted proof; internally reviewed; unrefereed"},{"id":"WC-R1-MULTICOLUMN-2","kind":"claim","track":"weighted_congestion","title":"平衡多列构造的因子二逃逸","detail":"补列多列游戏存在2-PNE；q=3的拓扑最坏最佳均衡倍率的上确界恰为2。一般q固定、n→∞时最坏最佳倍率趋(q−1)/(q−2)，本结论允许次数随n增加。","refs":["research/current/weighted_congestion/README.md","research/current/weighted_congestion/multicolumn/complement_column_escape.md","research/reviews/weighted_congestion/multicolumn_review/REVIEW.md"],"status":"complete restricted proof; internally reviewed; unrefereed"},{"id":"WC-R1-MULTIPLIER-BARRIER","kind":"claim","track":"weighted_congestion","title":"任意玩家乘子的有限多尺度边际势障碍","detail":"For every d>=2 and alpha<rho_d, one finite weight vector defeats all set functions and all positive player multipliers in the all-subsets marginal sandwich.","refs":["research/current/weighted_congestion/separable_ordinal_obstruction.md","research/reviews/weighted_congestion/ordinal_potentials/game_specific_independent_attack.md"],"status":"complete stated-scope proof with independent reconstruction and exact finite audit; unrefereed"},{"id":"WC-R1-GAME-SPECIFIC-SEPARABLE-ORDINAL-BARRIER","kind":"claim","track":"weighted_congestion","title":"依完整游戏选择的资源可分序势线性障碍","detail":"For every d>=2 and alpha<rho_d, a fixed full-subset monomial game admits no resource-separable strict alpha-ordinal potential chosen after seeing the entire game; all-empty remains an exact PNE.","refs":["research/current/weighted_congestion/separable_ordinal_obstruction.md","research/reviews/weighted_congestion/ordinal_potentials/game_specific_independent_attack.md"],"status":"complete stated-scope proof with independent reconstruction and exact finite audit; unrefereed"},{"id":"WC-SEPARABLE-BUNDLE-AUDIT","kind":"evidence","track":"weighted_congestion","title":"多尺度路径、有限资源束与对称化的有理审计","detail":"Direct finite power sums, strict floor bounds and nonanonymous resource averaging; exact finite checks do not prove the general theorem.","refs":["research/current/weighted_congestion/separable_ordinal_obstruction.md","tests/audits/weighted_congestion/ordinal_potentials/verify_finite_bundle_bridge.py","evidence/runs/weighted_congestion/ordinal_potentials/finite_bundle_independent_checks.json"],"status":"executed finite exact audit"},{"id":"WC-ACTION-SIGNATURE-COMPRESSION-v1","kind":"claim","track":"weighted_congestion","title":"有限动作的资源签名压缩","detail":"For all fixed finite positive player weights and action counts, arbitrary-resource nonnegative polynomial games of degree<=d admit a cost-and-deviation-preserving representation using all nonempty action signatures; zero resources distinguish labels.","refs":["research/current/weighted_congestion/template_certificates/finite_action_duality.md","research/reviews/weighted_congestion/template_certificates/finite_action_duality_review.md"],"status":"complete general proof; independently reconstructed and exactly audited; unrefereed"},{"id":"WC-ALLSTATE-SELECTOR-ALTERNATIVE-v1","kind":"claim","track":"weighted_congestion","title":"全状态择证的精确线性替代","detail":"For every fixed action template and every all-state legal-deviation selector h, exactly one of a>=0,B_h a>0 or lambda>=0,sum lambda=1,B_h^T lambda<=0 exists; universal existence on that fixed template is equivalent to the dual for every h.","refs":["research/current/weighted_congestion/template_certificates/finite_action_duality.md","research/reviews/weighted_congestion/template_certificates/finite_action_duality_review.md"],"status":"complete general proof; independently reconstructed and exactly audited; unrefereed"},{"id":"WC-GAME-SPECIFIC-MINIMIZER-EQUIVALENCE-v1","kind":"claim","track":"weighted_congestion","title":"依游戏最小点选择与近似纯均衡存在等价","detail":"For every finite MODEL game and real alpha>=1, an alpha-PNE exists iff a game-specific resource-separable objective has all global minimizers alpha-PNE; incidence Hamming distance uniquely selects any prescribed state and supplies no new approximation bound.","refs":["research/current/weighted_congestion/separable_ordinal_obstruction.md","research/reviews/weighted_congestion/ordinal_potentials/minimizer_scope_review.md"],"status":"complete elementary proof; independently checked and exactly audited; unrefereed"},{"id":"WC-TEMPLATE-EXACT-AUDIT","kind":"evidence","track":"weighted_congestion","title":"动作签名与严格矩阵替代的有限有理核验","detail":"Literal resource costs and every finite deviation agree with compressed margins; independent small-matrix alternatives and incidence-distance checks are exact finite implementation evidence only.","refs":["research/current/weighted_congestion/template_certificates/finite_action_duality.md","tests/audits/weighted_congestion/template_certificates/verify_template_certificates.py","tests/audits/weighted_congestion/template_certificates/independent_two_column_alternative.py","evidence/runs/weighted_congestion/template_certificates/exact_audit.json","evidence/runs/weighted_congestion/template_certificates/independent_two_column_alternative.json","examples/weighted_congestion/template_certificates/exact_fixtures.json"],"status":"finite exact audit; no universal approximation bound"},{"id":"WC-HIGH-DEGREE-SHARE-DEFINITION","kind":"definition","track":"weighted_congestion","title":"高次份额势的资源参数","detail":"U_e为潜在用户；q_e为最小个体份额，k_e为最低非零正次数；常数/无人资源λ_e=1，其余λ_e=1−(1−q_e)^k_e。","refs":["research/current/weighted_congestion/high_degree_share.md"],"status":"definition"},{"id":"WC-HIGH-DEGREE-SHARE-v1","kind":"claim","track":"weighted_congestion","title":"高次费用的份额势与必要小份额","detail":"每个MODEL有限游戏，费用c_e=a_e0+Σ_(j≥k_e)a_ej x^j，按实际非零最低正次数k_e定义λ_e=1−(1−min_(i∈U_e)w_i/Σ_(j∈U_e)w_j)^k_e；无用户或无正次项取λ_e=1。势Σ_e[a_e0 n_e+Σ_(j≥1)a_ej x_e^j]的每个单方局部最小点是(max_e λ_e^−1)-PNE。纯d次无α-PNE必有某正次收费资源潜在用户份额严格小于1−(1−1/α)^(1/d)。固定正权向量的最低正次数趋无穷时，保证对所有有限拓扑及系数一致趋1。","refs":["research/current/weighted_congestion/high_degree_share.md","research/reviews/weighted_congestion/high_degree_share_review.md"],"status":"complete structural proof; internally reviewed; unrefereed"},{"id":"WC-HIGH-DEGREE-SHARE-AUDIT","kind":"evidence","track":"weighted_congestion","title":"高次份额势的两套有限精确核验","detail":"作者local λ逐资源核验；独立global q简式全偏离核验。有限证据不替代一般证明。","refs":["research/current/weighted_congestion/high_degree_share.md","tests/audits/weighted_congestion/high_degree_share/verify.py","tests/audits/weighted_congestion/high_degree_share/check_independent.py","evidence/runs/weighted_congestion/high_degree_share/verification.json","evidence/runs/weighted_congestion/high_degree_share/independent_verification.json"],"status":"finite exact audit"},{"id":"WC-INTEGER-MONOMIAL-COUNTEREXAMPLE-v1","kind":"claim","track":"weighted_congestion","title":"严格反例的整数单位单项式规范形","detail":"For every fixed d>=0 and real alpha>=1, a full MODEL no-alpha-PNE game exists iff one with positive integer player weights, unit monomial resources x^k and nonempty strategies exists; no size bound is asserted.","refs":["research/current/weighted_congestion/template_certificates/integer_counterexample_normal_form.md","research/reviews/weighted_congestion/template_certificates/integer_counterexample_normal_form_review.md"],"status":"complete direct proof; independently reconstructed and exactly audited; unrefereed"},{"id":"WC-UNIVERSAL-THRESHOLD-ENDPOINT-v1","kind":"claim","track":"weighted_congestion","title":"普遍阈值的端点闭性","detail":"Every finite game has an attained finite best factor beta; the universal feasible factors are [a_*(d),infinity), and a_* equals the supremum over the integer monomial class. No single game need attain that supremum.","refs":["research/current/weighted_congestion/template_certificates/integer_counterexample_normal_form.md","research/reviews/weighted_congestion/template_certificates/integer_counterexample_normal_form_review.md"],"status":"complete direct proof; independently reconstructed and exactly audited; unrefereed"},{"id":"WC-INTEGER-NORMAL-FORM-AUDIT","kind":"evidence","track":"weighted_congestion","title":"整数单项式规范形的逐状态有理核验","detail":"Exact finite checks of denominator clearing, literal unit resource costs, action quotients, empty strategies, zero costs, markers and weak endpoints; not a proof for arbitrary real parameters.","refs":["research/current/weighted_congestion/template_certificates/integer_counterexample_normal_form.md","tests/audits/weighted_congestion/template_certificates/verify_integer_normal_form.py","evidence/runs/weighted_congestion/template_certificates/integer_normal_form_audit.json"],"status":"executed finite exact audit"},{"id":"WC-ORDERED-TAIL-PARAMETERS","kind":"definition","track":"weighted_congestion","title":"有序权组的潜在尾部参数","detail":"有序分割覆盖全部玩家；a,b在同资源同组潜在用户取最小/最大权，L为后续组潜在总权，A=max(b/a)(1+L/a)^d。","refs":["research/current/weighted_congestion/weight_bands/ordered_tail_freezing.md"],"status":"exact definition"},{"id":"WC-DAG-ENDPOINT-TESTS","kind":"definition","track":"weighted_congestion","title":"DAG低高端点检测与路径生成函数","detail":"非零非负degree≤d费用，只检测根W/1与卫星(1+out)/(1+w)的统一泄漏；P_k计k顶点路径。","refs":["research/current/weighted_congestion/polynomial_curvature/dag_low_leakage_budget.md"],"status":"exact definition"},{"id":"WC-ORDERED-COHORT-FREEZING-v1","kind":"claim","track":"weighted_congestion","title":"有序权组的尾部负载冻结存在界","detail":"任意MODEL游戏、d≥0和玩家有序非空划分，资源组潜在用户最小/最大权a,b与后组潜在总权L定义A=max_(e,j)(b/a)(1+L/a)^d（无潜在用户取1）。依次固定先组背景，最小化按(1+L/a)^d/a缩放的活动组Shapley势并冻结，任取阶段全局最小均得到A-PNE。若组内比≤R且L≤εa，给R(1+ε)^d；不控制全类最佳划分参数。","refs":["research/current/weighted_congestion/weight_bands/ordered_tail_freezing.md","research/reviews/weighted_congestion/weight_bands/ordered_tail_freezing_review.md"],"status":"complete stated-scope proof; independently reconstructed and exactly audited; unrefereed"},{"id":"WC-ORDERED-TAIL-PARAMETER-LIMIT-v1","kind":"claim","track":"weighted_congestion","title":"两权级有序尾部参数的精确最优值","detail":"任意d≥1,H≥1,K≥1，单资源一名权H玩家及K名单位权玩家、费用x^d、人人可选空策略或该资源。全部有序非空划分的最小A恰为min{H,(1+K/H)^d}。K=ceil(H²)时恰H，固定d仍可无界；游戏有全空精确PNE。","refs":["research/current/weighted_congestion/weight_bands/ordered_tail_freezing.md","research/reviews/weighted_congestion/weight_bands/ordered_tail_freezing_review.md"],"status":"complete stated-scope proof; independently reconstructed and exactly audited; unrefereed"},{"id":"WC-DAG-LOW-LEAKAGE-DEGREE-BUDGET-v1","kind":"claim","track":"weighted_congestion","title":"有向无环阶跃端点的低泄漏次数预算","detail":"任意非空有限simple DAG、d≥1及ε∈(0,1)，令z=ε^(-1/d),P_k为k顶点有向路径数,S_D(z)=ΣP_kz^(k−1)。存在根权1、正轻权W<1及outsum<w_v、非零非负degree≤d费用通过p0(W)≤εp0(1)和pv(1+outsum)≤εpv(1+w_v)，当且仅当z(z−1)S_D(z)≤1。全部可行权有正文slack表示；饱和时权唯一。原辅助step阈值q满足q(q−1)≤1/[z(z−1)]≤d/ln(1/ε)，固定ε的√d量级在检测系统内可达。","refs":["research/current/weighted_congestion/polynomial_curvature/dag_low_leakage_budget.md","research/reviews/weighted_congestion/polynomial_curvature/dag_low_leakage_budget_review.md"],"status":"complete stated-scope proof; independently reconstructed and exactly audited; unrefereed"},{"id":"ORDERED-TAIL-FREEZING-AUDIT","kind":"evidence","track":"weighted_congestion","title":"有序尾部冻结的独立有限精确证据","detail":"只核验冻结输入和实现，不证明任意实权或任意有限规模。","refs":["research/current/weighted_congestion/weight_bands/ordered_tail_freezing.md","tests/audits/weighted_congestion/weight_bands/verify_ordered_tail_freezing.py","tests/audits/weighted_congestion/weight_bands/independent_tail_freezing.py","tests/audits/weighted_congestion/weight_bands/independent_tail_parameter.py","evidence/runs/weighted_congestion/weight_bands/ordered_tail_freezing.json","evidence/runs/weighted_congestion/weight_bands/ordered_tail_freezing_independent.json","evidence/runs/weighted_congestion/weight_bands/ordered_tail_parameter_independent.json"],"status":"finite exact audit"},{"id":"DAG-LOW-LEAKAGE-BUDGET-AUDIT","kind":"evidence","track":"weighted_congestion","title":"DAG低泄漏次数预算的独立有限精确证据","detail":"只核验冻结输入和实现，不证明任意实权或任意有限规模。","refs":["research/current/weighted_congestion/polynomial_curvature/dag_low_leakage_budget.md","tests/audits/weighted_congestion/polynomial_curvature/verify_dag_low_leakage.py","tests/audits/weighted_congestion/polynomial_curvature/independent_dag_low_leakage.py","evidence/runs/weighted_congestion/polynomial_curvature/dag_low_leakage.json","evidence/runs/weighted_congestion/polynomial_curvature/dag_low_leakage_independent.json"],"status":"finite exact audit"},{"id":"WC-TAIL-AND-DAG-UNIFORM-GAP","kind":"obligation","track":"weighted_congestion","title":"潜在尾部与固定低泄漏以外的全类选态义务","detail":"A参数在两权级族无界；固定端点低漏的step阈值仅√d。仍须用实际占用、异质泄漏、重开早组或全状态非势机制判定全类目标。","refs":["research/current/weighted_congestion/weight_bands/ordered_tail_freezing.md","research/current/weighted_congestion/polynomial_curvature/dag_low_leakage_budget.md"],"status":"OPEN"},{"id":"WC-SELECTOR-UNIT-SPEED-STATIONARY-BARRIER-v1","kind":"claim","track":"weighted_congestion","title":"单位速度平稳择证的无界损失","detail":"For every finite real alpha>=1 and d>=1, some finite positive rational weight two-action template and full selector have no unit-speed stationary dual, already witnessed by an affine column; this is no nonexistence result.","refs":["research/current/weighted_congestion/template_certificates/stationary_selector_obstruction.md","research/reviews/weighted_congestion/template_certificates/stationary_selector_obstruction_review.md"],"status":"complete stated-scope proof; independently reconstructed and exactly audited; unrefereed"},{"id":"WC-AFFINE-SELECTOR-CYCLE-DUAL-v1","kind":"claim","track":"weighted_congestion","title":"任意仿射择证的循环权重对偶","detail":"For every finite positive-weight action template and tagged selector, every selected cycle gives an affine dual by lambda_s proportional to the selected mover weight; self-loops are allowed and all affine columns sum to zero at alpha=1.","refs":["research/current/weighted_congestion/template_certificates/stationary_selector_obstruction.md","research/reviews/weighted_congestion/template_certificates/stationary_selector_obstruction_review.md"],"status":"complete stated-scope proof; independently reconstructed and exactly audited; unrefereed"},{"id":"WC-RECURRENT-SUPPORT-FIP-EQUIVALENCE-v1","kind":"claim","track":"weighted_congestion","title":"循环支撑择证与全模板有限改善性等价","detail":"For fixed finite weights, action counts, degree and real alpha>=1, and every fixed nonempty column subcone (including the full signature family), every selector admits a dual supported on its recurrent states iff every nonnegative-coefficient game on that template has no strict alpha-improvement cycle; this is stronger than mere PNE existence.","refs":["research/current/weighted_congestion/template_certificates/stationary_selector_obstruction.md","research/reviews/weighted_congestion/template_certificates/stationary_selector_obstruction_review.md"],"status":"complete stated-scope proof; independently reconstructed and exactly audited; unrefereed"},{"id":"WC-DIRECTED-FANOUT-FORCING-CUT-v1","kind":"claim","track":"weighted_congestion","title":"分叉双人侧反馈的统一强迫割均衡","detail":"For d>=2 and alpha>=T_d, every finite unique-source light/multihead-private-pair-side topology satisfying the weak uniform aligned-light forcing inequalities admits an all-anti alpha-PNE selected by any local minimum of the stated weighted cut; no unrestricted existence claim.","refs":["research/current/weighted_congestion/directed_fanout_forcing_cut.md","research/reviews/weighted_congestion/directed_fanout_forcing_cut_review.md"],"status":"complete stated-scope proof; independently reconstructed and exactly audited; unrefereed"},{"id":"WC-DIRECTED-FANOUT-UF-MODEL","kind":"definition","track":"weighted_congestion","title":"唯一源主资源、私有双人侧反馈与统一强迫条件","detail":"Each light has one main-resource source and finitely many private side pairs with one destination hub each; symmetric binary resource copies, real positive weights and UF as explicitly written.","refs":["research/current/weighted_congestion/directed_fanout_forcing_cut.md"],"status":"specified exact topology and forcing hypothesis"},{"id":"WC-SELECTOR-CYCLE-AUDIT","kind":"evidence","track":"weighted_congestion","title":"择证循环、全部签名与回返支撑的有理审计","detail":"Exact finite implementation checks only; general real-parameter claims rest on their manuscript proofs.","refs":["research/current/weighted_congestion/template_certificates/stationary_selector_obstruction.md","tests/audits/weighted_congestion/template_certificates/verify_stationary_selector_obstruction.py","evidence/runs/weighted_congestion/template_certificates/stationary_selector_obstruction_audit.json"],"status":"executed finite exact audit"},{"id":"WC-FANOUT-CUT-AUDIT","kind":"evidence","track":"weighted_congestion","title":"有向分叉实际资源、局部割与端点的有理审计","detail":"Exact finite implementation checks only; general real-parameter claims rest on their manuscript proofs.","refs":["research/current/weighted_congestion/directed_fanout_forcing_cut.md","tests/audits/weighted_congestion/verify_directed_fanout_forcing_cut.py","evidence/runs/weighted_congestion/directed_fanout_forcing_cut_audit.json"],"status":"executed finite exact audit"},{"id":"WC-DAG-EXTREMAL-AMPLITUDE-NORMALIZATION","kind":"definition","track":"weighted_congestion","title":"DAG双列多项式与阶跃极值幅度锚定","detail":"固定原DAG binary策略、root1、W<1、outsum<w；p0(1)=A>0,pv(1+wv)=A hv(q_D)，其余非负多项式形状任意。","refs":["research/current/weighted_congestion/step_dag/polynomial_extremal_all_in.md"],"status":"exact restricted definition"},{"id":"WC-DAG-EXTREMAL-AMPLITUDE-ALL-IN-v1","kind":"claim","track":"weighted_congestion","title":"阶跃DAG极值幅度的多项式全入状态","detail":"任意非空有限simple DAG，root权1、正轻权W<1且outsum<w_v、原双列binary策略；两列相同非零非负degree≤d费用，d≥1。令q=q_D>1、h_v=(1+Σ_in h_u)/q且Σh=q−1，存在A>0使p0(1)=A、pv(1+w_v)=A h_v。真实全入状态是max{1+1/q,B_d(q)}-PNE，B_d(q)=q/[1+(q−1)(1+1/[q(q−1)])^(−d)]；d≥16时统一为4√(d/ln d)-PNE。不要求低漏/高平台保真，但必须保留极值幅度条件。","refs":["research/current/weighted_congestion/step_dag/polynomial_extremal_all_in.md","research/reviews/weighted_congestion/step_dag/polynomial_extremal_all_in_review.md"],"status":"complete restricted proof; independently reconstructed and exactly audited; unrefereed"},{"id":"WC-DAG-EXTREMAL-ALL-IN-AUDIT","kind":"evidence","track":"weighted_congestion","title":"真实多项式全入状态的两份有限精确证据","detail":"作者整数q图网格与独立seed实际资源输入；只检查实现及边界，不证明所有有限DAG。","refs":["research/current/weighted_congestion/step_dag/polynomial_extremal_all_in.md","tests/audits/weighted_congestion/step_dag/verify_polynomial_extremal_all_in.py","tests/audits/weighted_congestion/step_dag/independent_polynomial_all_in.py","evidence/runs/weighted_congestion/step_dag/polynomial_extremal_all_in.json","evidence/runs/weighted_congestion/step_dag/polynomial_extremal_all_in_independent.json"],"status":"finite exact audit"},{"id":"WC-TWO-WEIGHT-ORDER-DEFINITION","kind":"definition","track":"weighted_congestion","title":"两权类别的双排序离散积分","detail":"全局两权a≥b>0；D、U分别降序/升序加权右端点积分，λ为共同混合参数，玩家类别固定。","refs":["research/current/weighted_congestion/weight_bands/two_weight_order_blend.md"],"status":"definition"},{"id":"WC-TWO-WEIGHT-ORDER-BLEND-v1","kind":"claim","track":"weighted_congestion","title":"两权类别双排序混合势的平方根次数存在界","detail":"对每个d≥2及MODEL有限游戏，若所有玩家权重属于固定{a,b}、a≥b>0，则双排序混合势的每个单方局部最小点为A_d=(1+√(4d−3))/2-PNE，任意严格A_d改善终止；各类人数、权比、拓扑和系数任意。d≤1或仅一权时有精确PNE。不是任意权重全类上界。","refs":["resea n.","refs":["research/current/multi_facility/uniform_two.md"],"status":"internal proof"},{"id":"e-mf-symmetric-obstruction","kind":"derives","track":"extensions","premises":["MF-MODEL","MF-SYMMETRIC-FAMILY","MF-CONT-COMPLETE"],"conclusion":"SC-K-SYMMETRIC-MENU-OBSTRUCTION","statement":"The strict excluded-load inequality forces the symmetric threat, while asymmetric pure exceptions give an exact full-model SPE.","refs":["research/current/multi_facility/symmetric_menu_obstruction.md"],"status":"internal proof"},{"id":"e-mf-layout-barrier","kind":"derives","track":"extensions","premises":["MF-MODEL","MF-LEXMAX-FAMILY","MF-CONT-COMPLETE"],"conclusion":"SC-K-LEXMAX-BARRIER","statement":"Classify every lexmax occupancy, use total mass and a strict forced deviation for its lower bound, then exhibit both attaining and exact alternative continuations.","refs":["research/current/multi_facility/lexmax_boundary.md"],"status":"internal proof"},{"id":"e-mf-implementation","kind":"implements","track":"computation","premises":["MF-EXACT-CODE"],"conclusion":"SC-K-2-E","statement":"The exact exhaustive implementation constructs a certificate; it is not the proof and has no polynomial bound.","refs":["research/current/multi_facility/uniform_two.md"],"status":"scope-limited implementation evidence"},{"id":"e-mf-independent-checks","kind":"checks","track":"evidence","premises":["MF-EXACT-AUDIT"],"conclusion":"MF-EXACT-CODE","statement":"Direct conditional-cost, independent full pure-NE enumeration, and explicit-family witness checks attack arithmetic and scope.","refs":["research/current/multi_facility/reverse_review.md"],"status":"scope-limited implementation evidence"},{"id":"e-mf-layout-limit","kind":"limits","track":"extensions","premises":["SC-K-LEXMAX-BARRIER"],"conclusion":"SC-K-2-E","statement":"Do not sharpen the factor by changing only NE choices at the same selected lexmax layout; no global sharpness lower bound follows.","refs":["research/current/multi_facility/lexmax_bound ly itself has an easy exact SPE.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"scope-limited proof"},{"id":"e-mf-greedy-budget","kind":"derives","track":"computation","premises":["MF-MODEL"],"conclusion":"SC-K-GREEDY-BUDGET","statement":"At the last insertion to each source site, every target score is at most the source final load; new-coverage inclusion handles both vanishing-source overlap terms.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-mf-greedy-ne-limit","kind":"limits","track":"computation","premises":["SC-K-GREEDY-BUDGET"],"conclusion":"SC-K-LOCAL-PLS","statement":"Four positive integer clients at three sites yield a budget-feasible greedy state whose fixed-layout unique NE violates an orphan-aware budget; budget construction alone does not solve the local joint search.","refs":["research/current/multi_facility/polytime_frontier.md","research/current/multi_facility/claims.md"],"status":"scope-limited proof"},{"id":"e-sc-k-greedy-unopened-2","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET"],"conclusion":"SC-K-GREEDY-UNOPENED-2","statement":"The final greedy score lower-bounds all initial loads and upper-bounds unopened new reach; strict customer site transfers improve sorted loads lexicographically, preserving the minimum.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-sc-k-equal-mult-greedy-2","kind":"derives","track":"computation","premises":["MF-MODEL","SC-K-GREEDY-BUDGET","MF-PACK-2","MF-PURE-CAP-POLY","MF-CONT-COMPLETE"],"conclusion":"SC-K-EQUAL-MULT-GREEDY-2","statement":"For equal q>=2, the published range-preserving identical-link Nashification gives exact on-path NE and retains the two source-surviving budgets, enabling bit-polynomial factor-two continuation.","refs":["research/current/multi_facility/polytime_frontier.md"],"status":"internal proof"},{"id":"e-sc-k-distinct-greedy
