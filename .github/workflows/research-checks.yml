name: Research tools
on:
  push:
    branches: [rebuild/research-v2, main]
    paths: ['work.py', 'tools/*.py', 'tools/vendor/**', 'tests/**', '.github/workflows/research-checks.yml']
  pull_request:
    paths: ['work.py', 'tools/*.py', 'tools/vendor/**', 'tests/**', '.github/workflows/research-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/compute.py runtime-smoke --out validation/runtime-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: research-validation-${{ github.sha }}
          path: validation/
          retention-days: 7
