<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>家庭现金流压力测试</title>
<style>
:root{--paper:#f5f3ed;--white:#fffeFA;--ink:#163b39;--muted:#546765;--line:#cdd5cb;--forest:#11685c;--mint:#dcece2;--rust:#963e2f;--pink:#fae4da;--ochre:#a16b25;--mono:ui-monospace,"SFMono-Regular",Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif}header{background:var(--ink);color:#f8f7ee}
.head,.wrap,.tabs{max-width:1390px;margin:auto}.head{padding:28px clamp(16px,4vw,60px) 27px;display:flex;gap:22px;align-items:center;justify-content:space-between}.eyebrow{font-size:12px;letter-spacing:.12em;color:#a4d7be;font-weight:650}.head h1{font-family:Georgia,"Songti SC","SimSun",serif;font-size:clamp(32px,4vw,54px);line-height:1.2;margin:5px 0 9px;font-weight:550;letter-spacing:.015em}.head p{margin:0;color:#d3e2d7}.wrap{padding:20px clamp(12px,3vw,46px) 54px}.tabsBar{background:var(--white);border-bottom:1px solid var(--line)}.tabs{padding:0 clamp(12px,3vw,46px);display:flex;gap:5px;overflow-x:auto}.tabs button{background:none;border:0;border-radius:0;border-bottom:3px solid transparent;white-space:nowrap;padding:13px 15px;color:var(--muted)}.tabs button[aria-selected=true]{border-color:var(--forest);color:var(--forest);font-weight:750}
button,.filebtn,select,input,textarea{font:inherit}button,.filebtn{cursor:pointer;background:var(--white);color:var(--ink);border:1px solid #a5b7aa;border-radius:6px;padding:7px 12px;line-height:1.45;font-weight:600}button:hover,.filebtn:hover{background:#edf2e9}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #dcac57;outline-offset:2px}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--forest);color:white;border-color:var(--forest)}.primary:hover{background:#0a5148}.danger{color:var(--rust);border-color:#dcb7aa}.bar,.control,.cardhead,.pair{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.bar{justify-content:space-between;margin:0 0 17px}.head .control{justify-content:flex-end}.head button,.head .filebtn{background:#254b47;color:#f8f7ee;border-color:#78998d}.head button:hover,.head .filebtn:hover{background:#315d55}.marker{padding:3px 10px;border-radius:3px;background:#d8e5dc;color:#284e43;font-weight:650;white-space:nowrap}.marker.sample{background:#f8d8a0;color:#613c0c}.small,small,.muted{color:var(--muted);font-size:13px}.status{min-height:1.4em;font-size:14px;color:var(--muted)}.error{color:var(--rust);font-weight:650}.panel{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin:0 0 14px}.sectiontitle{font-size:24px;font-family:Georgia,"Songti SC","SimSun",serif;font-weight:650;line-height:1.35;margin:0 0 8px}.sub{font-size:17px;margin:9px 0 6px}p{margin:.45em 0 .8em}.cols{display:grid;grid-template-columns:minmax(0,2.25fr) minmax(245px,1fr);gap:16px;align-items:start}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(172px,100%),1fr));gap:9px 14px}.field{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:13px;min-width:0}.field input,.field select,textarea,select{border:1px solid #acbab0;background:white;color:var(--ink);border-radius:5px;min-width:0;padding:6px 7px}.field input,.field select{width:100%;height:35px;font-size:14px}.field input[aria-invalid=true]{border-color:var(--rust)}.field input[type=checkbox]{width:18px;height:18px;margin-top:7px}
details.panel{padding:0}details.panel>summary{padding:12px 20px;cursor:pointer;font-weight:700}details.panel[open]>summary{border-bottom:1px solid var(--line)}.in{padding:12px 20px 17px}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-of-type{margin-bottom:8px}.item>summary{cursor:pointer;color:var(--forest);font-weight:650}.item .fields{padding:9px 0}.item details{margin:7px 0}.item details>summary{cursor:pointer;color:var(--muted);font-size:13px}.sticky{position:sticky;top:10px}.metricgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:10px 0}.metric{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:#f4f7ee}.metric strong{display:block;font-size:clamp(19px,2vw,30px);font-variant-numeric:tabular-nums}.metric span{color:var(--muted);font-size:12px}.verdict{border-left:5px solid var(--forest);background:var(--mint);padding:12px 15px;margin:10px 0}.verdict.fail{border-left-color:var(--rust);background:var(--pink)}.scroll{overflow:auto;max-width:100%;margin:6px 0 10px}.tall{max-height:450px}.compact th,.compact td{padding:5px 8px}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th,td{padding:7px 9px;border-bottom:1px solid #d9ded5;vertical-align:top}th{background:#edf2e9;white-space:nowrap;font-weight:650}td.num{font-family:var(--mono);white-space:nowrap;text-align:right}thead{position:sticky;top:0;z-index:1}tr.selected{background:#e2f0e6}.linkbtn,.tag{padding:3px 8px;font-size:13px}.tag{background:#e7f1e7;border-color:#c6d6c9;margin:2px}.chart{width:100%;height:auto;display:block;background:#fafbf5;border-radius:6px}.chart text{font:12px system-ui,sans-serif;fill:#4d615b}.chip{display:inline-block;background:#e8eee6;color:#38584c;border-radius:4px;padding:2px 6px;font-size:12px}.selectrow{display:flex;gap:9px;align-items:end;flex-wrap:wrap;margin:8px 0}.selectrow label{min-width:120px;max-width:100%}.selectrow select{max-width:100%}.foot{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:12px;margin-top:25px}.hidden,[hidden]{display:none!important}.rowactions{margin:9px 0}.mono{font-family:var(--mono);font-size:13px}.summaryline{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{color:var(--forest);font-size:13px;font-weight:600}.filebtn input{display:none}.explain{padding-left:19px}.explain li{margin:4px 0}
@media(max-width:760px){.head{display:block;padding:18px 15px}.head .control{justify-content:flex-start;margin-top:12px}.wrap{padding-top:12px}.cols{display:block}.sticky{position:static}.panel{padding:13px 12px}.in{padding:10px 12px}.tabs{gap:0}.tabs button{padding:10px;font-size:14px}.metricgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.field{font-size:12px}.bar{align-items:start}.chart text{font-size:15px}.head p{font-size:13px}th,td{padding:5px 6px}.tall{max-height:370px}}
@media(max-width:360px){.fields{grid-template-columns:1fr}.tabs button{padding:8px 6px}}
</style></head>
<body>
<header><div class="head"><div><div class="eyebrow">家庭决策工作表</div><h1>家庭现金流压力测试</h1><p>逐月核对到账、生活支出和合同还款，查看家庭能维持履约的时间。</p></div>
<div class="control"><button id="loadDemo">载入合成示例</button><label class="filebtn">导入 JSON<input id="importFile" type="file" accept=".json,application/json"></label><button id="exportJSON">导出 JSON</button></div></div></header>
<div class="tabsBar"><nav class="tabs" aria-label="工作表"><button data-tab="inputs" aria-selected="true">家庭与情景</button><button data-tab="results" aria-selected="false">方案比较</button><button data-tab="ledger" aria-selected="false">逐月台账</button><button data-tab="reverse" aria-selected="false">逆向压力</button></nav></div>
<main class="wrap"><div class="bar"><div class="control"><span id="kind" class="marker"></span><span id="status" class="status" role="status" aria-live="polite"></span></div><button id="run" class="primary">运行 120 个月</button></div>
<section id="inputs" class="view"></section><section id="results" class="view" hidden></section><section id="ledger" class="view" hidden></section><section id="reverse" class="view" hidden></section>
<div class="foot">账面资产、待到账款和可用现金分别列账。结果以元计，实际净资产按各路径通胀折回期初购买力。</div></main>
<script id="scenario-data" type="application/json">@@SCENARIOS@@</script><script id="example-data" type="application/json">@@EXAMPLE@@</script>
<script>@@ENGINE@@</script><script>@@UI@@</script></body></html>
